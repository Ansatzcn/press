<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,interactive-widget=resizes-content">
<title>Press</title>
<style>
*{box-sizing:border-box}html,body{margin:0}body{min-height:100vh;padding:24px 12px 70px;background:#f5f7fa;color:#0f172a;font-family:"Times New Roman","Microsoft YaHei","PingFang SC",serif}button,input,textarea{font:inherit}.hidden{display:none!important}.app{width:min(1080px,100%);margin:auto;background:#fff;border-radius:26px;padding:26px;box-shadow:0 18px 45px rgba(15,23,42,.13)}h1{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin:0 0 18px;padding-bottom:12px;border-bottom:2px solid #e8edf4}.status{display:inline-flex;align-items:center;gap:7px;padding:6px 11px;border-radius:999px;background:#f1f5f9;font-size:13px;font-weight:600;color:#475569}.dot{width:9px;height:9px;border-radius:50%;background:#94a3b8}.dot.online{background:#22c55e}.dot.syncing{background:#f59e0b}.dot.offline{background:#ef4444}.toolbar{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:18px}.toolbar-left{display:flex;gap:8px;flex-wrap:wrap}.btn{border:1px solid #cbd5e1;background:#fff;color:#334155;border-radius:999px;padding:8px 14px;cursor:pointer}.btn:hover{background:#f1f5f9}.btn:disabled{opacity:.55;cursor:not-allowed}.btn.primary{border-color:#1e293b;background:#1e293b;color:#fff}.btn.danger{border-color:#fecaca;background:#fee2e2;color:#991b1b}.small{font-size:12px;color:#94a3b8}.panel{border:1px solid #e2e8f0;background:#f8fafc;border-radius:20px;padding:18px;margin-bottom:22px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:13px}.full{grid-column:1/-1}.field{display:flex;flex-direction:column;gap:5px}.field label{font-size:12px;font-weight:700;color:#475569}.field input,.field textarea{width:100%;border:1px solid #cbd5e1;border-radius:13px;background:#fff;padding:11px 13px;outline:none;color:#0f172a}.field input:focus,.field textarea:focus{border-color:#93c5fd;box-shadow:0 0 0 2px #dbeafe}.field input[readonly]{background:#f1f5f9;color:#334155;font-weight:700}.groups{display:flex;gap:7px;flex-wrap:wrap;min-height:44px;align-items:center}.group-btn{border:1px solid #cbd5e1;border-radius:8px;background:#fff;padding:7px 10px;cursor:pointer}.group-btn.on{border-color:#1E40AF;background:#eaf1ff;color:#1E40AF;font-weight:700}.add-btn{grid-column:1/-1;border:0;border-radius:999px;padding:12px;background:#1e293b;color:#fff;font-weight:700;cursor:pointer}.list-head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:9px}.badge{padding:4px 10px;border-radius:999px;background:#e8edf4;font-size:12px}.list{border:1px solid #e2e8f0;border-radius:18px;overflow:hidden}.item{position:relative;padding:15px 17px}.item+.item{border-top:2px solid #e2e8f0}.title{font-weight:700;color:#1E40AF;line-height:1.5}.title a,.institution a,.institution a:visited,.institution a:hover{color:#1E40AF;text-decoration:none}.title a:hover,.institution a:hover{text-decoration:underline}.meta{display:grid;gap:3px;margin-top:7px;font-size:14px;line-height:1.5;color:#000}.row{display:grid;grid-template-columns:3.4em minmax(0,1fr)}.label{color:#64748b}.edit-btn{position:absolute;right:17px;bottom:15px;border:0;background:transparent;color:#000;cursor:pointer}.empty{padding:35px;text-align:center;color:#94a3b8}.overlay{position:fixed;inset:0;z-index:1000;display:flex;align-items:center;justify-content:center;padding:12px;background:rgba(15,23,42,.45);backdrop-filter:blur(4px)}.dialog{width:min(620px,100%);max-height:calc(100dvh - 24px);overflow:auto;background:#fff;border-radius:22px;padding:20px;box-shadow:0 30px 70px rgba(15,23,42,.25)}.dialog h2{margin-top:0}.actions{display:flex;gap:8px;justify-content:flex-end;margin-top:16px}.actions .danger{margin-right:auto}.toast{position:fixed;left:50%;bottom:26px;z-index:2000;transform:translateX(-50%);max-width:90vw;padding:10px 18px;border-radius:999px;background:#1E40AF;color:#fff;font-size:13px}.toast.error{background:#dc2626}.toast.success{background:#16a34a}.warn{color:#b45309}.code-note{font-size:12px;color:#64748b;margin-top:4px}#topBtn{position:fixed;right:16px;top:70%;z-index:900;width:28px;height:28px;border:0;border-radius:50%;background:#1E40AF;cursor:pointer}
@media(max-width:720px){body{padding:9px}.app{padding:16px;border-radius:19px}.grid{grid-template-columns:1fr}.full{grid-column:auto}.toolbar{align-items:flex-start}.dialog{padding:16px}}
</style>
</head>
<body>
<main class="app">
<h1>Press <span class="status"><span id="dot" class="dot"></span><span id="statusText">正在读取数据</span></span></h1>
<div class="toolbar">
  <div class="toolbar-left">
    <button id="syncBtn" class="btn hidden" type="button">同步</button>
    <button id="configBtn" class="btn" type="button">配置</button>
    <button id="manageBtn" class="btn" type="button">排序</button>
    <button id="importBtn" class="btn" type="button">导入</button>
    <button id="exportBtn" class="btn" type="button">导出</button>
    <input id="importFile" class="hidden" type="file" accept="application/json,.json">
  </div>
  <span id="lastSync" class="small">公开阅读无需 Token</span>
</div>

<section id="addPanel" class="panel hidden">
<h2>添加</h2>
<div class="grid">
  <div class="field full"><label for="bookName">书名</label><input id="bookName" autocomplete="off"></div>
  <div class="field"><label for="bookNo">书号</label><input id="bookNo" autocomplete="off"></div>
  <div class="field"><label>编组</label><div id="addGroups" class="groups"></div></div>
  <div class="field"><label for="addCode">编码</label><input id="addCode" readonly><div class="code-note">选择编组后立即生成；服务器同步负责并发仲裁</div></div>
  <div class="field full"><label for="institution">出版</label><input id="institution" list="institutionList" autocomplete="off"><datalist id="institutionList"></datalist></div>
  <div class="field full"><label for="category">书架</label><input id="category" list="categoryList" autocomplete="off"><datalist id="categoryList"></datalist></div>
  <button id="addBtn" class="add-btn" type="button">添加</button>
</div>
</section>

<section>
<div class="list-head"><h2>总表</h2><span id="count" class="badge">0/0/0</span></div>
<div id="list" class="list"><div class="empty">加载中</div></div>
</section>
</main>

<section id="editModal" class="overlay hidden">
<div class="dialog">
<h2>编辑</h2>
<div class="grid">
  <div class="field full"><label for="editBookName">书名</label><input id="editBookName"></div>
  <div class="field"><label for="editBookNo">书号</label><input id="editBookNo"></div>
  <div class="field"><label>编组</label><div id="editGroups" class="groups"></div></div>
  <div class="field"><label for="editCode">编码</label><input id="editCode" inputmode="numeric" maxlength="6"><div id="editCodeNote" class="code-note"></div></div>
  <div class="field full"><label for="editInstitution">出版</label><input id="editInstitution" list="institutionList"></div>
  <div class="field full"><label for="editCategory">书架</label><input id="editCategory" list="categoryList"></div>
</div>
<div class="actions">
  <button id="deleteBtn" class="btn danger" type="button">删除</button>
  <button id="editCancel" class="btn" type="button">取消</button>
  <button id="editSave" class="btn primary" type="button">保存</button>
</div>
</div>
</section>

<section id="configModal" class="overlay hidden">
<div class="dialog">
<h2>GitHub 管理配置</h2>
<div class="grid">
  <div class="field"><label for="cfgOwner">仓库所有者</label><input id="cfgOwner"></div>
  <div class="field"><label for="cfgRepo">仓库名称</label><input id="cfgRepo"></div>
  <div class="field full"><label for="cfgPath">数据文件路径</label><input id="cfgPath" value="press_data.json"></div>
  <div class="field full"><label for="cfgToken">GitHub Personal Access Token</label><input id="cfgToken" type="password"></div>
  <label class="full"><input id="rememberToken" type="checkbox" checked> 在本设备保存 Token</label>
</div>
<div class="actions"><button id="configCancel" class="btn" type="button">取消</button><button id="configSave" class="btn primary" type="button">保存并连接</button></div>
</div>
</section>

<section id="manageModal" class="overlay hidden">
<div class="dialog">
<h2>出版排序</h2>
<div class="field"><label for="institutionText">每行一个出版选项，行序即显示顺序</label><textarea id="institutionText" rows="16"></textarea></div>
<div class="actions"><button id="manageCancel" class="btn" type="button">取消</button><button id="manageSave" class="btn primary" type="button">保存</button></div>
</div>
</section>

<button id="topBtn" type="button" title="回到顶部"></button>
<div id="toast" class="toast hidden"></div>

<script>
(()=>{
'use strict';

const PUBLIC_FILE='press_data.json';
const STORE='press_safe_v10';
const SYNC_INTERVAL=60000;
const FETCH_TIMEOUT=15000;
const MAX_BYTES=750*1024;
const GROUP_CODES=['11','12','13','14','21','22','23'];
const GROUP_OPTIONS=GROUP_CODES.map(x=>x+'组');
const CODE_GROUP_OPTIONS=[...GROUP_CODES,'24'];

const CODE_RULES={
 zh:{
  groups:{
   '11':[[110001,117999],[160001,167999]],
   '12':[[120001,127999]],
   '13':[[130001,137999],[180001,187999]],
   '14':[[140001,147999]],
   '21':[[210001,217999]],
   '22':[[220001,227999]],
   '23':[[230001,237999],[270001,277999],[280001,289999]],
   '24':[[240001,247999]]
  },
  exceptions:{
   '11/13':[[118001,119999]],
   '11/22':[[228001,229999]],
   '11/23':[[238001,239999]],
   '13/21':[[218001,219999]],
   '13/22':[[138001,139999]],
   '13/23':[[188001,189999]],
   '21/22':[[260001,267999]],
   '21/23':[[278001,279999]]
  }
 },
 en:{
  groups:{
   '11':[[150001,157999]],
   '12':[[128001,129999],[168001,169999]],
   '13':[[170001,179999]],
   '14':[[148001,149999]],
   '21':[[250001,259999]],
   '22':[[220001,227999]],
   '23':[[230001,237999],[270001,277999],[280001,289999]],
   '24':[[248001,249999]]
  },
  exceptions:{
   '11/13':[[158001,159999]],
   '13/21':[[268001,269999]]
  }
 }
};

const $=id=>document.getElementById(id);

const ui={
 dot:$('dot'),
 status:$('statusText'),
 last:$('lastSync'),
 sync:$('syncBtn'),
 config:$('configBtn'),
 manage:$('manageBtn'),
 imp:$('importBtn'),
 exp:$('exportBtn'),
 impFile:$('importFile'),

 addPanel:$('addPanel'),
 bookName:$('bookName'),
 bookNo:$('bookNo'),
 addGroups:$('addGroups'),
 addCode:$('addCode'),
 institution:$('institution'),
 category:$('category'),
 add:$('addBtn'),

 institutionList:$('institutionList'),
 categoryList:$('categoryList'),
 list:$('list'),
 count:$('count'),

 editModal:$('editModal'),
 editBookName:$('editBookName'),
 editBookNo:$('editBookNo'),
 editGroups:$('editGroups'),
 editCode:$('editCode'),
 editCodeNote:$('editCodeNote'),
 editInstitution:$('editInstitution'),
 editCategory:$('editCategory'),
 delete:$('deleteBtn'),
 editCancel:$('editCancel'),
 editSave:$('editSave'),

 configModal:$('configModal'),
 cfgOwner:$('cfgOwner'),
 cfgRepo:$('cfgRepo'),
 cfgPath:$('cfgPath'),
 cfgToken:$('cfgToken'),
 remember:$('rememberToken'),
 configCancel:$('configCancel'),
 configSave:$('configSave'),

 manageModal:$('manageModal'),
 institutionText:$('institutionText'),
 manageCancel:$('manageCancel'),
 manageSave:$('manageSave'),

 toast:$('toast'),
 top:$('topBtn')
};

let state={
 schemaVersion:10,
 entries:[],
 institutions:[],
 categories:[],
 tags:[...GROUP_OPTIONS]
};

let baseState=null;

let config={
 owner:'',
 repo:'',
 path:'press_data.json',
 token:''
};

let dirty=false;
let sha=null;
let syncBusy=false;
let syncQueued=false;
let mutationVersion=0;

let editId='';
let editOriginal=null;

let addDraftId=uid();
let addSelected=[];
let editSelected=[];
let editAutoMode=false;

let toastTimer=null;
let intervalId=null;

function uid(){
 return crypto?.randomUUID
  ? crypto.randomUUID()
  : `press_${Date.now()}_${Math.random().toString(36).slice(2)}`;
}

function clean(v){
 return String(v??'').normalize('NFC').trim();
}

function fold(v){
 return clean(v).normalize('NFKC');
}

function key(v){
 return fold(v).toLocaleLowerCase('zh-CN');
}

function clone(v){
 return JSON.parse(JSON.stringify(v));
}

function same(a,b){
 return JSON.stringify(a)===JSON.stringify(b);
}

function uniq(values){
 const m=new Map();

 for(const raw of values||[]){
  const v=clean(raw);

  if(v&&!m.has(key(v))){
   m.set(key(v),v);
  }
 }

 return [...m.values()];
}

function escapeHtml(v){
 const d=document.createElement('div');
 d.textContent=String(v??'');
 return d.innerHTML;
}

function escapeAttr(v){
 return escapeHtml(v).replace(/"/g,'&quot;');
}

function normalizeGroup(v){
 const x=fold(v).replace(/组$/,'');

 return GROUP_CODES.includes(x)
  ? x+'组'
  : clean(v);
}

function groupCode(v){
 const x=fold(v).replace(/组$/,'');

 return CODE_GROUP_OPTIONS.includes(x)
  ? x
  : '';
}

function sortGroups(arr){
 return uniq(
  arr.map(normalizeGroup)
 ).sort(
  (a,b)=>
   (Number(groupCode(a))||999)-
   (Number(groupCode(b))||999)
 );
}

function titleIsChinese(raw){
 const s=String(raw??'').replace(
  /\[([^\]]+)\]\((?:https?:\/\/)?[^)]+\)/gi,
  '$1'
 );

 return /[\u3400-\u4DBF\u4E00-\u9FFF\uF900-\uFAFF]/.test(s);
}

function normalizeCode(v){
 const x=fold(v);

 return /^\d{6}$/.test(x)
  ? x
  : '';
}

function mergeRanges(ranges){
 const a=(ranges||[])
  .map(r=>[
   +r[0],
   +r[1]
  ])
  .filter(
   r=>
    Number.isFinite(r[0]) &&
    Number.isFinite(r[1]) &&
    r[0]<=r[1]
  )
  .sort(
   (x,y)=>
    x[0]-y[0] ||
    x[1]-y[1]
  );

 const out=[];

 for(const r of a){
  const last=out[out.length-1];

  if(
   last &&
   r[0]<=last[1]+1
  ){
   last[1]=Math.max(
    last[1],
    r[1]
   );
  }else{
   out.push([...r]);
  }
 }

 return out;
}

function codeRanges(entry){
 const groups=sortGroups(
  entry.tag||[]
 )
 .map(groupCode)
 .filter(Boolean);

 if(
  !groups.length ||
  groups.some(
   g=>
    !CODE_GROUP_OPTIONS.includes(g)
  )
 ){
  return [];
 }

 const rules=
  titleIsChinese(entry.bookName)
   ? CODE_RULES.zh
   : CODE_RULES.en;

 const combo=groups.join('/');

 return mergeRanges(
  rules.exceptions[combo] ||
  groups.flatMap(
   g=>
    rules.groups[g] ||
    []
  )
 );
}

function codeAllowed(entry,code){
 const n=Number(
  normalizeCode(code)
 );

 return (
  Number.isInteger(n) &&
  codeRanges(entry).some(
   ([a,b])=>
    n>=a &&
    n<=b
  )
 );
}

function usedCodes(entries,excludeId=''){
 const s=new Set();

 for(const e of entries){
  if(e.id===excludeId){
   continue;
  }

  const c=normalizeCode(e.code);

  if(c){
   s.add(Number(c));
  }
 }

 return s;
}

function smallestCode(entry,used){
 for(const [a,b] of codeRanges(entry)){
  for(let n=a;n<=b;n++){
   if(!used.has(n)){
    return String(n).padStart(6,'0');
   }
  }
 }

 return '';
}

function linkedText(raw){
 const s=clean(raw);
 const re=/\[([^\]]+)\]\((https?:\/\/[^\s)]+)\)/gi;

 let out='';
 let last=0;
 let m;

 while((m=re.exec(s))){
  out+=escapeHtml(
   s.slice(
    last,
    m.index
   )
  );

  out+=
   `<a href="${escapeAttr(m[2])}" target="_blank" rel="noopener noreferrer">${escapeHtml(m[1])}</a>`;

  last=
   m.index+
   m[0].length;
 }

 return (
  out+
  escapeHtml(
   s.slice(last)
  )
 );
}

function normalizeEntry(raw){
 if(
  !raw ||
  typeof raw!=='object'
 ){
  return null;
 }

 const bookName=
  clean(raw.bookName);

 if(!bookName){
  return null;
 }

 const code=
  clean(raw.code);

 let mode=
  clean(raw.codeMode);

 if(
  ![
   'legacy',
   'manual',
   'auto'
  ].includes(mode)
 ){
  if(
   code &&
   raw.codeAutoManaged===true &&
   !raw.codeManualEdited
  ){
   mode='auto';

  }else if(
   code &&
   raw.codeManualEdited
  ){
   mode='manual';

  }else{
   mode=
    code
     ? 'legacy'
     : 'auto';
  }
 }

 return {
  id:
   clean(raw.id) ||
   uid(),

  bookName,

  bookNo:
   clean(raw.bookNo),

  institution:
   clean(raw.institution),

  category:
   uniq(
    Array.isArray(raw.category)
     ? raw.category
     : [raw.category]
   ),

  tag:
   sortGroups(
    Array.isArray(raw.tag)
     ? raw.tag
     : [raw.tag]
   ),

  tagChecked:
   Boolean(raw.tagChecked),

  code,

  codeMode:
   mode,

  updatedAt:
   Number(raw.updatedAt) ||
   0
 };
}

function normalizeState(raw){
 const src=
  Array.isArray(raw)
   ? {entries:raw}
   : (
    raw &&
    typeof raw==='object'
     ? raw
     : {}
   );

 const entries=
  (
   Array.isArray(src.entries)
    ? src.entries
    : []
  )
  .map(normalizeEntry)
  .filter(Boolean);

 const institutions=
  uniq([
   ...(
    Array.isArray(src.institutions)
     ? src.institutions
     : []
   ),
   ...entries
    .map(e=>e.institution)
    .filter(Boolean)
  ]);

 const categories=
  uniq([
   ...(
    Array.isArray(src.categories)
     ? src.categories
     : []
   ),
   ...entries.flatMap(
    e=>e.category
   )
  ]);

 const order=
  new Map(
   institutions.map(
    (v,i)=>[
     key(v),
     i
    ]
   )
  );

 entries.sort(
  (a,b)=>
   (
    (order.get(key(a.institution))??999999)-
    (order.get(key(b.institution))??999999)
   ) ||
   a.bookNo.localeCompare(
    b.bookNo,
    'zh-CN',
    {numeric:true}
   ) ||
   a.bookName.localeCompare(
    b.bookName,
    'zh-CN'
   )
 );

 return {
  schemaVersion:10,
  entries,
  institutions,
  categories,
  tags:[...GROUP_OPTIONS]
 };
}

function signature(s){
 return JSON.stringify(
  normalizeState(s)
 );
}

function status(kind,text){
 ui.dot.className=
  'dot '+kind;

 ui.status.textContent=
  text;
}

function toast(msg,type=''){
 ui.toast.textContent=
  msg;

 ui.toast.className=
  'toast '+type;

 clearTimeout(
  toastTimer
 );

 toastTimer=
  setTimeout(
   ()=>{
    ui.toast.classList.add(
     'hidden'
    );
   },
   3200
  );
}

function admin(){
 return Boolean(
  config.owner &&
  config.repo &&
  config.path &&
  config.token
 );
}

function saveLocal(){
 localStorage.setItem(
  STORE+':state',
  JSON.stringify(state)
 );

 localStorage.setItem(
  STORE+':meta',
  JSON.stringify({
   dirty,
   sha,
   baseState
  })
 );
}

function saveConfigLocal(){
 localStorage.setItem(
  STORE+':config',
  JSON.stringify({
   owner:
    config.owner,

   repo:
    config.repo,

   path:
    config.path
  })
 );

 if(config.token){
  localStorage.setItem(
   STORE+':token',
   config.token
  );
 }else{
  localStorage.removeItem(
   STORE+':token'
  );
 }
}

function loadLocal(){
 try{
  const s=
   JSON.parse(
    localStorage.getItem(
     STORE+':state'
    ) ||
    'null'
   );

  if(s){
   state=
    normalizeState(s);
  }
 }catch{}

 try{
  const m=
   JSON.parse(
    localStorage.getItem(
     STORE+':meta'
    ) ||
    'null'
   );

  if(m){
   dirty=
    Boolean(m.dirty);

   sha=
    clean(m.sha) ||
    null;

   baseState=
    m.baseState
     ? normalizeState(m.baseState)
     : null;
  }
 }catch{}

 try{
  const c=
   JSON.parse(
    localStorage.getItem(
     STORE+':config'
    ) ||
    'null'
   );

  if(c){
   config.owner=
    clean(c.owner);

   config.repo=
    clean(c.repo);

   config.path=
    clean(c.path) ||
    'press_data.json';
  }
 }catch{}

 config.token=
  clean(
   localStorage.getItem(
    STORE+':token'
   ) ||
   ''
  );
}

function renderGroupButtons(
 box,
 selected,
 onChange
){
 box.innerHTML='';

 for(const g of GROUP_OPTIONS){
  const b=
   document.createElement(
    'button'
   );

  b.type='button';

  b.className=
   'group-btn'+
   (
    selected.includes(g)
     ? ' on'
     : ''
   );

  b.textContent=
   g;

  b.onclick=
   ()=>{
    const i=
     selected.indexOf(g);

    if(i>=0){
     selected.splice(i,1);
    }else{
     selected.push(g);
    }

    selected.splice(
     0,
     selected.length,
     ...sortGroups(selected)
    );

    renderGroupButtons(
     box,
     selected,
     onChange
    );

    onChange();
   };

  box.appendChild(b);
 }
}

function instantCode(
 entry,
 entries=state.entries
){
 const used=
  usedCodes(
   entries,
   entry.id
  );

 const current=
  normalizeCode(
   entry.code
  );

 if(
  entry.codeMode==='auto' &&
  current &&
  codeAllowed(
   entry,
   current
  ) &&
  !used.has(
   Number(current)
  )
 ){
  return current;
 }

 return smallestCode(
  entry,
  used
 );
}

function mergeProtectedCode(
 base,
 local,
 remote,
 merged,
 stats
){
 const lb=
  local
   ? {
    code:
     clean(local.code),

    mode:
     local.codeMode
   }
   : null;

 const rb=
  remote
   ? {
    code:
     clean(remote.code),

    mode:
     remote.codeMode
   }
   : null;

 const bb=
  base
   ? {
    code:
     clean(base.code),

    mode:
     base.codeMode
   }
   : null;

 const protectedLocal=
  lb &&
  lb.code &&
  lb.mode!=='auto';

 const protectedRemote=
  rb &&
  rb.code &&
  rb.mode!=='auto';

 if(
  protectedLocal &&
  protectedRemote &&
  lb.code!==rb.code
 ){
  if(
   bb &&
   lb.code===bb.code
  ){
   return rb;
  }

  if(
   bb &&
   rb.code===bb.code
  ){
   return lb;
  }

  stats.codeConflicts++;

  return lb;
 }

 if(protectedLocal){
  return lb;
 }

 if(protectedRemote){
  return rb;
 }

 if(
  lb?.code &&
  rb?.code
 ){
  if(lb.code===rb.code){
   return lb;
  }

  if(
   lb.mode==='auto' &&
   rb.mode==='auto'
  ){
   return rb;
  }
 }

 if(rb?.code){
  return rb;
 }

 if(lb?.code){
  return lb;
 }

 return {
  code:'',
  mode:'auto'
 };
}

function mergeEntry(
 base,
 local,
 remote,
 stats
){
 if(!base){
  if(!local){
   return remote;
  }

  if(!remote){
   return local;
  }
 }

 if(
  base &&
  !local &&
  !remote
 ){
  return null;
 }

 if(
  base &&
  !local
 ){
  if(
   same(
    remote,
    base
   )
  ){
   return null;
  }

  return remote;
 }

 if(
  base &&
  !remote
 ){
  if(
   same(
    local,
    base
   )
  ){
   return null;
  }

  return local;
 }

 if(!local){
  return remote;
 }

 if(!remote){
  return local;
 }

 const out={
  id:
   local.id ||
   remote.id
 };

 for(
  const f
  of [
   'bookName',
   'bookNo',
   'institution',
   'category',
   'tag',
   'tagChecked'
  ]
 ){
  const bv=
   base?.[f];

  const lv=
   local[f];

  const rv=
   remote[f];

  if(
   same(
    lv,
    rv
   )
  ){
   out[f]=
    clone(lv);

  }else if(
   base &&
   same(
    lv,
    bv
   )
  ){
   out[f]=
    clone(rv);

  }else if(
   base &&
   same(
    rv,
    bv
   )
  ){
   out[f]=
    clone(lv);

  }else{
   out[f]=
    clone(
     (
      local.updatedAt||0
     )>=(
      remote.updatedAt||0
     )
      ? lv
      : rv
    );

   stats.fieldConflicts++;
  }
 }

 const cb=
  mergeProtectedCode(
   base,
   local,
   remote,
   out,
   stats
  );

 out.code=
  cb.code;

 out.codeMode=
  cb.mode;

 out.updatedAt=
  Math.max(
   local.updatedAt||0,
   remote.updatedAt||0
  );

 return normalizeEntry(out);
}

function mergeStates(
 base,
 local,
 remote
){
 base=
  normalizeState(
   base||{}
  );

 local=
  normalizeState(
   local||{}
  );

 remote=
  normalizeState(
   remote||{}
  );

 const bm=
  new Map(
   base.entries.map(
    e=>[
     e.id,
     e
    ]
   )
  );

 const lm=
  new Map(
   local.entries.map(
    e=>[
     e.id,
     e
    ]
   )
  );

 const rm=
  new Map(
   remote.entries.map(
    e=>[
     e.id,
     e
    ]
   )
  );

 const stats={
  fieldConflicts:0,
  codeConflicts:0
 };

 const ids=
  new Set([
   ...bm.keys(),
   ...lm.keys(),
   ...rm.keys()
  ]);

 const entries=[];

 for(const id of ids){
  const e=
   mergeEntry(
    bm.get(id),
    lm.get(id),
    rm.get(id),
    stats
   );

  if(e){
   entries.push(e);
  }
 }

 const institutions=
  uniq([
   ...local.institutions,
   ...remote.institutions,
   ...entries
    .map(e=>e.institution)
    .filter(Boolean)
  ]);

 const categories=
  uniq([
   ...local.categories,
   ...remote.categories,
   ...entries.flatMap(
    e=>e.category
   )
  ]);

 return {
  state:
   normalizeState({
    entries,
    institutions,
    categories
   }),

  stats
 };
}

function reconcileAutoCodes(
 snapshot,
 remoteSnapshot
){
 const s=
  normalizeState(snapshot);

 const remote=
  normalizeState(
   remoteSnapshot
  );

 const rm=
  new Map(
   remote.entries.map(
    e=>[
     e.id,
     e
    ]
   )
  );

 const used=
  new Set();

 const settled=
  new Set();

 let reassigned=0;
 let assigned=0;

 /*
  第一层：
  历史编码与手工编码永久占位。
  自动编码不能抢占它们。
 */
 for(const e of s.entries){
  const c=
   normalizeCode(
    e.code
   );

  if(
   c &&
   e.codeMode!=='auto'
  ){
   used.add(
    Number(c)
   );
  }
 }

 const autos=
  s.entries
   .filter(
    e=>e.codeMode==='auto'
   )
   .sort(
    (a,b)=>
     String(a.id)
      .localeCompare(
       String(b.id),
       'en'
      )
   );

 /*
  第二层：
  同一条目如果服务器已经确认自动编码，
  优先采用服务器值。
 */
 for(const e of autos){
  const r=
   rm.get(e.id);

  const rc=
   normalizeCode(
    r?.code
   );

  if(
   r?.codeMode==='auto' &&
   rc &&
   codeAllowed(
    e,
    rc
   ) &&
   !used.has(
    Number(rc)
   )
  ){
   if(
    e.code &&
    e.code!==rc
   ){
    reassigned++;
   }

   e.code=
    rc;

   used.add(
    Number(rc)
   );

   settled.add(
    e.id
   );
  }
 }

 /*
  第三层：
  本机瞬间生成的候选号仍然可用时保持不变。
 */
 for(const e of autos){
  if(
   settled.has(
    e.id
   )
  ){
   continue;
  }

  const c=
   normalizeCode(
    e.code
   );

  if(
   c &&
   codeAllowed(
    e,
    c
   ) &&
   !used.has(
    Number(c)
   )
  ){
   used.add(
    Number(c)
   );

   settled.add(
    e.id
   );
  }
 }

 /*
  第四层：
  剩余自动编码条目按稳定 id 排序后重新分配。

  两台设备看到相同合并数据时，
  会得到相同的分配结果。
 */
 for(const e of autos){
  if(
   settled.has(
    e.id
   )
  ){
   continue;
  }

  const before=
   e.code;

  const c=
   smallestCode(
    e,
    used
   );

  e.code=
   c;

  if(c){
   used.add(
    Number(c)
   );

   settled.add(
    e.id
   );

   if(
    before &&
    before!==c
   ){
    reassigned++;
   }

   if(!before){
    assigned++;
   }
  }
 }

 return {
  state:
   normalizeState(s),

  assigned,
  reassigned
 };
}

function auditProtected(
 local,
 remote,
 candidate
){
 const lm=
  new Map(
   normalizeState(local)
    .entries
    .map(
     e=>[
      e.id,
      e
     ]
    )
  );

 const rm=
  new Map(
   normalizeState(remote)
    .entries
    .map(
     e=>[
      e.id,
      e
     ]
    )
  );

 const cm=
  new Map(
   normalizeState(candidate)
    .entries
    .map(
     e=>[
      e.id,
      e
     ]
    )
  );

 let violations=0;

 for(
  const id
  of new Set([
   ...lm.keys(),
   ...rm.keys()
  ])
 ){
  const protectedCodes=
   uniq(
    [
     lm.get(id),
     rm.get(id)
    ]
    .filter(Boolean)
    .filter(
     e=>
      e.codeMode!=='auto'
    )
    .map(
     e=>clean(e.code)
    )
    .filter(Boolean)
   );

  if(
   !protectedCodes.length
  ){
   continue;
  }

  const cc=
   clean(
    cm.get(id)?.code
   );

  if(
   !cc ||
   !protectedCodes.includes(cc)
  ){
   violations++;
  }
 }

 return violations;
}

function b64encode(s){
 const bytes=
  new TextEncoder()
   .encode(s);

 let bin='';

 for(
  let i=0;
  i<bytes.length;
  i+=0x8000
 ){
  bin+=
   String.fromCharCode(
    ...bytes.subarray(
     i,
     i+0x8000
    )
   );
 }

 return btoa(bin);
}

function b64decode(s){
 const bin=
  atob(
   String(s||'')
    .replace(/\s/g,'')
  );

 const bytes=
  new Uint8Array(
   bin.length
  );

 for(
  let i=0;
  i<bin.length;
  i++
 ){
  bytes[i]=
   bin.charCodeAt(i);
 }

 return new TextDecoder()
  .decode(bytes);
}

function timeoutError(){
 const e=
  new Error(
   '请求超时'
  );

 e.code=
  'timeout';

 e.status=
  0;

 return e;
}

async function fetchTimed(
 url,
 options={},
 ms=FETCH_TIMEOUT
){
 const controller=
  typeof AbortController!=='undefined'
   ? new AbortController()
   : null;

 let timer;

 const req=
  (
   async()=>{
    try{
     return await fetch(
      url,
      {
       ...options,
       ...(
        controller
         ? {
          signal:
           controller.signal
         }
         : {}
       )
      }
     );

    }catch(e){
     if(
      e?.name==='AbortError'
     ){
      throw timeoutError();
     }

     e.status=
      e.status||0;

     throw e;
    }
   }
  )();

 const timeout=
  new Promise(
   (_,reject)=>{
    timer=
     setTimeout(
      ()=>{
       try{
        controller?.abort();
       }catch{}

       reject(
        timeoutError()
       );
      },
      ms
     );
   }
  );

 try{
  return await Promise.race([
   req,
   timeout
  ]);

 }finally{
  clearTimeout(timer);
 }
}

function apiPath(){
 return `https://api.github.com/repos/${encodeURIComponent(config.owner)}/${encodeURIComponent(config.repo)}/contents/${config.path.split('/').filter(Boolean).map(encodeURIComponent).join('/')}`;
}

async function github(
 method,
 body=null
){
 const r=
  await fetchTimed(
   apiPath(),
   {
    method,

    cache:
     'no-store',

    headers:{
     Authorization:
      `Bearer ${config.token}`,

     Accept:
      'application/vnd.github+json',

     'X-GitHub-Api-Version':
      '2022-11-28',

     ...(
      body
       ? {
        'Content-Type':
         'application/json'
       }
       : {}
     )
    },

    ...(
     body
      ? {
       body:
        JSON.stringify(body)
      }
      : {}
    )
   }
  );

 const text=
  await r.text();

 let data=null;

 try{
  data=
   text
    ? JSON.parse(text)
    : null;

 }catch{
  data={
   message:
    text
  };
 }

 if(!r.ok){
  const e=
   new Error(
    data?.message ||
    `HTTP ${r.status}`
   );

  e.status=
   r.status;

  throw e;
 }

 return data;
}

async function readRemote(){
 try{
  const d=
   await github(
    'GET'
   );

  return {
   exists:true,

   sha:
    d.sha,

   state:
    normalizeState(
     JSON.parse(
      b64decode(
       d.content
      )
     )
    )
  };

 }catch(e){
  if(e.status===404){
   return {
    exists:false,
    sha:null,
    state:
     normalizeState({})
   };
  }

  throw e;
 }
}

async function writeRemote(
 s,
 currentSha
){
 const raw=
  JSON.stringify(
   normalizeState(s),
   null,
   2
  );

 if(
  new TextEncoder()
   .encode(raw)
   .length >
  MAX_BYTES
 ){
  throw new Error(
   '数据超过 750 KB'
  );
 }

 const body={
  message:
   `更新 Press 数据 - ${new Date().toLocaleString()}`,

  content:
   b64encode(raw)
 };

 if(currentSha){
  body.sha=
   currentSha;
 }

 const d=
  await github(
   'PUT',
   body
  );

 return (
  d?.content?.sha ||
  null
 );
}

function isConflict(e){
 if(e.status===409){
  return true;
 }

 if(e.status!==422){
  return false;
 }

 const m=
  String(e.message||'')
   .toLowerCase();

 return (
  m.includes('sha') ||
  m.includes('does not match') ||
  m.includes('already exists') ||
  m.includes('update')
 );
}

function syncError(e){
 if(e.code==='timeout'){
  return 'GitHub 请求超时';
 }

 if(e.status===401){
  return 'Token 无效或已失效';
 }

 if(e.status===403){
  return 'GitHub 拒绝访问，请检查 Contents 权限';
 }

 if(e.status===404){
  return '仓库或文件路径不存在';
 }

 return (
  e.message ||
  '未知同步错误'
 );
}

async function sync(
 showResult=true,
 queueIfBusy=true
){
 if(!admin()){
  return false;
 }

 /*
  自动定时同步：
  如果已经有同步正在运行，直接跳过，不排队。

  用户刚刚修改数据：
  queueIfBusy=true，可以补一轮。
 */
 if(syncBusy){
  if(queueIfBusy){
   syncQueued=true;
  }

  return false;
 }

 syncBusy=true;
 ui.sync.disabled=true;

 status(
  'syncing',
  '正在拉取服务器最新版'
 );

 try{
  do{
   syncQueued=false;

   const startMutation=
    mutationVersion;

   let done=false;
   let lastError=null;

   /*
    这里只针对 GitHub SHA 并发冲突最多重试 3 次。
    普通网络超时不会形成无限循环。
   */
   for(
    let attempt=0;
    attempt<3 &&
    !done;
    attempt++
   ){
    try{
     /*
      第一步永远是读取服务器最新版。
     */
     const remote=
      await readRemote();

     const local=
      normalizeState(
       state
      );

     const base=
      baseState
       ? normalizeState(
        baseState
       )
       : (
        dirty
         ? normalizeState({})
         : local
       );

     /*
      合并两台设备的数据。
     */
     const merged=
      mergeStates(
       base,
       local,
       remote.state
      );

     /*
      两台设备对同一个历史/手工编码产生不可判断的不同修改，
      停止自动覆盖。
     */
     if(
      merged.stats.codeConflicts
     ){
      const e=
       new Error(
        `检测到 ${merged.stats.codeConflicts} 个受保护编码冲突，已停止自动覆盖`
       );

      e.code=
       'code_conflict';

      throw e;
     }

     /*
      对自动编码进行确定性仲裁：
      服务器已确认的编码优先；
      其它自动条目按稳定 id 排序分配。
     */
     const reconciled=
      reconcileAutoCodes(
       merged.state,
       remote.state
      );

     /*
      写回前再次检查：
      历史/手工编码不能被自动清空或换号。
     */
     if(
      auditProtected(
       local,
       remote.state,
       reconciled.state
      )
     ){
      const e=
       new Error(
        '编码安全检查失败，已有历史或手工编码可能被改写'
       );

      e.code=
       'code_safety';

      throw e;
     }

     let finalSha=
      remote.sha;

     if(
      signature(
       reconciled.state
      )!==
      signature(
       remote.state
      )
     ){
      try{
       finalSha=
        await writeRemote(
         reconciled.state,
         remote.sha
        );

      }catch(e){
       /*
        别的设备刚刚抢先提交：
        重新 GET 最新版本，再重新仲裁。

        这是确保多设备自动编码最终一致的关键。
       */
       if(isConflict(e)){
        lastError=e;
        continue;
       }

       throw e;
      }
     }

     state=
      reconciled.state;

     sha=
      finalSha;

     baseState=
      clone(
       reconciled.state
      );

     /*
      如果同步期间用户又修改过本机，
      当前同步完成后只补一轮。
     */
     dirty=
      mutationVersion!==
      startMutation;

     if(dirty){
      syncQueued=true;
     }

     saveLocal();
     render();

     status(
      'online',
      '公开阅读 · 管理已连接'
     );

     ui.last.textContent=
      `已同步 ${new Date().toLocaleString()}`;

     if(showResult){
      if(
       reconciled.reassigned
      ){
       toast(
        `同步完成；并发仲裁调整了 ${reconciled.reassigned} 个自动编码`,
        'success'
       );

      }else{
       toast(
        '同步完成',
        'success'
       );
      }
     }

     done=true;

    }catch(e){
     lastError=e;

     if(isConflict(e)){
      continue;
     }

     throw e;
    }
   }

   if(!done){
    throw (
     lastError ||
     new Error(
      '同步重试失败'
     )
    );
   }

  }while(syncQueued);

  return true;

 }catch(e){
  console.error(e);

  /*
   同步失败时保留本机数据。
  */
  dirty=true;
  saveLocal();

  status(
   'offline',
   '同步失败 · 本地数据已保留'
  );

  if(showResult){
   toast(
    `同步失败：${syncError(e)}`,
    'error'
   );
  }

  return false;

 }finally{
  syncBusy=false;
  ui.sync.disabled=false;
 }
}

async function loadInitial(){
 loadLocal();

 renderGroupButtons(
  ui.addGroups,
  addSelected,
  refreshAddCode
 );

 render();

 if(admin()){
  ui.addPanel.classList.remove(
   'hidden'
  );

  try{
   const remote=
    await readRemote();

   if(!dirty){
    state=
     remote.state;

    sha=
     remote.sha;

    baseState=
     clone(
      remote.state
     );

    saveLocal();
    render();

    status(
     'online',
     '公开阅读 · 管理已连接'
    );

    ui.last.textContent=
     `已读取 ${state.entries.length} 条`;

   }else{
    status(
     'online',
     '管理已连接 · 存在本机修改'
    );

    sync(
     false,
     true
    );
   }

  }catch(e){
   console.error(e);

   status(
    'offline',
    '云端读取失败 · 使用本机数据'
   );
  }

 }else{
  ui.addPanel.classList.add(
   'hidden'
  );

  try{
   const url=
    new URL(
     PUBLIC_FILE,
     location.href
    );

   url.searchParams.set(
    'v',
    Date.now()
   );

   const r=
    await fetchTimed(
     url.href,
     {
      cache:
       'no-store'
     }
    );

   if(!r.ok){
    throw new Error(
     `HTTP ${r.status}`
    );
   }

   state=
    normalizeState(
     await r.json()
    );

   render();

   status(
    'online',
    '公开阅读'
   );

   ui.last.textContent=
    `公开数据 · ${state.entries.length} 条`;

  }catch(e){
   console.error(e);

   render();

   status(
    'offline',
    '公开数据读取失败'
   );
  }
 }
}

ui.bookName.addEventListener(
 'input',
 refreshAddCode
);

ui.add.addEventListener(
 'click',
 addEntry
);

ui.list.addEventListener(
 'click',
 e=>{
  const b=
   e.target.closest(
    '.edit-btn[data-id]'
   );

  if(b){
   openEdit(
    b.dataset.id
   );
  }
 }
);

ui.list.addEventListener(
 'change',
 e=>{
  const c=
   e.target.closest(
    '.check[data-id]'
   );

  if(!c){
   return;
  }

  const item=
   state.entries.find(
    x=>
     x.id===
     c.dataset.id
   );

  if(!item){
   return;
  }

  item.tagChecked=
   c.checked;

  item.updatedAt=
   Date.now();

  markDirty();

  render();

  sync(
   false,
   true
  );
 }
);

ui.editBookName.addEventListener(
 'input',
 refreshEditAuto
);

ui.editCode.addEventListener(
 'input',
 ()=>{
  if(
   editOriginal &&
   clean(
    ui.editCode.value
   )!==
   clean(
    editOriginal.code
   )
  ){
   editAutoMode=false;
  }

  ui.editCodeNote.textContent=
   editAutoMode
    ? '自动编码：编组或书名变化时立即重算，同步后多设备收敛'
    : '手工编码：保存后自动同步不会主动改号';
 }
);

ui.editCancel.addEventListener(
 'click',
 closeEdit
);

ui.editSave.addEventListener(
 'click',
 saveEdit
);

ui.delete.addEventListener(
 'click',
 deleteEntry
);

ui.editModal.addEventListener(
 'click',
 e=>{
  if(
   e.target===
   ui.editModal
  ){
   closeEdit();
  }
 }
);

ui.sync.addEventListener(
 'click',
 ()=>{
  sync(
   true,
   true
  );
 }
);

ui.config.addEventListener(
 'click',
 ()=>{
  ui.cfgOwner.value=
   config.owner;

  ui.cfgRepo.value=
   config.repo;

  ui.cfgPath.value=
   config.path;

  ui.cfgToken.value=
   config.token;

  ui.remember.checked=
   Boolean(
    localStorage.getItem(
     STORE+':token'
    )
   );

  ui.configModal.classList.remove(
   'hidden'
  );
 }
);

ui.configCancel.addEventListener(
 'click',
 ()=>{
  ui.configModal.classList.add(
   'hidden'
  );
 }
);

ui.configSave.addEventListener(
 'click',
 async()=>{
  config.owner=
   clean(
    ui.cfgOwner.value
   );

  config.repo=
   clean(
    ui.cfgRepo.value
   );

  config.path=
   clean(
    ui.cfgPath.value
   ) ||
   'press_data.json';

  config.token=
   clean(
    ui.cfgToken.value
   );

  if(
   !config.owner ||
   !config.repo ||
   !config.token
  ){
   toast(
    '请完整填写仓库和 Token',
    'error'
   );

   return;
  }

  localStorage.setItem(
   STORE+':config',
   JSON.stringify({
    owner:
     config.owner,

    repo:
     config.repo,

    path:
     config.path
   })
  );

  if(ui.remember.checked){
   localStorage.setItem(
    STORE+':token',
    config.token
   );
  }else{
   localStorage.removeItem(
    STORE+':token'
   );
  }

  ui.configModal.classList.add(
   'hidden'
  );

  dirty=false;
  baseState=null;
  sha=null;

  await loadInitial();
 }
);

ui.manage.addEventListener(
 'click',
 ()=>{
  ui.institutionText.value=
   state.institutions.join(
    '\n'
   );

  ui.manageModal.classList.remove(
   'hidden'
  );
 }
);

ui.manageCancel.addEventListener(
 'click',
 ()=>{
  ui.manageModal.classList.add(
   'hidden'
  );
 }
);

ui.manageSave.addEventListener(
 'click',
 ()=>{
  state.institutions=
   uniq(
    ui.institutionText.value.split(
     /\r?\n/
    )
   );

  for(const e of state.entries){
   if(
    e.institution &&
    !state.institutions.some(
     x=>
      key(x)===
      key(e.institution)
    )
   ){
    state.institutions.push(
     e.institution
    );
   }
  }

  ui.manageModal.classList.add(
   'hidden'
  );

  render();

  markDirty();

  sync(
   false,
   true
  );
 }
);

ui.exp.addEventListener(
 'click',
 ()=>{
  const blob=
   new Blob(
    [
     JSON.stringify(
      state,
      null,
      2
     )
    ],
    {
     type:
      'application/json'
    }
   );

  const url=
   URL.createObjectURL(
    blob
   );

  const a=
   document.createElement(
    'a'
   );

  a.href=
   url;

  a.download=
   `press_data_${Date.now()}.json`;

  a.click();

  setTimeout(
   ()=>{
    URL.revokeObjectURL(
     url
    );
   },
   1000
  );
 }
);

ui.imp.addEventListener(
 'click',
 ()=>{
  ui.impFile.click();
 }
);

ui.impFile.addEventListener(
 'change',
 async()=>{
  const f=
   ui.impFile.files?.[0];

  ui.impFile.value='';

  if(!f){
   return;
  }

  try{
   const parsed=
    JSON.parse(
     await f.text()
    );

   state=
    normalizeState(
     parsed
    );

   render();

   markDirty();

   toast(
    '导入成功，本机已保存',
    'success'
   );

   sync(
    false,
    true
   );

  }catch{
   toast(
    '导入失败：JSON 格式无效',
    'error'
   );
  }
 }
);

ui.top.addEventListener(
 'click',
 ()=>{
  window.scrollTo({
   top:0,
   behavior:'auto'
  });
 }
);

/*
手机恢复联网：
已有同步运行时直接跳过。
*/
window.addEventListener(
 'online',
 ()=>{
  if(
   admin() &&
   !syncBusy &&
   !document.querySelector(
    '.overlay:not(.hidden)'
   )
  ){
   sync(
    false,
    false
   );
  }
 }
);

/*
手机从后台回到前台：
空闲时补拉一次。
*/
window.addEventListener(
 'focus',
 ()=>{
  if(
   admin() &&
   !syncBusy &&
   !document.querySelector(
    '.overlay:not(.hidden)'
   )
  ){
   sync(
    false,
    false
   );
  }
 }
);

document.addEventListener(
 'visibilitychange',
 ()=>{
  if(
   !document.hidden &&
   admin() &&
   !syncBusy &&
   !document.querySelector(
    '.overlay:not(.hidden)'
   )
  ){
   sync(
    false,
    false
   );
  }
 }
);

/*
每分钟自动同步一次。

如果上一轮同步尚未结束：
这一轮直接跳过，
不会排队，
不会重新设置 syncQueued，
因此不会再次出现手机一直停留在
“正在拉取服务器最新版”的同步链。
*/
intervalId=
 setInterval(
  ()=>{
   if(
    admin() &&
    !syncBusy &&
    !document.querySelector(
     '.overlay:not(.hidden)'
    )
   ){
    sync(
     false,
     false
    );
   }
  },
  SYNC_INTERVAL
 );

loadInitial()
 .catch(
  e=>{
   console.error(e);

   status(
    'offline',
    '初始化失败'
   );

   render();
  }
 );

})();
</script>
</body>
</html>
