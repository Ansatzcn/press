<body>
<main class="container">
<h1 class="page-title">Press <span class="cloud-status"><span class="status-dot" id="statusDot"></span><span id="statusText">正在读取公开数据…</span></span></h1>

<section class="toolbar">
<div class="toolbar-group">
<button class="btn btn-sync hidden" id="syncBtn" type="button">同步</button>
<button class="btn" id="configBtn" type="button">配置</button>
<button class="btn" id="exportBtn" type="button">导出</button>
<button class="btn hidden" id="importBtn" type="button">导入</button>
<input type="file" id="fileInput" accept=".json,application/json" hidden>
</div>
<span class="last-sync" id="lastSyncTime">公开阅读无需 Token</span>
</section>

<section class="add-section hidden" id="addSection">
<h2>添加</h2>
<div class="form-grid">
<div class="form-group full">
<label for="bookNameInput">书名</label>
<input type="text" id="bookNameInput" autocomplete="off" autofocus>
</div>
<div class="form-group">
<label for="bookNoInput">书号</label>
<input type="text" id="bookNoInput" autocomplete="off">
</div>
<div class="form-group">
<label for="codeInput">编码</label>
<input type="text" id="codeInput" readonly>
</div>
<div class="form-group full">
<label for="institutionInput">出版</label>
<div class="combo" id="institutionCombo">
<div class="combo-row">
<input type="text" id="institutionInput" autocomplete="off">
<button class="combo-toggle" id="institutionToggle" type="button" aria-label="展开出版历史">▾</button>
</div>
<div class="combo-panel hidden" id="institutionPanel"><div id="institutionOptions"></div></div>
</div>
</div>
<div class="three-fields-row">
<div class="form-group">
<label for="groupInput">大类</label>
<div class="combo" id="groupCombo">
<div class="combo-selected" id="groupSelected"></div>
<div class="combo-row">
<input type="text" id="groupInput" autocomplete="off">
<button class="combo-toggle" id="groupToggle" type="button" aria-label="展开大类历史">▾</button>
</div>
<div class="combo-panel hidden" id="groupPanel"><div id="groupOptions"></div></div>
</div>
</div>
<div class="form-group">
<label for="tagInput">标签</label>
<div class="combo" id="tagCombo">
<div class="combo-selected" id="tagSelected"></div>
<div class="combo-row">
<input type="text" id="tagInput" autocomplete="off">
<button class="combo-toggle" id="tagToggle" type="button" aria-label="展开标签历史">▾</button>
</div>
<div class="combo-panel hidden" id="tagPanel"><div id="tagOptions"></div></div>
</div>
</div>
<div class="form-group">
<label for="categoryInput">书架</label>
<div class="combo" id="categoryCombo">
<div class="combo-selected" id="categorySelected"></div>
<div class="combo-row">
<input type="text" id="categoryInput" autocomplete="off">
<button class="combo-toggle" id="categoryToggle" type="button" aria-label="展开书架历史">▾</button>
</div>
<div class="combo-panel hidden" id="categoryPanel"><div id="categoryOptions"></div></div>
</div>
</div>
</div>
<button class="add-button" id="addBtn" type="button">添加</button>
</div>
</section>

<section>
<div class="list-header"><h2>总表</h2><span class="count-badge" id="countDisplay">0</span></div>
<div class="press-list" id="pressList"><div class="empty-state">加载中…</div></div>
</section>
</main>

<section class="overlay hidden" id="editModal">
<div class="dialog">
<div class="dialog-scroll">
<h3>编辑</h3>
<div class="form-group"><label for="editBookName">书名</label><input type="text" id="editBookName" autocomplete="off"></div>
<div class="form-group"><label for="editBookNo">书号</label><input type="text" id="editBookNo" autocomplete="off"></div>
<div class="form-group">
<label for="editInstitution">出版</label>
<div class="combo" id="editInstitutionCombo">
<div class="combo-row">
<input type="text" id="editInstitution" autocomplete="off">
<button class="combo-toggle" id="editInstitutionToggle" type="button" aria-label="展开出版历史">▾</button>
</div>
<div class="combo-panel hidden" id="editInstitutionPanel"><div id="editInstitutionOptions"></div></div>
</div>
</div>
<div class="form-group">
<label for="editGroup">大类</label>
<div class="combo" id="editGroupCombo">
<div class="combo-selected" id="editGroupSelected"></div>
<div class="combo-row">
<input type="text" id="editGroup" autocomplete="off">
<button class="combo-toggle" id="editGroupToggle" type="button" aria-label="展开大类历史">▾</button>
</div>
<div class="combo-panel hidden" id="editGroupPanel"><div id="editGroupOptions"></div></div>
</div>
</div>
<div class="form-group">
<label for="editTag">标签</label>
<div class="combo" id="editTagCombo">
<div class="combo-selected" id="editTagSelected"></div>
<div class="combo-row">
<input type="text" id="editTag" autocomplete="off">
<button class="combo-toggle" id="editTagToggle" type="button" aria-label="展开标签历史">▾</button>
</div>
<div class="combo-panel hidden" id="editTagPanel"><div id="editTagOptions"></div></div>
</div>
</div>
<div class="form-group">
<label for="editCategory">书架</label>
<div class="combo" id="editCategoryCombo">
<div class="combo-selected" id="editCategorySelected"></div>
<div class="combo-row">
<input type="text" id="editCategory" autocomplete="off">
<button class="combo-toggle" id="editCategoryToggle" type="button" aria-label="展开书架历史">▾</button>
</div>
<div class="combo-panel hidden" id="editCategoryPanel"><div id="editCategoryOptions"></div></div>
</div>
</div>
<div class="form-group"><label for="editCode">编码</label><input type="text" id="editCode" readonly></div>
</div>
<div class="dialog-actions"><button class="btn btn-danger" id="editDelete" type="button">删除</button><button class="btn" id="editCancel" type="button">取消</button><button class="btn btn-primary" id="editSave" type="button">保存</button></div>
</div>
</section>

<section class="overlay hidden" id="configModal">
<form class="dialog" id="configForm" autocomplete="on">
<div class="dialog-scroll">
<h3>GitHub 管理配置</h3>
<p class="dialog-desc">任何人均可直接浏览 press_data.json 中的公开数据，无需 Token。只有配置 Token 后才可新增、编辑、删除、导入和同步。</p>
<div class="form-group"><label for="cfgOwner">仓库所有者</label><input id="cfgOwner" name="github-owner" type="text" autocomplete="username"></div>
<div class="form-group"><label for="cfgRepo">仓库名称</label><input id="cfgRepo" type="text" autocomplete="off"></div>
<div class="form-group"><label for="cfgFile">数据文件路径</label><input id="cfgFile" type="text" value="press_data.json" autocomplete="off"></div>
<div class="form-group"><label for="cfgToken">GitHub Personal Access Token</label><input id="cfgToken" name="github-token" type="password" autocomplete="current-password" spellcheck="false"></div>
<label class="remember-row"><input type="checkbox" id="rememberToken" checked><span>在本设备保存 Token。取消勾选时，Token 仅保存到当前浏览器会话。</span></label>
</div>
<div class="dialog-actions"><button class="btn" id="configCancel" type="button">取消</button><button class="btn btn-primary" type="submit">保存并连接</button></div>
</form>
</section>

<button class="back-to-top" id="backToTopBtn" type="button" aria-label="回到顶部" title="回到顶部">↑</button>
<div class="toast hidden" id="toast"></div>

function normEntry(x,usedCodes){
    if(!x||typeof x!=='object')return null;
    const bookName=cleanTitle(x.bookName);if(!bookName)return null;
    const bookNo=clean(x.bookNo),institution=clean(x.institution);
    const category=normalizeMulti(x.category),group=normalizeMulti(x.group),tag=normalizeMulti(x.tag);
    let code=clean(x.code);
    if(!/^(1\d{5}|2\d{5})$/.test(code)||usedCodes.has(code))code=randomCode(usedCodes);
    usedCodes.add(code);
    return{id:clean(x.id)||uid(),bookName,bookNo,institution,category,group,tag,code}
}
function norm(v){
    const s=Array.isArray(v)?{entries:v}:(v&&typeof v==='object'?v:{});
    const usedCodes=new Set();
    const entries=(Array.isArray(s.entries)?s.entries:[]).map(x=>normEntry(x,usedCodes)).filter(Boolean);

    // 出版、书架使用历史数组自身的顺序，供人工调整。
    // 旧数据没有对应历史字段时，仅首次按现有条目出现顺序建立历史。
    const institutions=uniq(
        Array.isArray(s.institutions)?s.institutions:entries.map(x=>x.institution).filter(Boolean)
    );
    const categories=uniq(
        Array.isArray(s.categories)?s.categories:entries.flatMap(x=>x.category)
    );

    // 大类、标签不能人工排序，始终按首字母/首数字的自然顺序排列。
    const groups=sortAuto(
        Array.isArray(s.groups)?s.groups:entries.flatMap(x=>x.group)
    );
    const tags=sortAuto(
        Array.isArray(s.tags)?s.tags:entries.flatMap(x=>x.tag)
    );

    // 总表：先按“出版”下拉菜单顺序；出版相同再按书号排序。
    // 已从出版历史中删除、但仍被旧条目使用的出版放在已配置出版之后。
    const institutionOrder=new Map(institutions.map((v,i)=>[key(v),i]));
    entries.sort((a,b)=>{
        const ai=institutionOrder.has(key(a.institution))?institutionOrder.get(key(a.institution)):Number.MAX_SAFE_INTEGER;
        const bi=institutionOrder.has(key(b.institution))?institutionOrder.get(key(b.institution)):Number.MAX_SAFE_INTEGER;
        if(ai!==bi)return ai-bi;
        if(ai===Number.MAX_SAFE_INTEGER){
            const byInstitution=collator.compare(a.institution,b.institution);
            if(byInstitution!==0)return byInstitution
        }
        if(a.bookNo&&!b.bookNo)return-1;
        if(!a.bookNo&&b.bookNo)return 1;
        const byNo=collator.compare(a.bookNo,b.bookNo);
        if(byNo!==0)return byNo;
        const byName=collator.compare(a.bookName,b.bookName);
        if(byName!==0)return byName;
        return a.code.localeCompare(b.code)
    });
    return{schemaVersion:2,entries,institutions,categories,groups,tags}
}

function setupManualDrag(optionsEl,type){
    let drag=null;
    function clearMarks(){
        optionsEl.querySelectorAll('.drag-before,.drag-after').forEach(el=>el.classList.remove('drag-before','drag-after'))
    }
    function cleanup(){
        clearMarks();
        if(drag?.row)drag.row.classList.remove('dragging');
        document.body.classList.remove('reordering');
        drag=null
    }
    optionsEl.addEventListener('pointerdown',e=>{
        const handle=e.target.closest('.combo-drag[data-drag-value]');
        if(!handle||!optionsEl.contains(handle))return;
        const row=handle.closest('.combo-pill[data-drag-value]');
        if(!row)return;
        e.preventDefault();
        e.stopPropagation();
        drag={pointerId:e.pointerId,sourceValue:handle.dataset.dragValue,row,targetValue:'',after:false,handle};
        row.classList.add('dragging');
        document.body.classList.add('reordering');
        try{handle.setPointerCapture(e.pointerId)}catch(err){}
    });
    optionsEl.addEventListener('pointermove',e=>{
        if(!drag||e.pointerId!==drag.pointerId)return;
        e.preventDefault();
        const panel=optionsEl.closest('.combo-panel');
        if(panel){
            const pr=panel.getBoundingClientRect(),edge=34;
            if(e.clientY<pr.top+edge)panel.scrollTop-=12;
            else if(e.clientY>pr.bottom-edge)panel.scrollTop+=12
        }
        clearMarks();
        const hit=document.elementFromPoint(e.clientX,e.clientY);
        const target=hit?.closest?.('.combo-pill[data-drag-value]');
        if(!target||!optionsEl.contains(target)||target===drag.row){
            drag.targetValue='';
            return
        }
        const rect=target.getBoundingClientRect();
        drag.after=e.clientY>=rect.top+rect.height/2;
        drag.targetValue=target.dataset.dragValue;
        target.classList.add(drag.after?'drag-after':'drag-before')
    });
    function finish(e){
        if(!drag||e.pointerId!==drag.pointerId)return;
        e.preventDefault();
        const sourceValue=drag.sourceValue,targetValue=drag.targetValue,after=drag.after;
        try{drag.handle.releasePointerCapture(e.pointerId)}catch(err){}
        cleanup();
        if(targetValue)reorderHistoryOption(type,sourceValue,targetValue,after)
    }
    optionsEl.addEventListener('pointerup',finish);
    optionsEl.addEventListener('pointercancel',e=>{if(drag&&e.pointerId===drag.pointerId)cleanup()})
}

    if(rememberToken.checked){ls(TOKEN_LOCAL,token);remove(TOKEN_SESSION,'session')}else{ss(TOKEN_SESSION,token);remove(TOKEN_LOCAL)}
    configModal.classList.add('hidden');updateAdmin();render();show('配置已保存','success');sync(true)
}
function openConfig(){
    cfgOwner.value=config.owner;cfgRepo.value=config.repo;cfgFile.value=config.file||'press_data.json';cfgToken.value=config.token;rememberToken.checked=Boolean(lg(TOKEN_LOCAL));
    configModal.classList.remove('hidden');setTimeout(()=>cfgToken.focus(),30)
}
function loadMeta(){try{const x=JSON.parse(lg(META_KEY)||'{}')||{};meta={target:clean(x.target),fingerprint:typeof x.fingerprint==='string'?x.fingerprint:null,sha:clean(x.sha)||null,lastSyncAt:clean(x.lastSyncAt)||null}}catch(e){}}
function saveMeta(){ls(META_KEY,JSON.stringify(meta))}
function ensureTarget(){const t=target();if(meta.target!==t){meta={target:t,fingerprint:null,sha:null,lastSyncAt:null};saveMeta()}}
function record(snapshot,sha){meta={target:target(),fingerprint:fingerprint(snapshot),sha:sha||null,lastSyncAt:new Date().toISOString()};saveMeta();lastSyncTime.textContent=`已同步 ${new Date(meta.lastSyncAt).toLocaleString()}`}
async function api(method,endpoint,body=null){
    const r=await fetch(`https://api.github.com/repos/${encodeURIComponent(config.owner)}/${encodeURIComponent(config.repo)}/${endpoint}`,{
        method,
        headers:{
            Authorization:`Bearer ${config.token}`,
            Accept:'application/vnd.github+json',
            'X-GitHub-Api-Version':'2026-03-10',
            ...(body!==null?{'Content-Type':'application/json'}:{})
        },
        cache:'no-store',
        ...(body!==null?{body:JSON.stringify(body)}:{})
    });
    const raw=await r.text();let data=null;if(raw)try{data=JSON.parse(raw)}catch(e){data={message:raw}};
    if(!r.ok){const er=new Error(data?.message||`HTTP ${r.status}`);er.status=r.status;throw er}
    return data
}
function toB64(s){const bytes=new TextEncoder().encode(s);let bin='';for(let i=0;i<bytes.length;i+=0x8000)bin+=String.fromCharCode(...bytes.subarray(i,i+0x8000));return btoa(bin)}
function fromB64(s){const bin=atob(String(s||'').replace(/\s/g,'')),bytes=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)bytes[i]=bin.charCodeAt(i);return new TextDecoder().decode(bytes)}
async function readRemote(){
    try{
        const d=await api('GET',`contents/${pathEncode(config.file)}`);
        return{exists:true,sha:d.sha,state:norm(JSON.parse(fromB64(d.content)))}
    }catch(e){
        if(e.status===404)return{exists:false,sha:null,state:{entries:[],institutions:[],categories:[],groups:[],tags:[]}};
        throw e
    }
}
async function writeRemote(snapshot,sha){
    const raw=JSON.stringify(norm(snapshot),null,2);
    if(new TextEncoder().encode(raw).length>MAX_BYTES)throw new Error('数据超过 750 KB');
    const body={message:`更新 Press 数据 - ${new Date().toLocaleString()}`,content:toB64(raw)};
    if(sha)body.sha=sha;
    const r=await api('PUT',`contents/${pathEncode(config.file)}`,body);
    return r?.content?.sha||null
}
async function sync(showResult=true){
    if(!admin()){show('请先配置 Token','error');return false}
    if(syncing)return false;
    clearTimeout(autoTimer);autoTimer=null;syncing=true;syncBtn.disabled=true;status('syncing','同步中…');
    try{
        ensureTarget();
        const local=norm(state),localFp=fingerprint(local),remote=await readRemote();
        if(!remote.exists){
            const sha=await writeRemote(local,null);record(local,sha);status('online','公开阅读 · 管理已连接');if(showResult)show('已创建云端文件并完成同步','success');return true
        }
        const remoteFp=fingerprint(remote.state),baseFp=meta.fingerprint;
        if(localFp===remoteFp){
            record(local,remote.sha);status('online','公开阅读 · 管理已连接');if(showResult)show('本地与 GitHub 已一致','success');return true
        }
        if(typeof baseFp==='string'&&localFp!==baseFp&&remoteFp===baseFp){
            const sha=await writeRemote(local,remote.sha);record(local,sha);status('online','公开阅读 · 管理已连接');if(showResult)show('已同步到 GitHub','success');return true
        }
        if(typeof baseFp==='string'&&localFp===baseFp&&remoteFp!==baseFp){
            state=remote.state;render();record(state,remote.sha);status('online','公开阅读 · 管理已连接');if(showResult)show('已采用 GitHub 最新数据','success');return true
        }
        if(!showResult){
            status('offline','存在同步冲突');show('本地和 GitHub 都发生了变化，请点击“同步”处理','error');return false
        }
        if(confirm('检测到本地和 GitHub 数据不同。\n\n确定：用当前网页数据覆盖 GitHub。\n取消：采用 GitHub 数据。')){
            const sha=await writeRemote(local,remote.sha);record(local,sha);status('online','公开阅读 · 管理已连接');show('已用当前网页数据覆盖 GitHub','success')
        }else{
            state=remote.state;render();record(state,remote.sha);status('online','公开阅读 · 管理已连接');show('已采用 GitHub 数据','success')
        }
        return true
    }catch(e){
        console.error(e);status('offline','管理同步失败');show(`同步失败：${e.message}`,'error');return false
    }finally{
        syncing=false;syncBtn.disabled=false
    }
}
function schedule(){saveLocal();if(!admin())return;clearTimeout(autoTimer);autoTimer=setTimeout(()=>{autoTimer=null;sync(false)},AUTO_DELAY)}
async function loadPublic(){
    status('syncing','正在读取公开数据…');
    try{
        const r=await fetch(publicUrl(),{cache:'no-store'});if(!r.ok)throw new Error(`HTTP ${r.status}`);
        state=norm(await r.json());render();status('online','公开阅读');lastSyncTime.textContent=`公开数据 · ${state.entries.length} 条`
    }catch(e){
        console.error(e);
        const local=loadLocal();state=local||{entries:[],institutions:[],categories:[],groups:[],tags:[]};render();status('offline','公开数据读取失败');
        lastSyncTime.textContent=local?'暂时显示浏览器缓存':'请确认 press_data.json 与网页位于同一发布目录'
    }
}
async function loadAdminState(){
    status('syncing','正在读取管理数据…');ensureTarget();
    const cached=loadLocal();
    try{
        const remote=await readRemote();
        if(remote.exists){
            state=remote.state;render();record(state,remote.sha);status('online','公开阅读 · 管理已连接')
        }else{
            state=cached||{entries:[],institutions:[],categories:[],groups:[],tags:[]};render();status('online','公开阅读 · 管理已连接');lastSyncTime.textContent='云端数据文件尚未创建'
        }
    }catch(e){
        console.error(e);state=cached||{entries:[],institutions:[],categories:[],groups:[],tags:[]};render();status('offline','管理云端读取失败');lastSyncTime.textContent=cached?'已保留本地数据':'没有可恢复的本地数据'
    }
}

function allMultiPanels(){
    return [institutionPanel,editInstitutionPanel,categoryPanel,editCategoryPanel,groupPanel,editGroupPanel,tagPanel,editTagPanel]
}
function setupInstitutionCombo(which){
    const meta=institutionMeta(which);
    meta.toggle.addEventListener('click',e=>{
        e.stopPropagation();
        const willOpen=meta.panel.classList.contains('hidden');
        allMultiPanels().forEach(panel=>panel.classList.add('hidden'));
        if(willOpen){
            meta.panel.classList.remove('hidden');
            renderInstitutionOptions(which)
        }
    });
    meta.input.addEventListener('click',e=>{
        e.stopPropagation();
        allMultiPanels().forEach(panel=>panel.classList.add('hidden'));
        meta.panel.classList.remove('hidden');
        renderInstitutionOptions(which)
    });
    meta.input.addEventListener('input',()=>renderInstitutionOptions(which));
    meta.input.addEventListener('keydown',e=>{
        if(e.key==='Enter'){
            e.preventDefault();
            commitInstitution(which,true);
            meta.panel.classList.remove('hidden')
        }
    });
    meta.options.addEventListener('click',e=>{
        e.stopPropagation();
        const del=e.target.closest('.combo-pill-delete[data-delete-value]');
        if(del)return deleteInstitutionHistory(del.dataset.deleteValue);
        const add=e.target.closest('.combo-add[data-add-current]');
        if(add){
            commitInstitution(which,true);
            meta.panel.classList.remove('hidden');
            return
        }
        const select=e.target.closest('.combo-pill-select[data-select-value]');
        if(select){
            meta.input.value=select.dataset.selectValue;
            renderInstitutionOptions(which);
            meta.panel.classList.add('hidden');
            meta.input.focus()
        }
    });
    meta.combo.addEventListener('click',e=>e.stopPropagation())
}
function setupMultiCombo(type,which){
    const meta=multiMeta(type,which);
    const toggle=type==='category'
        ? (which==='edit'?editCategoryToggle:categoryToggle)
        : type==='group'
            ? (which==='edit'?editGroupToggle:groupToggle)
            : (which==='edit'?editTagToggle:tagToggle);
    const combo=type==='category'
        ? (which==='edit'?editCategoryCombo:categoryCombo)
        : type==='group'
            ? (which==='edit'?editGroupCombo:groupCombo)
            : (which==='edit'?editTagCombo:tagCombo);

    toggle.addEventListener('click',e=>{
        e.stopPropagation();
        const willOpen=meta.panel.classList.contains('hidden');
        allMultiPanels().forEach(panel=>panel.classList.add('hidden'));
        if(willOpen){
            meta.panel.classList.remove('hidden');
            renderMultiField(type,which)
        }
    });
    meta.input.addEventListener('click',e=>{
        e.stopPropagation();
        allMultiPanels().forEach(panel=>panel.classList.add('hidden'));
        meta.panel.classList.remove('hidden');
        renderMultiField(type,which)
    });
    meta.input.addEventListener('input',()=>renderMultiOptions(type,which));
    meta.input.addEventListener('keydown',e=>{
        if(e.key==='Enter'){
            e.preventDefault();
            commitTypedValue(type,which,true);
            meta.panel.classList.remove('hidden')
        }
    });
    meta.options.addEventListener('click',e=>{
        e.stopPropagation();
        const del=e.target.closest('.combo-pill-delete[data-delete-value]');
        if(del)return deleteHistoryOption(type,del.dataset.deleteValue);
        const add=e.target.closest('.combo-add[data-add-current]');
        if(add){
            commitTypedValue(type,which,true);
            meta.panel.classList.remove('hidden');
            return
        }
        const select=e.target.closest('.combo-pill-select[data-select-value]');
        if(select)return toggleSelection(type,which,select.dataset.selectValue)
    });
    meta.selectedBox.addEventListener('click',e=>{
        e.stopPropagation();
        const remove=e.target.closest('.selected-pill-remove[data-remove-value]');
        if(remove)return removeSelection(type,which,remove.dataset.removeValue)
    });
    combo.addEventListener('click',e=>e.stopPropagation())
}
