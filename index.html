<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,viewport-fit=cover,interactive-widget=resizes-content">
<title>Press</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{
min-height:100vh;
padding:2rem 1rem 4rem;
background:#f5f7fa;
color:#0f172a;
font-family:"Times New Roman","Microsoft YaHei","PingFang SC",serif
}
button,input,select{font:inherit}
button{cursor:pointer}
.hidden{display:none!important}
.container{
width:min(100%,1100px);
margin:auto;
padding:2rem 1.8rem;
background:#fff;
border-radius:32px;
box-shadow:0 20px 42px -14px rgba(15,23,42,.18)
}
.page-title{
display:flex;
flex-wrap:wrap;
align-items:center;
gap:12px;
margin-bottom:1.45rem;
padding-bottom:.8rem;
border-bottom:2px solid #e8edf4;
font-size:2.2rem
}
.cloud-status{
display:inline-flex;
align-items:center;
gap:8px;
padding:.35rem .9rem;
border-radius:999px;
background:#f1f5f9;
color:#475569;
font-size:.82rem;
font-weight:500
}
.status-dot{
width:9px;
height:9px;
border-radius:50%;
background:#94a3b8
}
.status-dot.online{background:#22c55e}
.status-dot.offline{background:#ef4444}
.status-dot.syncing{background:#f59e0b}
.toolbar{
display:flex;
flex-wrap:wrap;
justify-content:space-between;
gap:12px;
margin-bottom:1.7rem;
padding-bottom:1rem;
border-bottom:1px solid #e8edf4
}
.toolbar-group{
display:flex;
flex-wrap:wrap;
gap:9px
}
.btn{
min-height:36px;
padding:.45rem 1.1rem;
border:1px solid #cbd5e1;
border-radius:999px;
background:#fff;
color:#334155;
font-size:.86rem;
font-weight:650
}
.btn:hover{background:#f1f5f9}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btn-primary{
border-color:#1e293b;
background:#1e293b;
color:#fff
}
.btn-primary:hover{background:#0f172a}
.btn-danger{
border-color:#fecaca;
background:#fee2e2;
color:#991b1b
}
.btn-danger:hover{background:#fecaca}
.btn-sync{
border-color:#1E40AF;
background:#1E40AF;
color:#fff
}
.last-sync{
color:#94a3b8;
font-size:.8rem
}
.add-section{
margin-bottom:2rem;
padding:1.5rem;
border:1px solid #e2e8f0;
border-radius:24px;
background:#f8fafc
}
.add-section h2{
margin-bottom:1rem;
font-size:1.3rem
}
.list-header h2{
font-size:1.4rem
}
.form-grid{
display:grid;
grid-template-columns:repeat(2,minmax(0,1fr));
gap:1rem
}
.bookno-tag-row{
grid-column:1/-1;
display:grid;
grid-template-columns:repeat(2,minmax(0,1fr));
gap:1rem
}
.form-group{
display:flex;
flex-direction:column;
gap:6px;
min-width:0
}
.form-group.full{
grid-column:1/-1
}
.form-group label{
color:#475569;
font-size:.78rem;
font-weight:700;
letter-spacing:.04em
}
.form-group input,
.form-group select{
width:100%;
min-height:44px;
padding:.72rem 1rem;
border:1px solid #cbd5e1;
border-radius:15px;
background:#fff;
color:#0f172a;
outline:none
}
.form-group input:focus,
.form-group select:focus{
outline:2px solid #93b4ff;
outline-offset:1px;
border-color:transparent
}
.form-group input[readonly]{
background:#f1f5f9;
color:#64748b
}
.clearable-field,
.edit-title-field{
display:grid;
grid-template-columns:minmax(0,1fr) 36px;
gap:6px;
align-items:center
}
.clear-field-btn{
height:44px;
width:36px;
border:1px solid #cbd5e1;
border-radius:12px;
background:#fff;
color:#64748b;
font-weight:800
}
.clear-field-btn:hover{
background:#f1f5f9;
color:#0f172a
}
.add-button{
grid-column:1/-1;
width:100%;
min-height:46px;
margin-top:.2rem;
border:0;
border-radius:999px;
background:#1e293b;
color:#fff;
font-weight:700
}
.add-button:hover{
background:#0f172a
}
.combo{
position:relative;
border:1px solid #cbd5e1;
border-radius:15px;
background:#fff;
padding:.45rem;
min-height:44px
}
.combo-row{
display:grid;
grid-template-columns:minmax(0,1fr) 44px;
gap:7px
}
.combo-row input{
border:0!important;
border-radius:10px!important;
min-height:38px;
padding:.55rem .7rem
}
.combo-row input:focus{
outline:2px solid #93b4ff!important;
outline-offset:0
}
.combo-toggle{
min-height:38px;
border:1px solid #cbd5e1;
border-radius:12px;
background:#fff;
color:#475569;
font-weight:700
}
.combo-toggle:hover{
background:#f1f5f9
}
.combo-panel{
position:absolute;
left:0;
right:0;
top:calc(44px + 7px);
z-index:650;
max-height:250px;
overflow-y:auto;
padding:.6rem;
border:1px solid #cbd5e1;
border-radius:15px;
background:#fff;
box-shadow:0 15px 30px rgba(15,23,42,.14)
}
.combo-selected{
display:flex;
flex-wrap:wrap;
gap:6px;
margin-bottom:6px
}
.combo-selected:empty{display:none}
.combo-option-list{
display:flex;
flex-direction:column;
gap:6px
}
.combo-pill,
.selected-pill{
display:inline-flex;
align-items:center;
max-width:100%;
min-height:34px;
border:1px solid #cbd5e1;
border-radius:999px;
background:#f8fafc;
overflow:hidden
}
.combo-pill{
display:flex;
width:100%;
border-radius:11px
}
.combo-pill.selected{
border-color:#93b4ff;
background:#eaf1ff
}
.combo-pill-select{
flex:1;
min-width:0;
padding:.5rem .7rem;
border:0;
background:transparent;
color:#0f172a;
text-align:left;
white-space:normal;
overflow-wrap:anywhere
}
.combo-pill-select:hover{background:rgba(226,232,240,.7)}
.combo-pill-select.keyboard-active{
background:#dbeafe;
color:#1E3A8A;
font-weight:800;
box-shadow:inset 0 0 0 2px #93c5fd
}
.combo-pill-edit,
.combo-pill-delete,
.selected-pill-remove{
flex:0 0 28px;
width:28px;
height:30px;
border:0;
border-radius:50%;
background:transparent;
font-size:.95rem;
font-weight:800;
line-height:1
}
.combo-pill-edit{color:#15803d}
.combo-pill-edit:hover{
background:#dcfce7;
color:#166534
}
.combo-pill-delete,
.selected-pill-remove{
margin-right:2px;
color:#991b1b
}
.combo-pill-delete:hover,
.selected-pill-remove:hover{background:#fee2e2}
.selected-pill-label{
min-width:0;
padding:.4rem .28rem .4rem .72rem;
color:#334155;
white-space:normal;
overflow-wrap:anywhere
}
.combo-empty{
width:100%;
padding:.75rem;
color:#94a3b8;
text-align:center;
font-size:.82rem
}
.list-header{
display:flex;
align-items:center;
justify-content:space-between;
gap:12px;
margin-bottom:.8rem
}
.count-badge{
min-width:38px;
padding:.22rem .8rem;
border-radius:999px;
background:#e8edf4;
text-align:center;
font-size:.8rem;
font-weight:650
}
.press-list{
border:1px solid #e2e8f0;
border-radius:20px;
overflow:hidden;
background:#fff
}
.press-item{
position:relative;
width:100%;
max-width:100%;
min-width:0;
padding:1.15rem 1.2rem .95rem;
background:#fff;
overflow:hidden
}
.press-item+.press-item{border-top:2px solid #dbe3ed}
.press-item:hover{background:#fafcff}
.press-head{
display:flex;
align-items:flex-start;
justify-content:space-between;
gap:1rem
}
.press-content{
flex:1;
min-width:0
}
.book-title{
font-size:1.15rem;
font-weight:750;
line-height:1.45;
overflow-wrap:anywhere;
word-break:break-word;
color:#1E40AF
}
.book-title a,
.institution a{
color:#1E40AF;
text-decoration:none
}
.book-title a:hover{
color:#1E3A8A;
text-decoration:underline
}
.institution a:visited,
.institution a:hover{
color:#1E40AF;
text-decoration:underline
}
#institutionOptions a,
#institutionOptions a:visited,
#editInstitutionOptions a,
#editInstitutionOptions a:visited,
#manageInstitutionOptions a,
#manageInstitutionOptions a:visited{
color:#1E40AF!important;
text-decoration:none
}
#institutionOptions a:hover,
#editInstitutionOptions a:hover,
#manageInstitutionOptions a:hover{
color:#1E40AF!important;
text-decoration:underline
}
.meta{
display:grid;
grid-template-columns:1fr;
gap:.26rem;
margin-top:.6rem;
color:#475569;
font-size:.9rem;
line-height:1.55
}
.meta-row{
display:grid;
grid-template-columns:3.25em minmax(0,1fr);
align-items:start;
column-gap:0;
overflow-wrap:anywhere;
text-align:left
}
.meta-label{
display:block;
width:3.25em;
color:#94a3b8;
white-space:nowrap
}
.meta-value{
display:block;
min-width:0;
margin:0;
padding:0;
overflow-wrap:anywhere
}
.bookshelf-row{
display:grid;
grid-template-columns:3.25em minmax(0,1fr);
align-items:start;
column-gap:0;
text-align:left
}
.bookshelf-text{
display:block;
min-width:0;
margin:0;
padding:0;
overflow-wrap:anywhere
}
.tag-row{
display:grid;
grid-template-columns:3.25em minmax(0,1fr);
align-items:start;
column-gap:0
}
.tag-value{
display:inline-flex;
align-items:center;
flex-wrap:wrap;
min-width:0;
gap:0
}
.edit-btn{
flex:0 0 auto;
position:absolute;
right:1.15rem;
bottom:1rem;
padding:0;
border:0;
background:transparent;
color:#64748b;
font-size:.9rem;
font-family:"Times New Roman","Microsoft YaHei","PingFang SC",serif;
line-height:1.55
}
.edit-btn:hover{color:#475569}
#pressList .press-item,
#pressList .press-item .meta,
#pressList .press-item .meta-label,
#pressList .press-item .meta-value,
#pressList .press-item .edit-btn,
#pressList .press-item .edit-btn:hover{color:#000000}
#pressList .press-item .book-title,
#pressList .press-item .book-title a,
#pressList .press-item .book-title a:visited{color:#1E40AF}
#pressList .press-item .book-title a:hover{color:#1E3A8A}
#pressList .press-item .institution a,
#pressList .press-item .institution a:visited,
#pressList .press-item .institution a:hover{color:#1E40AF}
.empty-state{
padding:2.8rem 1rem;
background:#fafcff;
color:#94a3b8;
text-align:center
}
.overlay{
position:fixed;
inset:0;
z-index:1000;
display:flex;
align-items:center;
justify-content:center;
padding:12px;
background:rgba(15,23,42,.45);
backdrop-filter:blur(5px)
}
.dialog{
width:min(100%,620px);
max-height:calc(100dvh - 24px);
display:flex;
flex-direction:column;
overflow:hidden;
background:#fff;
border-radius:26px;
box-shadow:0 30px 70px rgba(15,23,42,.28)
}
.dialog-scroll{
flex:1 1 auto;
min-height:0;
overflow-y:auto;
padding:1.7rem 1.7rem 1rem
}
.dialog h3{
margin-bottom:.9rem;
font-size:1.3rem
}
.dialog .form-group{margin-bottom:.95rem}
.edit-two-column-row{
display:grid;
grid-template-columns:repeat(2,minmax(0,1fr));
gap:1rem
}
.dialog-actions{
flex:0 0 auto;
display:flex;
gap:9px;
padding:.95rem 1.7rem;
border-top:1px solid #e8edf4;
background:#fff
}
#editModal #editCancel{margin-left:auto}
.manage-dialog{height:min(760px,calc(100dvh - 24px))}
.manage-fixed-top{
flex:0 0 auto;
padding:1.7rem 1.7rem .9rem;
border-bottom:1px solid #e8edf4
}
.manage-table-scroll{
flex:1 1 auto;
min-height:0;
overflow-y:auto;
padding:.55rem 1.7rem 1rem
}
.manage-add-row{
display:grid;
grid-template-columns:minmax(0,1fr) 92px auto;
gap:8px
}
.manage-option-row{
display:grid;
grid-template-columns:minmax(0,1fr) 86px 30px 30px;
gap:7px;
align-items:center;
min-height:46px;
margin-top:7px;
padding:.35rem .4rem;
border:1px solid #cbd5e1;
border-radius:12px
}
.manage-line-input{
width:100%;
height:34px;
border:1px solid #cbd5e1;
border-radius:9px;
text-align:center
}
#manageModal .dialog-actions{justify-content:flex-end}
.toast{
position:fixed;
left:50%;
bottom:28px;
z-index:1500;
max-width:min(90vw,640px);
padding:.78rem 1.5rem;
transform:translateX(-50%);
border-radius:999px;
background:#1E40AF;
color:#fff;
font-size:.88rem;
font-weight:600
}
.toast.success{background:#16a34a}
.toast.error{background:#dc2626}
#returnTopControl{
position:fixed;
left:auto;
right:8px;
top:70%;
z-index:2147483647;
width:28px;
height:25px;
padding:0;
border:0;
background:transparent
}
#returnTopControl::before{
content:"";
position:absolute;
left:0;
top:0;
width:0;
height:0;
border-left:14px solid transparent;
border-right:14px solid transparent;
border-bottom:24.25px solid #1E40AF
}
#tagToggle,
#institutionToggle,
#categoryToggle,
#editTagToggle,
#editInstitutionToggle,
#editCategoryToggle{display:none!important}
#addSection .combo,
#editModal .combo{
height:44px;
min-height:44px;
padding:0;
border:1px solid #cbd5e1;
border-radius:15px
}
#addSection .combo-row,
#editModal .combo-row{
display:grid;
grid-template-columns:minmax(0,1fr);
height:42px
}
#addSection .combo-row input,
#editModal .combo-row input{
width:100%;
height:42px;
min-height:42px;
padding:.55rem .9rem!important;
border:0!important;
background:transparent!important
}
#tagOptions .combo-option-list,
#editTagOptions .combo-option-list,
#categoryOptions .combo-option-list,
#editCategoryOptions .combo-option-list{
display:flex;
flex-direction:row;
flex-wrap:wrap;
gap:8px
}
#tagOptions .combo-pill,
#editTagOptions .combo-pill,
#categoryOptions .combo-pill,
#editCategoryOptions .combo-pill{
display:inline-flex;
flex:0 0 auto;
width:auto;
min-height:32px;
border-radius:5px;
background:#fff
}
#tagOptions .combo-pill-select,
#editTagOptions .combo-pill-select,
#categoryOptions .combo-pill-select,
#editCategoryOptions .combo-pill-select{
width:auto;
padding:.42rem .72rem;
font-size:.95rem;
text-align:center;
white-space:nowrap
}
#tagInput,
#categoryInput,
#editTag,
#editCategory{
cursor:text!important;
background:#fff!important;
color:#0f172a!important
}
#tagCombo:has(> .combo-selected:not(:empty)),
#editTagCombo:has(> .combo-selected:not(:empty)){
display:flex!important;
flex-wrap:nowrap!important;
align-items:center!important;
gap:4px!important;
width:100%;
min-width:0
}
#tagCombo > .combo-selected:not(:empty),
#editTagCombo > .combo-selected:not(:empty){
display:flex!important;
flex:0 1 auto;
flex-wrap:nowrap!important;
align-items:center;
gap:4px;
min-width:0;
max-width:calc(100% - 64px);
height:42px;
margin:0!important;
padding:0 0 0 .35rem;
overflow-x:auto;
overflow-y:hidden;
scrollbar-width:none
}
#tagCombo > .combo-selected:not(:empty)::-webkit-scrollbar,
#editTagCombo > .combo-selected:not(:empty)::-webkit-scrollbar{display:none}
#tagCombo > .combo-selected:not(:empty) .selected-pill,
#editTagCombo > .combo-selected:not(:empty) .selected-pill{
flex:0 0 auto!important;
width:auto!important;
max-width:none!important;
min-width:max-content;
white-space:nowrap!important
}
#tagCombo > .combo-selected:not(:empty) .selected-pill-label,
#editTagCombo > .combo-selected:not(:empty) .selected-pill-label{
flex:0 0 auto;
min-width:max-content;
white-space:nowrap!important;
overflow-wrap:normal!important;
word-break:keep-all
}
#tagCombo > .combo-selected:not(:empty) + .combo-row,
#editTagCombo > .combo-selected:not(:empty) + .combo-row{
display:grid!important;
flex:1 1 80px;
min-width:60px;
height:42px
}
#tagCombo > .combo-selected:not(:empty) + .combo-row input,
#editTagCombo > .combo-selected:not(:empty) + .combo-row input{
display:block!important;
min-width:0!important;
width:100%!important
}
#categoryCombo:has(> .combo-selected:not(:empty)),
#editCategoryCombo:has(> .combo-selected:not(:empty)){display:block!important}
#categoryCombo > .combo-selected:not(:empty),
#editCategoryCombo > .combo-selected:not(:empty){
display:flex!important;
align-items:center;
width:100%;
height:42px;
padding:0 .45rem;
margin:0
}
#categoryCombo > .combo-selected:not(:empty) + .combo-row,
#editCategoryCombo > .combo-selected:not(:empty) + .combo-row{display:none!important}
#editTagOptions .combo-option-list,
#editCategoryOptions .combo-option-list{
display:grid;
grid-template-columns:repeat(5,minmax(0,1fr));
gap:6px
}
#editTagOptions .combo-pill,
#editCategoryOptions .combo-pill{
display:flex;
width:100%;
min-width:0
}
#editTagOptions .combo-pill-select,
#editCategoryOptions .combo-pill-select{
width:100%;
min-width:0;
padding:.36rem .18rem;
font-size:.95rem;
white-space:nowrap;
overflow:hidden;
text-overflow:ellipsis
}
@media(max-width:700px){
html,body{
width:100%;
max-width:100%;
overflow-x:hidden
}
body{padding:.8rem}
.container{
width:100%;
max-width:100%;
min-width:0;
padding:1.25rem;
border-radius:22px
}
.press-list{
width:100%;
max-width:100%;
min-width:0
}
.press-item{
width:100%;
max-width:100%;
min-width:0;
padding:1rem
}
.book-title,
.meta,
.meta-row{
max-width:100%;
min-width:0;
overflow-wrap:anywhere;
word-break:break-word
}
.page-title{font-size:1.8rem}
.toolbar{
flex-direction:column;
align-items:stretch
}
.toolbar-group{justify-content:center}
.last-sync{text-align:center}
.add-section{padding:1.2rem}
.form-grid{grid-template-columns:1fr}
.form-group.full,
.add-button{grid-column:auto}
.bookno-tag-row{grid-template-columns:1fr}
.edit-two-column-row{grid-template-columns:1fr}
.dialog{
width:100%;
max-height:calc(100dvh - 16px);
border-radius:20px
}
.dialog-scroll{padding:1.2rem}
#tagCombo > .combo-selected:not(:empty),
#editTagCombo > .combo-selected:not(:empty){max-width:calc(100% - 54px)}
#tagCombo > .combo-selected:not(:empty) + .combo-row,
#editTagCombo > .combo-selected:not(:empty) + .combo-row{
flex-basis:54px;
min-width:50px
}
}
</style>
</head>
<body>
<div id="pageTopAnchor" aria-hidden="true"></div>

<main class="container">
<h1 class="page-title">
Press
<span class="cloud-status">
<span class="status-dot" id="statusDot"></span>
<span id="statusText">正在读取公开数据</span>
</span>
</h1>

<section class="toolbar">
<div class="toolbar-group">
<button class="btn btn-sync hidden" id="syncBtn" type="button">同步</button>
<button class="btn" id="configBtn" type="button">配置</button>
<button class="btn" id="manageBtn" type="button">排序</button>
<button class="btn" id="importBtn" type="button">导入</button>
<button class="btn" id="exportBtn" type="button">导出</button>
<input class="hidden" id="importInput" type="file" accept=".html,text/html">
</div>
<span class="last-sync" id="lastSyncTime">公开阅读无需 Token</span>
</section>

<section class="add-section hidden" id="addSection">
<h2>添加</h2>
<div class="form-grid">
<div class="form-group full">
<label for="bookNameInput">书名</label>
<input type="text" id="bookNameInput" autocomplete="off" autofocus>
</div>
<div class="bookno-tag-row">
<div class="form-group">
<label for="bookNoInput">书号</label>
<input type="text" id="bookNoInput" autocomplete="off">
</div>
<div class="form-group">
<label for="institutionInput">出版</label>
<div class="combo" id="institutionCombo">
<div class="combo-row">
<input type="text" id="institutionInput" autocomplete="off">
<button class="combo-toggle" id="institutionToggle" type="button" aria-label="展开出版历史"></button>
</div>
<div class="combo-panel hidden" id="institutionPanel">
<div id="institutionOptions"></div>
</div>
</div>
</div>
</div>
<div class="bookno-tag-row">

function clean(value){return String(value??'').normalize('NFC').trim()}
function cleanTitle(value){return String(value??'').normalize('NFC').trim()}
function folded(value){return clean(value).normalize('NFKC')}
function key(value){return folded(value).toLocaleLowerCase('zh-CN')}

function esc(value){
const div=document.createElement('div');
div.textContent=String(value??'');
return div.innerHTML;
}

function attr(value){return esc(value).replace(/"/g,'&quot;')}

function uid(){
return crypto?.randomUUID
? crypto.randomUUID()
: `press_${Date.now()}_${Math.random().toString(36).slice(2,9)}`;
}

function uniq(values){
const map=new Map();
for(const raw of values||[]){
const value=clean(raw);
if(value&&!map.has(key(value)))map.set(key(value),value);
}
return [...map.values()];
}

function normalizeMulti(value){return uniq(Array.isArray(value)?value:[value])}

function normalizeFixedGroupLabel(value){
const original=clean(value);
const fixed=folded(original);
return GROUP_CODES.includes(fixed)?`${fixed}组`:original;
}

function codeGroupValue(value){
const original=clean(value);
const fixed=folded(original);
const match=fixed.match(/^(11|12|13|14|21|22|23)组$/);
return match?match[1]:original;
}

function tagPrefixNumber(value){
const match=folded(value).match(/^(\d{2})/);
return match?Number(match[1]):Number.POSITIVE_INFINITY;
}

function compareTagsByPrefix(a,b){
const ap=tagPrefixNumber(a);
const bp=tagPrefixNumber(b);
if(ap!==bp)return ap-bp;
return collator.compare(clean(a),clean(b));
}

function sortTags(values){
return uniq(Array.isArray(values)?values:[values]).sort(compareTagsByPrefix);
}

function titleIsChinese(raw){
const visible=String(raw??'').replace(/\[([^\]]+)\]\((?:https?:\/\/)?[^)]+\)/gi,'$1');
return /[\u3400-\u4DBF\u4E00-\u9FFF\uF900-\uFAFF]/.test(visible);
}

function compareBookNo(a,b){
const aa=folded(a);
const bb=folded(b);
if(aa&&!bb)return -1;
if(!aa&&bb)return 1;
if(!aa&&!bb)return 0;

function triple(value){
const match=value.match(/^(\d+)-(\d+)-(\d+)$/);
return match?[Number(match[1]),Number(match[2]),Number(match[3])]:null;
}

const at=triple(aa);
const bt=triple(bb);
const group=(value,tripleValue)=>tripleValue?0:(value.includes('·')?1:2);
const ga=group(aa,at);
const gb=group(bb,bt);

if(ga!==gb)return ga-gb;

if(ga===0){
for(let i=0;i<3;i++){
if(at[i]!==bt[i])return at[i]-bt[i];
}
}

return collator.compare(aa,bb);
}

function codeGroupsFromEntry(entry){
const raw=normalizeMulti(entry?.tag).map(clean).filter(Boolean);
if(!raw.length)return null;
const codes=raw.map(codeGroupValue);
if(codes.some(value=>!CODE_GROUP_OPTIONS.includes(value)))return null;
return uniq(codes).sort((a,b)=>Number(a)-Number(b));
}

function mergeCodeRanges(ranges){
const ordered=(ranges||[])
.map(range=>[Number(range[0]),Number(range[1])])
.filter(range=>Number.isFinite(range[0])&&Number.isFinite(range[1])&&range[0]<=range[1])
.sort((a,b)=>a[0]-b[0]||a[1]-b[1]);

const merged=[];

for(const range of ordered){
const last=merged[merged.length-1];
if(last&&range[0]<=last[1]+1){
last[1]=Math.max(last[1],range[1]);
}else{
merged.push([...range]);
}
}

return merged;
}

function codeRangesForEntry(entry){
const groups=codeGroupsFromEntry(entry);
if(!groups?.length)return [];

const combination=groups.join('/');
const rules=titleIsChinese(entry.bookName)?CODE_RULES.zh:CODE_RULES.en;

if(rules.exceptions[combination]){
return mergeCodeRanges(rules.exceptions[combination]);
}

return mergeCodeRanges(groups.flatMap(group=>rules.groups[group]||[]));
}

function normalizeStoredCode(raw){
const value=folded(raw);
return /^\d{6}$/.test(value)?value:'';
}

function codeAllowedForEntry(entry,rawCode){
const code=Number(normalizeStoredCode(rawCode));
if(!Number.isInteger(code))return false;
return codeRangesForEntry(entry).some(([start,end])=>code>=start&&code<=end);
}

function smallestAvailableCode(entry,used){
for(const [start,end] of codeRangesForEntry(entry)){
let number=start;
while(number<=end&&used.has(number))number++;
if(number<=end)return String(number).padStart(6,'0');
}
return '';
}

function usedCodesExcept(entries,excludeId=''){
const used=new Set();

for(const entry of entries||[]){
if(excludeId&&entry.id===excludeId)continue;
const code=normalizeStoredCode(entry.code);
if(code)used.add(Number(code));
}

return used;
}

function renderLinkedText(raw){
const source=clean(raw);
const regex=/\[([^\]]+)\]\((https?:\/\/[^\s)]+)\)/gi;
let html='';
let last=0;
let match;

while((match=regex.exec(source))){
html+=esc(source.slice(last,match.index));
html+=`<a href="${attr(match[2])}" target="_blank" rel="noopener noreferrer">${esc(match[1])}</a>`;
last=match.index+match[0].length;
}

return html+esc(source.slice(last));
}

function normEntry(raw){
if(!raw||typeof raw!=='object')return null;

const bookName=cleanTitle(raw.bookName);
if(!bookName)return null;

const preservedCode=clean(raw.code);

return {
id:clean(raw.id)||uid(),
bookName,
bookNo:clean(raw.bookNo),
institution:clean(raw.institution),
category:normalizeMulti(raw.category),
tag:sortTags(normalizeMulti(raw.tag).map(normalizeFixedGroupLabel)),
tagChecked:Boolean(raw.tagChecked),
code:preservedCode,
codeAutoManaged:Boolean(preservedCode&&raw.codeAutoManaged===true&&!raw.codeManualEdited),
codeAutoPending:Boolean(!preservedCode&&raw.codeAutoPending===true),
codeManualEdited:Boolean(preservedCode&&raw.codeManualEdited),
codeManualPinned:Boolean(preservedCode&&raw.codeManualEdited&&raw.codeManualPinned)
};
}

function norm(value){
const source=Array.isArray(value)?{entries:value}:(value&&typeof value==='object'?value:{});

const entries=(Array.isArray(source.entries)?source.entries:[])
.map(normEntry)
.filter(Boolean);

const institutions=uniq(
Array.isArray(source.institutions)
? source.institutions
: entries.map(entry=>entry.institution).filter(Boolean)
);

const categories=uniq(
Array.isArray(source.categories)
? source.categories
: entries.flatMap(entry=>entry.category)
);

const orderMap=new Map(institutions.map((value,index)=>[key(value),index]));

entries.sort((a,b)=>{
const ai=orderMap.has(key(a.institution))?orderMap.get(key(a.institution)):Number.MAX_SAFE_INTEGER;
const bi=orderMap.has(key(b.institution))?orderMap.get(key(b.institution)):Number.MAX_SAFE_INTEGER;

if(ai!==bi)return ai-bi;

if(ai===Number.MAX_SAFE_INTEGER){
const result=collator.compare(a.institution,b.institution);
if(result!==0)return result;
}

const bookNoResult=compareBookNo(a.bookNo,b.bookNo);
if(bookNoResult!==0)return bookNoResult;

return collator.compare(a.bookName,b.bookName);
});

return {
schemaVersion:9,
entries,
institutions,
categories,
tags:[...GROUP_OPTIONS]
};
}

function sameSyncValue(a,b){return JSON.stringify(a)===JSON.stringify(b)}
function stateSignature(value){return JSON.stringify(norm(value))}
function copySyncValue(value){return Array.isArray(value)?[...value]:value}

const ENTRY_SYNC_FIELDS=Object.freeze([
'bookName',
'bookNo',
'institution',
'category',
'tag',
'tagChecked',
'code',
'codeAutoManaged',
'codeAutoPending',
'codeManualEdited',
'codeManualPinned'
]);

const CODE_SYNC_FIELDS=new Set([
'code',
'codeAutoManaged',
'codeAutoPending',
'codeManualEdited',
'codeManualPinned'
]);

function codeBundle(entry){
const code=clean(entry?.code);
const manual=Boolean(code&&entry?.codeManualEdited);
const autoManaged=Boolean(code&&entry?.codeAutoManaged===true&&!manual);

return {
code,
codeAutoManaged:autoManaged,
codeAutoPending:Boolean(!code&&entry?.codeAutoPending===true),
codeManualEdited:manual,
codeManualPinned:Boolean(manual&&entry?.codeManualPinned)
};
}

function mergeCodeBundle(baseEntry,localEntry,remoteEntry,stats){
const base=codeBundle(baseEntry);
const local=codeBundle(localEntry);
const remote=codeBundle(remoteEntry);

if(base.code){
const localCodeChanged=local.code!==base.code;
const remoteCodeChanged=remote.code!==base.code;

const localGroupChanged=Boolean(
localEntry &&
!sameSyncValue(sortTags(localEntry.tag),sortTags(baseEntry?.tag))
);

const remoteGroupChanged=Boolean(
remoteEntry &&
!sameSyncValue(sortTags(remoteEntry.tag),sortTags(baseEntry?.tag))
);

const localManualChange=
localCodeChanged &&
(
local.codeManualEdited ||
localGroupChanged ||
(!local.code&&!local.codeAutoPending)
);

const remoteManualChange=
remoteCodeChanged &&
(
remote.codeManualEdited ||
remoteGroupChanged ||
(!remote.code&&!remote.codeAutoPending)
);

if(!localManualChange&&!remoteManualChange)return base;
if(localManualChange&&!remoteManualChange)return local;
if(remoteManualChange&&!localManualChange)return remote;
if(sameSyncValue(local,remote))return local;

stats.codeConflicts++;

stats.codeConflictItems.push({
id:localEntry?.id||remoteEntry?.id||baseEntry?.id||'',
bookName:localEntry?.bookName||remoteEntry?.bookName||baseEntry?.bookName||'未命名条目',
tag:[...(localEntry?.tag||remoteEntry?.tag||baseEntry?.tag||[])],
baseCode:clean(baseEntry?.code),
localCode:clean(localEntry?.code),
remoteCode:clean(remoteEntry?.code)
});

return local;
}

if(baseEntry&&sameSyncValue(local,base)&&!sameSyncValue(remote,base))return remote;
if(baseEntry&&sameSyncValue(remote,base)&&!sameSyncValue(local,base))return local;

if(!local.code&&local.codeAutoPending===true&&remote.code){
const localGroupChanged=Boolean(
baseEntry &&
localEntry &&
!sameSyncValue(sortTags(localEntry.tag),sortTags(baseEntry.tag))
);
return localGroupChanged?local:remote;
}

if(!remote.code&&remote.codeAutoPending===true&&local.code){
const remoteGroupChanged=Boolean(
baseEntry &&
remoteEntry &&
!sameSyncValue(sortTags(remoteEntry.tag),sortTags(baseEntry.tag))
);
return remoteGroupChanged?remote:local;
}

if(local.code&&!remote.code)return local;
if(remote.code&&!local.code)return remote;

if(!local.code&&!remote.code){
return {
code:'',
codeAutoManaged:false,
codeAutoPending:Boolean(local.codeAutoPending||remote.codeAutoPending),
codeManualEdited:false,
codeManualPinned:false
};
}

if(local.code===remote.code){
return {
code:local.code,
codeAutoManaged:Boolean(
(local.codeAutoManaged||remote.codeAutoManaged) &&
!local.codeManualEdited &&
!remote.codeManualEdited
),
codeAutoPending:false,
codeManualEdited:Boolean(local.codeManualEdited||remote.codeManualEdited),
codeManualPinned:Boolean(local.codeManualPinned||remote.codeManualPinned)
};
}

if(local.code&&!local.codeAutoManaged&&remote.codeAutoManaged)return local;
if(remote.code&&!remote.codeAutoManaged&&local.codeAutoManaged)return remote;

stats.codeConflicts++;

stats.codeConflictItems.push({
id:localEntry?.id||remoteEntry?.id||baseEntry?.id||'',
bookName:localEntry?.bookName||remoteEntry?.bookName||baseEntry?.bookName||'未命名条目',
tag:[...(localEntry?.tag||remoteEntry?.tag||baseEntry?.tag||[])],
baseCode:clean(baseEntry?.code),
localCode:clean(localEntry?.code),
remoteCode:clean(remoteEntry?.code)
});

return local.code?local:remote;
}

function mergeEntryVersions(baseEntry,localEntry,remoteEntry,stats){
if(!baseEntry){
if(!localEntry)return remoteEntry||null;
if(!remoteEntry)return localEntry;
if(sameSyncValue(localEntry,remoteEntry))return localEntry;

const merged={id:localEntry.id||remoteEntry.id};

for(const field of ENTRY_SYNC_FIELDS){
if(CODE_SYNC_FIELDS.has(field))continue;

const localValue=localEntry[field];
const remoteValue=remoteEntry[field];

if(sameSyncValue(localValue,remoteValue)){
merged[field]=copySyncValue(localValue);
}else{
merged[field]=copySyncValue(localValue);
stats.conflicts++;
}
}

Object.assign(merged,mergeCodeBundle(null,localEntry,remoteEntry,stats));
return normEntry(merged);
}

if(!localEntry&&!remoteEntry)return null;

if(!localEntry){
if(sameSyncValue(remoteEntry,baseEntry))return null;
stats.conflicts++;
return remoteEntry;
}

if(!remoteEntry){
if(sameSyncValue(localEntry,baseEntry))return null;
stats.conflicts++;
return localEntry;
}

if(sameSyncValue(localEntry,remoteEntry))return localEntry;

const merged={id:localEntry.id};

for(const field of ENTRY_SYNC_FIELDS){
if(CODE_SYNC_FIELDS.has(field))continue;

const baseValue=baseEntry[field];
const localValue=localEntry[field];
const remoteValue=remoteEntry[field];

if(sameSyncValue(localValue,remoteValue)){
merged[field]=copySyncValue(localValue);
continue;
}

if(sameSyncValue(localValue,baseValue)){
merged[field]=copySyncValue(remoteValue);
continue;
}

if(sameSyncValue(remoteValue,baseValue)){
merged[field]=copySyncValue(localValue);
continue;
}

merged[field]=copySyncValue(localValue);
stats.conflicts++;
}

Object.assign(merged,mergeCodeBundle(baseEntry,localEntry,remoteEntry,stats));
return normEntry(merged);
}

function mergeOrderedHistory(baseValues,localValues,remoteValues,stats){
const base=uniq(baseValues||[]);
const local=uniq(localValues||[]);
const remote=uniq(remoteValues||[]);

if(sameSyncValue(local,base))return remote;
if(sameSyncValue(remote,base))return local;
if(sameSyncValue(local,remote))return local;

stats.collectionConflicts++;

const baseKeys=new Set(base.map(key));
const localMap=new Map(local.map(value=>[key(value),value]));
const remoteMap=new Map(remote.map(value=>[key(value),value]));
const ordered=uniq([...local,...remote]);

return ordered.filter(value=>{
const itemKey=key(value);

if(!baseKeys.has(itemKey)){
return localMap.has(itemKey)||remoteMap.has(itemKey);
}

return localMap.has(itemKey)&&remoteMap.has(itemKey);
});
}

function inspectCodeIssues(snapshot){
const fixed=norm(snapshot);
const codeEntries=new Map();
const invalidItems=[];

for(const entry of fixed.entries){
const preservedCode=clean(entry.code);
if(!preservedCode)continue;

const normalizedCode=normalizeStoredCode(preservedCode);
const duplicateKey=normalizedCode||folded(preservedCode);

if(!codeEntries.has(duplicateKey))codeEntries.set(duplicateKey,[]);
codeEntries.get(duplicateKey).push(entry);

if(
!normalizedCode ||
(
entry.codeManualEdited!==true &&
!codeAllowedForEntry(entry,normalizedCode)
)
){
const groups=codeGroupsFromEntry(entry);
const ranges=codeRangesForEntry(entry);

let reason='';

if(!normalizedCode){
reason='编码不是 6 位数字';
}else if(!groups?.length){
reason=entry.tag.length
? '当前编组不属于编码规则范围'
: '当前条目没有编组';
}else if(!ranges.length){
reason='当前编组没有可用编码区间';
}else{
reason=`当前编码不在对应区间 ${ranges.map(([start,end])=>`${start}-${end}`).join('、')} 内`;
}

invalidItems.push({
id:entry.id,
bookName:entry.bookName,
tag:[...entry.tag],
code:preservedCode,
reason
});
}
}

const duplicateItems=[];
let duplicates=0;

for(const [code,entries] of codeEntries.entries()){
if(entries.length>1){
duplicates+=entries.length-1;

duplicateItems.push({
code,
entries:entries.map(entry=>({
id:entry.id,
bookName:entry.bookName,
tag:[...entry.tag]
}))
});
}
}

return {
duplicates,
duplicateItems,
invalid:invalidItems.length,
invalidItems
};
}

)

function instantAutoCodeForEntry(entry,entries=state.entries){

}

function reconcileAutoCodesAfterPull(snapshot,remoteSnapshot,baseSnapshot=null){
const fixed=norm(snapshot);

let assigned=0;
let reassigned=0;
let pendingUnassigned=0;

const assignedItems=[];
const reassignedItems=[];
const repairIds=new Set();

const remoteMap=new Map(
norm(remoteSnapshot||{}).entries.map(entry=>[entry.id,entry])
);

const baseMap=new Map(
norm(baseSnapshot||{}).entries.map(entry=>[entry.id,entry])
);

const codeGroups=new Map();

for(const entry of fixed.entries){
const code=normalizeStoredCode(entry.code);
if(!code)continue;

if(!codeGroups.has(code))codeGroups.set(code,[]);
codeGroups.get(code).push(entry);
}

for(const entries of codeGroups.values()){
if(entries.length<=1)continue;

const ordered=[...entries].sort(stablePendingCodeCompare);

const manualEntries=ordered.filter(
entry=>entry.codeManualEdited===true||entry.codeManualPinned===true
);

const baseProtectedEntries=ordered.filter(
entry=>
normalizeStoredCode(baseMap.get(entry.id)?.code)===
normalizeStoredCode(entry.code)
);

const remoteProtectedEntries=ordered.filter(
entry=>
normalizeStoredCode(remoteMap.get(entry.id)?.code)===
normalizeStoredCode(entry.code)
);

const winner=
manualEntries[0] ||
baseProtectedEntries[0] ||
remoteProtectedEntries[0] ||
ordered[0];

for(const entry of ordered){
if(entry===winner)continue;

if(entry.codeManualEdited===true||entry.codeManualPinned===true){
continue;
}

entry.code='';
entry.codeAutoManaged=false;
entry.codeAutoPending=true;
entry.codeManualEdited=false;
entry.codeManualPinned=false;

repairIds.add(entry.id);
}
}

const used=new Set();

for(const entry of fixed.entries){
const code=normalizeStoredCode(entry.code);
if(code)used.add(Number(code));
}

const autoEntries=fixed.entries
.filter(
entry=>
!normalizeStoredCode(entry.code) &&
entry.codeAutoPending===true
)
.sort(stablePendingCodeCompare);

for(const entry of autoEntries){
const code=smallestAvailableCode(entry,used);

if(!code){
entry.code='';
entry.codeAutoManaged=false;
entry.codeAutoPending=true;
entry.codeManualEdited=false;
entry.codeManualPinned=false;
pendingUnassigned++;
continue;
}

entry.code=code;
entry.codeAutoManaged=true;
entry.codeAutoPending=false;
entry.codeManualEdited=false;
entry.codeManualPinned=false;

used.add(Number(code));

if(repairIds.has(entry.id)){
reassigned++;
reassignedItems.push({
id:entry.id,
bookName:entry.bookName,
code
});
}else{
assigned++;
assignedItems.push({
id:entry.id,
bookName:entry.bookName,
code
});
}
}

return {
state:norm(fixed),
assigned,
reassigned,
pendingUnassigned,
assignedItems,
reassignedItems
};
}

function auditCodeSafety(baseSnapshot,localSnapshot,remoteSnapshot,candidateSnapshot){
const baseMap=new Map(norm(baseSnapshot).entries.map(entry=>[entry.id,entry]));
const localMap=new Map(norm(localSnapshot).entries.map(entry=>[entry.id,entry]));
const remoteMap=new Map(norm(remoteSnapshot).entries.map(entry=>[entry.id,entry]));
const candidateMap=new Map(norm(candidateSnapshot).entries.map(entry=>[entry.id,entry]));

const ids=new Set([
...baseMap.keys(),
...localMap.keys(),
...remoteMap.keys()
]);

const items=[];

for(const id of ids){
const baseEntry=baseMap.get(id)||null;
const localEntry=localMap.get(id)||null;
const remoteEntry=remoteMap.get(id)||null;
const candidateEntry=candidateMap.get(id)||null;

if(!baseEntry)continue;

const baseCode=clean(baseEntry.code);
if(!baseCode)continue;

const baseBundle=codeBundle(baseEntry);

const localDeleted=!localEntry;
const remoteDeleted=!remoteEntry;

const localChanged=
localDeleted ||
!sameSyncValue(codeBundle(localEntry),baseBundle);

const remoteChanged=
remoteDeleted ||
!sameSyncValue(codeBundle(remoteEntry),baseBundle);

if(!candidateEntry&&(localDeleted||remoteDeleted)){
continue;
}

const candidateCode=clean(candidateEntry?.code);

if(localChanged||remoteChanged){
const matchesLocal=Boolean(
localEntry &&
candidateEntry &&
sameSyncValue(codeBundle(candidateEntry),codeBundle(localEntry))
);

const matchesRemote=Boolean(
remoteEntry &&
candidateEntry &&
sameSyncValue(codeBundle(candidateEntry),codeBundle(remoteEntry))
);

if(matchesLocal||matchesRemote)continue;

if(!candidateEntry&&(localDeleted||remoteDeleted))continue;

items.push({
id,
bookName:
candidateEntry?.bookName ||
localEntry?.bookName ||
remoteEntry?.bookName ||
baseEntry.bookName ||
'未命名条目',
tag:[...(candidateEntry?.tag||localEntry?.tag||remoteEntry?.tag||baseEntry.tag||[])],
baseCode,
localCode:clean(localEntry?.code),
remoteCode:clean(remoteEntry?.code),
candidateCode,
reason:'本机或云端已经明确修改编码，但合并结果既不等于本机结果，也不等于云端结果'
});

continue;
}

if(candidateCode!==baseCode){
items.push({
id,
bookName:candidateEntry?.bookName||baseEntry.bookName||'未命名条目',
tag:[...(candidateEntry?.tag||baseEntry.tag||[])],
baseCode,
localCode:clean(localEntry?.code),
remoteCode:clean(remoteEntry?.code),
candidateCode,
reason:'本机和云端都没有主动修改该编码，但合并结果改变了已有编码'
});
}
}

return {
ok:items.length===0,
violations:items.length,
items
};
}

)

function duplicateCodeCount(snapshot){

for(const entry of norm(snapshot).entries){
const preservedCode=clean(entry.code);
if(!preservedCode)continue;

const duplicateKey=normalizedCode||folded(preservedCode);

counts.set(
duplicateKey,
(counts.get(duplicateKey)||0)+1
);
}

let duplicates=0;

for(const count of counts.values()){
if(count>1)duplicates+=count-1;
}

return duplicates;
}

function mergeStates(baseValue,localValue,remoteValue){
const base=norm(baseValue||{});
const local=norm(localValue||{});
const remote=norm(remoteValue||{});

const stats={
conflicts:0,
collectionConflicts:0,
codeConflicts:0,
codeConflictItems:[]
};

const baseMap=new Map(base.entries.map(entry=>[entry.id,entry]));
const localMap=new Map(local.entries.map(entry=>[entry.id,entry]));
const remoteMap=new Map(remote.entries.map(entry=>[entry.id,entry]));

const ids=new Set([
...baseMap.keys(),
...localMap.keys(),
...remoteMap.keys()
]);

const entries=[];

for(const id of ids){
const entry=mergeEntryVersions(
baseMap.get(id),
localMap.get(id),
remoteMap.get(id),
stats
);

if(entry)entries.push(entry);
}

let institutions=mergeOrderedHistory(
base.institutions,
local.institutions,
remote.institutions,
stats
);

let categories=mergeOrderedHistory(
base.categories,
local.categories,
remote.categories,
stats
);

institutions=uniq([
...institutions,
...entries.map(entry=>entry.institution).filter(Boolean)
]);

categories=uniq([
...categories,
...entries.flatMap(entry=>entry.category)
]);

const merged=norm({
schemaVersion:9,
entries,
institutions,
categories,
tags:[...GROUP_OPTIONS]
});

const issues=inspectCodeIssues(merged);

return {
state:merged,
conflicts:stats.conflicts,
collectionConflicts:stats.collectionConflicts,
codeConflicts:stats.codeConflicts,
codeConflictItems:[...stats.codeConflictItems],
codeRepairs:0,
unresolvedCodeConflicts:issues.duplicates,
duplicateCodeItems:issues.duplicateItems,
invalidCodeCount:issues.invalid,
invalidCodeItems:issues.invalidItems
};
}

function fallbackGet(storageKey){
if(storageMemory.has(storageKey))return storageMemory.get(storageKey);

try{
const raw=localStorage.getItem(fallbackStorageKey(storageKey));

if(raw!==null){
const value=JSON.parse(raw);
storageMemory.set(storageKey,value);
return value;
}
}catch{}

return null;
}

}

function openStorageDb(){
if(storageDbDisabled||typeof indexedDB==='undefined'){
return Promise.reject(new Error('IndexedDB unavailable'));
}

if(storageDbPromise)return storageDbPromise;

storageDbPromise=new Promise((resolve,reject)=>{
let request;
let settled=false;

const finishResolve=db=>{
if(settled){
try{db?.close()}catch{}
return;
}

settled=true;
clearTimeout(openTimer);
resolve(db);
};

const finishReject=error=>{
if(settled)return;
settled=true;
clearTimeout(openTimer);
reject(error);
};

const openTimer=setTimeout(()=>{
finishReject(new Error('IndexedDB open timeout'));
},STORAGE_OPEN_TIMEOUT);

try{
request=indexedDB.open(DB_NAME,1);
}catch(error){
finishReject(error);
return;
}

request.onupgradeneeded=()=>{
const db=request.result;

if(!db.objectStoreNames.contains(DB_STORE)){
db.createObjectStore(DB_STORE);
}
};

request.onsuccess=()=>{
const db=request.result;

if(db){
db.onversionchange=()=>{
try{db.close()}catch{}
};
}

finishResolve(db);
};

request.onerror=()=>{
finishReject(
request.error ||
new Error('IndexedDB open failed')
);
};

request.onblocked=()=>{
finishReject(new Error('IndexedDB blocked'));
};
});

storageDbPromise.catch(()=>{
storageDbDisabled=true;
storageDbPromise=null;
});

return storageDbPromise;
}

async function idbGet(storageKey){
if(storageDbDisabled)return fallbackGet(storageKey);

try{
const db=await openStorageDb();

return await new Promise((resolve,reject)=>{
const tx=db.transaction(DB_STORE,'readonly');

const request=
tx.objectStore(DB_STORE).get(storageKey);

request.onsuccess=()=>{
resolve(
request.result ??
fallbackGet(storageKey)
);
};

request.onerror=()=>{
reject(request.error);
};
});

}catch{
storageDbDisabled=true;
storageDbPromise=null;
return fallbackGet(storageKey);
}
}

async function idbSet(storageKey,value){
if(storageDbDisabled)return fallbackSet(storageKey,value);

try{
const db=await openStorageDb();

await new Promise((resolve,reject)=>{
const tx=db.transaction(DB_STORE,'readwrite');

tx.objectStore(DB_STORE).put(value,storageKey);

tx.oncomplete=()=>{
resolve(true);
};

tx.onerror=()=>{
reject(tx.error);
};

tx.onabort=()=>{
reject(
tx.error ||
new Error('IndexedDB transaction aborted')
);
};
});

storageMemory.set(storageKey,value);
fallbackSet(storageKey,value);

return true;

}catch{
storageDbDisabled=true;
storageDbPromise=null;
return fallbackSet(storageKey,value);
}
}

async function idbDelete(storageKey){
if(storageDbDisabled){
fallbackDelete(storageKey);
return;
}

try{
const db=await openStorageDb();

await new Promise((resolve,reject)=>{
const tx=db.transaction(DB_STORE,'readwrite');

tx.objectStore(DB_STORE).delete(storageKey);

tx.oncomplete=resolve;

tx.onerror=()=>{
reject(tx.error);
};

tx.onabort=()=>{
reject(
tx.error ||
new Error('IndexedDB transaction aborted')
);
};
});

storageMemory.delete(storageKey);
fallbackDelete(storageKey);

}catch{
storageDbDisabled=true;
storageDbPromise=null;
fallbackDelete(storageKey);
}
}

addSelections[type]=type==='tag'?sortTags(next):next;

function setEditDialogHeight(){

if(!dialog)return;

dialog.style.height='auto';
dialog.style.maxHeight='none';

const naturalHeight=dialog.getBoundingClientRect().height;

const viewportHeight=Math.max(
0,
Math.floor(
window.visualViewport?.height ||
window.innerHeight ||
document.documentElement.clientHeight ||
0
)
);

const edgeGap=
window.matchMedia('(max-width:700px)').matches
? 16
: 24;

async function saveEdit(){
const entry=state.entries.find(item=>item.id===editingId);
if(!entry)return;

const bookName=cleanTitle(editBookName.value);

if(!bookName){
show('书名不能为空','error');
editBookName.focus();
return;
}

const previousCode=clean(entry.code);
const previousTag=sortTags(entry.tag);
const manualAlreadyUsed=Boolean(entry.codeManualEdited);

commitInstitution('edit');

const nextTag=sortTags(editSelections.tag);
const tagChanged=!sameSyncValue(previousTag,nextTag);
const typedCode=clean(editCode.value);

const manualChangeRequested=
!editAutoManagedDraft &&
typedCode!==previousCode;

const clearCodeRequested=
manualChangeRequested &&
!typedCode;

let manualCode='';

if(
!manualAlreadyUsed &&
manualChangeRequested &&
!clearCodeRequested
){
manualCode=normalizeStoredCode(typedCode);

if(!manualCode){
show('编码必须是6位数字','error');
editCode.focus();
return;
}

const occupied=state.entries.some(
other=>
other.id!==entry.id &&
normalizeStoredCode(other.code)===manualCode
);

if(occupied){
show(`编码 ${manualCode} 已被其它条目使用`,'error');
editCode.focus();
return;
}
}

entry.bookName=bookName;
entry.bookNo=clean(editBookNo.value);
entry.institution=clean(editInstitution.value);
entry.category=[...editSelections.category];
entry.tag=nextTag;

const shouldSyncAutoCode=tagChanged;

if(manualChangeRequested&&clearCodeRequested){
entry.code='';
entry.codeAutoManaged=false;
entry.codeAutoPending=false;
entry.codeManualEdited=false;
entry.codeManualPinned=false;

}else if(manualChangeRequested){
entry.code=manualCode;
entry.codeAutoManaged=false;
entry.codeAutoPending=false;
entry.codeManualEdited=true;
entry.codeManualPinned=true;

}else if(shouldSyncAutoCode){
entry.code='';
entry.codeAutoManaged=false;
entry.codeAutoPending=Boolean(nextTag.length);
entry.codeManualEdited=false;
entry.codeManualPinned=false;
}

editModal.classList.add('hidden');

editingId='';
editInitialSnapshot='';
editOverlayPointerDown=false;
editAutoManagedDraft=false;
editGroupChangedDraft=false;

editSelections={category:[],tag:[]};

render();
schedule(false);

const ok=await requestDebouncedSync();

if(shouldSyncAutoCode&&ok){
const finalEntry=state.entries.find(item=>item.id===entry.id);

if(
!normalizeStoredCode(finalEntry?.code) &&
nextTag.length
){
show(
'编组已保存，但当前编码区间暂时没有可用编码；系统会继续保留待分配状态',
'error'
);
}
}
}

function getKeyboardOptions(container){
return [
...container.querySelectorAll(
'.combo-pill-select[data-select-value]'
)
];
}

function clearKeyboardActive(container){
getKeyboardOptions(container)
.forEach(button=>button.classList.remove('keyboard-active'));
}

function setKeyboardActive(container,index){
const options=getKeyboardOptions(container);
if(!options.length)return -1;

const normalized=
(index%options.length+options.length)%options.length;

options.forEach((button,optionIndex)=>{
button.classList.toggle(
'keyboard-active',
optionIndex===normalized
);
});

options[normalized].scrollIntoView({block:'nearest'});
return normalized;
}

function currentKeyboardIndex(container){
return getKeyboardOptions(container)
.findIndex(button=>button.classList.contains('keyboard-active'));
}

function setupMultiCombo(type,which){
const meta=multiMeta(type,which);

const combo=
type==='tag'
? (which==='edit'?editTagCombo:tagCombo)
: (which==='edit'?editCategoryCombo:categoryCombo);

function openPanel(){
const current=multiMeta(type,which);

if(current.selection.length&&!multiAllowsMultiple(type)){
closePanels();
return false;
}

closePanels();
meta.panel.classList.remove('hidden');
renderMultiOptions(type,which);
clearKeyboardActive(meta.options);

return true;
}

meta.input.addEventListener('click',event=>{
event.stopPropagation();
openPanel();
});

meta.input.addEventListener('input',()=>{
const current=multiMeta(type,which);

if(current.selection.length&&!multiAllowsMultiple(type)){
meta.input.value='';
meta.panel.classList.add('hidden');
return;
}

meta.panel.classList.remove('hidden');
renderMultiOptions(type,which);
clearKeyboardActive(meta.options);
});

meta.options.addEventListener('click',event=>{
event.stopPropagation();

const button=event.target.closest(
'.combo-pill-select[data-select-value]'
);

if(!button)return;

toggleSelection(
type,
which,
button.dataset.selectValue
);
});

meta.selectedBox.addEventListener('click',event=>{
event.stopPropagation();

const button=event.target.closest(
'.selected-pill-remove[data-remove-value]'
);

if(button){
removeSelection(
type,
which,
button.dataset.removeValue
);
return;
}

if(openPanel()){
meta.input.focus({preventScroll:true});
}
});

meta.input.addEventListener('keydown',event=>{
if(event.key==='Escape'){
clearKeyboardActive(meta.options);
meta.panel.classList.add('hidden');
return;
}

if(event.key==='ArrowDown'||event.key==='ArrowUp'){
event.preventDefault();
event.stopPropagation();

if(meta.panel.classList.contains('hidden')){
if(!openPanel())return;
}

const options=getKeyboardOptions(meta.options);
if(!options.length)return;

const current=currentKeyboardIndex(meta.options);

const next=
current<0
? (event.key==='ArrowDown'?0:options.length-1)
: current+(event.key==='ArrowDown'?1:-1);

setKeyboardActive(meta.options,next);
return;
}

if(event.key!=='Enter')return;

const options=getKeyboardOptions(meta.options);

if(meta.panel.classList.contains('hidden')){
if(!openPanel())return;
return;
}

const activeIndex=currentKeyboardIndex(meta.options);

if(activeIndex>=0){
event.preventDefault();

toggleSelection(
type,
which,
options[activeIndex].dataset.selectValue
);
return;
}

if(options.length===1){
event.preventDefault();

toggleSelection(
type,
which,
options[0].dataset.selectValue
);
}
});

combo.addEventListener('click',event=>{
event.stopPropagation();

if(
event.target.closest('.combo-panel') ||
event.target.closest('.selected-pill-remove') ||
event.target.closest('.combo-pill-select') ||
event.target===meta.input
){
return;
}

if(openPanel()){
meta.input.focus({preventScroll:true});
}
});
}

// 对短时间内连续操作集中同步；本机保存仍然立即执行。
function requestDebouncedSync(){
if(!admin()||!adminReady)return Promise.resolve(false);

return new Promise(resolve=>{
syncDebounceWaiters.push(resolve);
clearTimeout(syncDebounceTimer);
syncDebounceTimer=setTimeout(()=>{
syncDebounceTimer=null;
sync(false).catch(error=>{
console.error(error);
});
},SYNC_DEBOUNCE_MS);
});
}

function schedule(syncNow=true){
state=norm(state);
localMutationVersion++;
saveLocal(state);

meta.dirty=true;
lastSyncErrorCode='';

persistMeta().catch(console.error);

if(admin()&&adminReady){
if(syncRunning||syncInFlight){
syncRequested=true;
}else if(syncNow){
requestDebouncedSync();
}
}

return true;
}

function pathEncode(path){
return String(path)
.split('/')
.filter(Boolean)
.map(encodeURIComponent)
.join('/');
}

function toB64(value){
const bytes=new TextEncoder().encode(value);
let binary='';

for(let i=0;i<bytes.length;i+=0x8000){
binary+=String.fromCharCode(
...bytes.subarray(i,i+0x8000)
);
}

return btoa(binary);
}

function fromB64(value){
const binary=atob(
String(value||'').replace(/\s/g,'')
);

const bytes=new Uint8Array(binary.length);

for(let i=0;i<binary.length;i++){
bytes[i]=binary.charCodeAt(i);
}

return new TextDecoder().decode(bytes);
}

function delay(ms){

}

function isTransientSyncError(error){
if(error?.code==='payload_too_large')return false;
const statusCode=Number(error?.status||0);

return (
statusCode===0 ||
statusCode===408 ||
statusCode===429 ||
statusCode>=500
);
}

function isWriteConflictError(error){
const statusCode=Number(error?.status||0);

if(statusCode===409)return true;
if(statusCode!==422)return false;

const message=String(error?.message||'').toLocaleLowerCase();

return (
message.includes('sha') ||
message.includes('does not match') ||
message.includes('already exists') ||
message.includes('update')
);
}

function syncErrorText(error){
if(
error?.code==='code_conflict' ||
error?.code==='code_safety' ||
error?.code==='payload_too_large'
){
return error.message;
}

const statusCode=Number(error?.status||0);

if(statusCode===401){
return 'GitHub Token 无效或已失效；请在 Press 的“配置”中重新填写与 Pages 相同的有效 Token';
}

if(statusCode===403){
return `GitHub 拒绝访问：${error.message||'请确认 Token 具有仓库 Contents 读写权限'}`;
}

if(statusCode===404){
return `GitHub 仓库或数据文件不存在/不可访问：${error.message||'请检查仓库所有者、仓库名称和 press_data.json 路径'}`;
}

if(statusCode===409||statusCode===422){
return `GitHub 写入冲突：${error.message||`HTTP ${statusCode}`}`;
}

if(statusCode===0){
return `GitHub 网络请求失败：${error?.message||'Failed to fetch'}；Press 已改为与 Pages 相同的 GitHub fetch 请求方式`;
}

if(error?.message)return error.message;

return '未知同步错误';
}

function requestTimeoutError(message='请求超时'){
const error=new Error(message);
error.code='timeout';
error.status=0;
return error;
}

async function fetchTextWithTimeout(
url,
options={},
timeoutMs=PUBLIC_FETCH_TIMEOUT
){
const controller=
typeof AbortController!=='undefined'
? new AbortController()
: null;

let timer=null;

const request=(async()=>{
try{
const response=await fetch(
url,
{
...options,
...(controller?{signal:controller.signal}:{})
}
);

const text=await response.text();

return {response,text};

}catch(error){
if(error?.name==='AbortError'){
throw requestTimeoutError();
}

if(
error &&
typeof error==='object' &&
!('status' in error)
){
error.status=0;
}

throw error;
}
})();

const timeout=new Promise((_,reject)=>{
timer=setTimeout(()=>{
try{controller?.abort()}catch{}
reject(requestTimeoutError());
},timeoutMs);
});

try{
return await Promise.race([request,timeout]);
}finally{
if(timer!==null)clearTimeout(timer);
}
}

async function githubApi(method,endpoint,body=null){
const url=
`https://api.github.com/repos/${config.owner}/${config.repo}/${endpoint}`;

const headers={
'Authorization':`token ${config.token}`,
'Accept':'application/vnd.github.v3+json',
'Content-Type':'application/json'
};

const controller=
typeof AbortController!=='undefined'
? new AbortController()
: null;

const options={
method,
headers,
...(controller?{signal:controller.signal}:{})
};

if(body!==null){
options.body=JSON.stringify(body);
}

let timer=null;
let response;

try{
if(controller){
timer=setTimeout(()=>{
try{controller.abort()}catch{}
},GITHUB_FETCH_TIMEOUT);
}

response=await fetch(url,options);

}catch(error){
const fixedError=
error?.name==='AbortError'
? requestTimeoutError('GitHub 请求超时')
: error;

if(fixedError&&typeof fixedError==='object'){
fixedError.status=Number(fixedError.status||0);
fixedError.githubUrl=url;
}

throw fixedError;

}finally{
if(timer!==null)clearTimeout(timer);
}

let data=null;

try{
data=await response.json();
}catch{
data=null;
}

if(!response.ok){
const error=new Error(
data?.message ||
`HTTP ${response.status}`
);

error.status=response.status;
error.apiData=data;
error.githubUrl=url;

throw error;
}

return data;
}

function parseRemoteContent(data){
if(!data||typeof data.content!=='string'){
throw new Error('GitHub 返回的数据文件内容无效');
}

const parsed=JSON.parse(fromB64(data.content));

return {
exists:true,
sha:data.sha,
state:norm(parsed)
};
}

async function readRemote(){
try{
const data=await githubApi(
'GET',
`contents/${pathEncode(config.file)}`
);

return parseRemoteContent(data);

}catch(error){
if(Number(error?.status)===404){
return {
exists:false,
sha:null,
state:norm({})
};
}

throw error;
}
}

async function readRemoteWithRetry(maxAttempts=2){
let lastError=null;

for(let attempt=0;attempt<maxAttempts;attempt++){
try{
return await readRemote();

}catch(error){
lastError=error;

if(
!isTransientSyncError(error) ||
attempt>=maxAttempts-1
){
throw error;
}

await delay(600*Math.pow(2,attempt));
}
}

throw (
lastError ||
new Error('读取服务器数据失败')
);
}

function resolveSyncBase(localSnapshot){
if(syncBaseCache)return norm(syncBaseCache);
return meta.dirty?norm({}):norm(localSnapshot);
}

async function writeRemote(snapshot,sha){
// 去除仅用于排版的空格与换行；任何书目字段均不删除。
const raw=JSON.stringify(norm(snapshot));
const bytes=new TextEncoder().encode(raw).length;

if(bytes>MAX_BYTES){
const error=new Error(
`数据 ${(bytes/1024).toFixed(1)} KiB，超过当前 ${(MAX_BYTES/1024).toFixed(0)} KiB 同步警戒线；本机修改已保留`
);
error.code='payload_too_large';
throw error;
}

const body={
message:`更新 Press 数据 - ${new Date().toLocaleString()}`,
content:toB64(raw)
};

if(sha)body.sha=sha;

const result=await githubApi(
'PUT',
`contents/${pathEncode(config.file)}`,
body
);

return result?.content?.sha||null;
}

async function verifyRemoteEquals(expectedState){
try{
const checked=await readRemoteWithRetry(1);

return {
matched:
stateSignature(checked.state)===
stateSignature(expectedState),
remote:checked
};

}catch{
return {
matched:false,
remote:null
};
}
}

async function syncOnce(showResult=true){
if(!admin())return false;

const dirtyAtStart=Boolean(meta.dirty);
const mutationAtStart=localMutationVersion;

syncRunning=true;
updateAdmin();

status('syncing','正在拉取服务器最新版');

try{
let lastError=null;

const fastLocalBefore=norm(state);
const fastBase=resolveSyncBase(fastLocalBefore);
const fastLocalIssues=inspectCodeIssues(fastLocalBefore);

const canUseFastPath=Boolean(
meta.dirty &&
meta.sha &&
syncBaseCache &&
syncBaseSha===meta.sha &&
fastLocalIssues.duplicates===0
);

if(canUseFastPath){
const fastMutationVersion=localMutationVersion;

const fastAllocation=reconcileAutoCodesAfterPull(
fastLocalBefore,
fastBase,
fastBase
);

const fastCandidate=fastAllocation.state;
const fastCandidateIssues=inspectCodeIssues(fastCandidate);

// 本机数据与基准完全相同则不做乐观 PUT，转为 GET 确认远端状态。
if(
fastCandidateIssues.duplicates===0 &&
stateSignature(fastCandidate)!==stateSignature(fastBase)
){
status('syncing','正在确认服务器编码');

try{
const fastSha=await writeRemote(
fastCandidate,
meta.sha
);

let finalLocalState=fastCandidate;
let dirtyAfterFast=false;

if(localMutationVersion!==fastMutationVersion){
const currentLocal=norm(state);

const afterFastMerge=mergeStates(
fastLocalBefore,
currentLocal,
fastCandidate
);

finalLocalState=afterFastMerge.state;

dirtyAfterFast=
stateSignature(finalLocalState)!==
stateSignature(fastCandidate);

if(dirtyAfterFast){
syncRequested=true;
}
}

state=norm(finalLocalState);
meta.dirty=dirtyAfterFast;
meta.sha=fastSha;

saveLocal(state);

const fastBaseWrite=persistSyncBase(
fastCandidate,
fastSha
);

const fastMetaWrite=persistMeta();

await Promise.allSettled([
workCopyWriteChain,
fastBaseWrite,
fastMetaWrite
]);

render();

status('online','公开阅读 · 管理已连接');

lastSyncTime.textContent=
`已同步 ${new Date().toLocaleString()}`;

showCodeAllocationToast(fastAllocation);

return true;

}catch(error){
lastError=error;

if(isWriteConflictError(error)){
lastSyncOutcome.hadConflict=true;

status(
'syncing',
'检测到多端并发，正在重新拉取并确认最终编码'
);

}else if(isTransientSyncError(error)){
const verification=
await verifyRemoteEquals(fastCandidate);

if(verification.matched){
const verifiedSha=verification.remote.sha;

let verifiedLocalState=fastCandidate;
let dirtyAfterVerification=false;

if(localMutationVersion!==fastMutationVersion){
const currentLocal=norm(state);

const afterVerificationMerge=mergeStates(
fastLocalBefore,
currentLocal,
fastCandidate
);

verifiedLocalState=afterVerificationMerge.state;

dirtyAfterVerification=
stateSignature(verifiedLocalState)!==
stateSignature(fastCandidate);

if(dirtyAfterVerification){
syncRequested=true;
}
}

state=norm(verifiedLocalState);
meta.dirty=dirtyAfterVerification;
meta.sha=verifiedSha;

saveLocal(state);

const verifiedBaseWrite=persistSyncBase(
fastCandidate,
verifiedSha
);

const verifiedMetaWrite=persistMeta();

await Promise.allSettled([
workCopyWriteChain,
verifiedBaseWrite,
verifiedMetaWrite
]);

render();

status('online','公开阅读 · 管理已连接');

lastSyncTime.textContent=
`已同步 ${new Date().toLocaleString()}`;

showCodeAllocationToast(fastAllocation);

return true;
}

}else{
throw error;
}
}
}
}

for(
let attempt=0;
attempt<SYNC_RETRY_LIMIT;
attempt++
){
let remote;

try{
remote=await readRemoteWithRetry();
}catch(error){
lastError=error;
throw error;
}

const cloudUpdateDetected=Boolean(
meta.sha &&
remote.sha &&
remote.sha!==meta.sha
);

const localBefore=norm(state);
const base=resolveSyncBase(localBefore);
const mutationVersionBeforeWrite=localMutationVersion;

const mergedResult=mergeStates(
base,
localBefore,
remote.state
);

const preAllocationState=mergedResult.state;

if(mergedResult.codeConflicts>0){
const error=new Error(
`检测到编码并发冲突；为保护编码，已停止本次写入：${formatCodeConflictItems(mergedResult.codeConflictItems)}`
);

error.code='code_conflict';
throw error;
}

const codeAudit=auditCodeSafety(
base,
localBefore,
remote.state,
preAllocationState
);

if(!codeAudit.ok){
const error=new Error(
`编码安全检查失败：${formatCodeSafetyItems(codeAudit.items)}`
);

error.code='code_safety';
throw error;
}

const allocationResult=reconcileAutoCodesAfterPull(
preAllocationState,
remote.state,
base
);

const mergedState=allocationResult.state;
const postAllocationIssues=inspectCodeIssues(mergedState);

if(postAllocationIssues.duplicates>0){
const error=new Error(
`仍存在无法自动处理的重复编码（通常为人工锁定编码冲突），已停止本次写入：${formatDuplicateCodeItems(postAllocationIssues.duplicateItems)}`
);

error.code='code_conflict';
throw error;
}

const baseSig=stateSignature(base);
const localSig=stateSignature(localBefore);
const remoteSig=stateSignature(remote.state);
const mergedSig=stateSignature(mergedState);

const localChanged=localSig!==baseSig;
const remoteChanged=remoteSig!==baseSig;
const pulledChanges=localSig!==mergedSig;

let wroteRemote=false;
let finalSha=remote.sha;

if(remoteSig!==mergedSig){
try{
finalSha=await writeRemote(
mergedState,
remote.sha
);

wroteRemote=true;

}catch(error){
lastError=error;

if(isWriteConflictError(error)){
lastSyncOutcome.hadConflict=true;

status(
'syncing',
'检测到多端并发，正在重新拉取并确认最终编码'
);

await delay(180+attempt*120);
continue;
}

if(isTransientSyncError(error)){
const verification=
await verifyRemoteEquals(mergedState);

if(verification.matched){
finalSha=verification.remote.sha;
wroteRemote=true;
}else{
throw error;
}

}else{
throw error;
}
}
}

let finalLocalState=mergedState;
let dirtyAfterSync=false;

let extraConflicts=0;
let extraCollectionConflicts=0;
let extraUnresolvedCodes=0;
let extraCodeConflicts=0;
let extraCodeConflictItems=[];
let extraInvalidCodes=0;

if(localMutationVersion!==mutationVersionBeforeWrite){
const currentLocal=norm(state);

const afterWriteMerge=mergeStates(
localBefore,
currentLocal,
mergedState
);

finalLocalState=afterWriteMerge.state;
extraConflicts=afterWriteMerge.conflicts;
extraCollectionConflicts=afterWriteMerge.collectionConflicts;
extraUnresolvedCodes=afterWriteMerge.unresolvedCodeConflicts;
extraCodeConflicts=afterWriteMerge.codeConflicts;
extraCodeConflictItems=[...afterWriteMerge.codeConflictItems];
extraInvalidCodes=afterWriteMerge.invalidCodeCount;

const afterWriteAudit=auditCodeSafety(
localBefore,
currentLocal,
mergedState,
afterWriteMerge.state
);

if(!afterWriteAudit.ok){
const error=new Error(
`编码安全检查失败：${formatCodeSafetyItems(afterWriteAudit.items)}`
);

error.code='code_safety';
throw error;
}

dirtyAfterSync=
stateSignature(finalLocalState)!==
mergedSig;

if(dirtyAfterSync){
syncRequested=true;
}
}

state=norm(finalLocalState);
meta.dirty=dirtyAfterSync;
meta.sha=finalSha;

saveLocal(state);

const baseWrite=persistSyncBase(
mergedState,
finalSha
);

const metaWrite=persistMeta();

await Promise.allSettled([
workCopyWriteChain,
baseWrite,
metaWrite
]);

render();

status('online','公开阅读 · 管理已连接');

lastSyncTime.textContent=
`已同步 ${new Date().toLocaleString()}`;

const conflictCount=
mergedResult.conflicts+
mergedResult.collectionConflicts+
extraConflicts+
extraCollectionConflicts;

const finalCodeIssues=inspectCodeIssues(state);

const duplicateCodeCountAfterSync=
finalCodeIssues.duplicates;

const invalidCodeCountAfterSync=
finalCodeIssues.invalid;

const codeConflictCount=
mergedResult.codeConflicts+
extraCodeConflicts;

const codeConflictItems=[
...mergedResult.codeConflictItems,
...extraCodeConflictItems
];

const pendingUnassignedCount=
allocationResult.pendingUnassigned;

if(
duplicateCodeCountAfterSync ||
invalidCodeCountAfterSync ||
codeConflictCount
){
status(
'online',
'公开阅读 · 管理已连接 · 编码需检查'
);
}

const codeToastShown=
showCodeAllocationToast(allocationResult);

if(showResult&&!codeToastShown){
if(codeConflictCount){
show(
`检测到编码并发冲突，请人工检查：${formatCodeConflictItems(codeConflictItems)}`,
'error'
);

}else if(duplicateCodeCountAfterSync){
show(
`同步完成；检测到重复编码：${formatDuplicateCodeItems(finalCodeIssues.duplicateItems)}`,
'error'
);

}else if(invalidCodeCountAfterSync){
show(
`同步完成；检测到编码与当前规则不一致：${finalCodeIssues.invalidItems.map(formatCodeIssueItem).join('；')}`,
'error'
);

}else if(pendingUnassignedCount){
show(
`同步完成；仍有 ${pendingUnassignedCount} 个新条目等待分配编码，已有编码未被改动`,
'error'
);

}else if(conflictCount){
show(
`双向同步完成；检测到 ${conflictCount} 处普通字段并发修改并已合并，编码未自动改写`,
'success'
);

}else if(wroteRemote&&localChanged&&remoteChanged){
show(
'已合并两台设备的修改并同步 GitHub；已有编码保持不变',
'success'
);

}else if(wroteRemote){
show(
'已同步到 GitHub；已有编码保持不变',
'success'
);

}else if(pulledChanges){
show(
'已获取另一设备的最新修改；已有编码保持不变',
'success'
);

}else{
show(
'本机与 GitHub 已是最新',
'success'
);
}
}

if(cloudUpdateDetected&&!codeToastShown){
show(
'检测到其他终端的云端更新，当前页面已自动刷新',
'success'
);
}

return true;
}

throw (
lastError ||
new Error('多次重试后仍无法完成同步')
);

}catch(error){
console.error(error);
lastSyncErrorCode=clean(error?.code);

meta.dirty=Boolean(
meta.dirty ||
dirtyAtStart ||
localMutationVersion!==mutationAtStart
);

saveLocal(state);

await Promise.allSettled([
workCopyWriteChain,
persistMeta()
]);

status(
'offline',
`同步失败 · ${syncErrorText(error)}`
);

if(showResult){
show(
`同步失败：${syncErrorText(error)}`,
'error'
);
}

return false;

}finally{
syncRunning=false;
updateAdmin();
}
}

function sync(showResult=true,queueIfBusy=true){
if(!admin())return Promise.resolve(false);

if(syncInFlight){
if(showResult)syncShowResult=true;
if(queueIfBusy)syncRequested=true;
return syncInFlight;
}

lastSyncOutcome={hadConflict:false};

syncRequested=true;

if(showResult){
syncShowResult=true;
}

// 手动或自动同步可以提前执行，同时唤醒已排队的防抖调用。
if(syncDebounceTimer!==null){
clearTimeout(syncDebounceTimer);
syncDebounceTimer=null;
}

syncInFlight=(async()=>{
let allOk=true;

while(syncRequested){
const announce=syncShowResult;

syncRequested=false;
syncShowResult=false;

const ok=await syncOnce(announce);

allOk=allOk&&ok;

if(!ok){
syncRequested=false;
break;
}
}

return allOk;
})()
.then(allOk=>{
if(allOk){
lastSyncErrorCode='';
clearPassiveSyncRetry();
}else if(meta.dirty && lastSyncErrorCode!=='payload_too_large'){
schedulePassiveSyncRetry();
}

return allOk;
})
.finally(()=>{
syncInFlight=null;
});

syncInFlight.then(ok=>{
const waiters=syncDebounceWaiters.splice(0);
waiters.forEach(resolve=>resolve(ok));
},error=>{
const waiters=syncDebounceWaiters.splice(0);
waiters.forEach(resolve=>resolve(false));
console.error(error);
});

return syncInFlight;
}

clearTimeout(syncDebounceTimer);
syncDebounceTimer=null;
const waiters=syncDebounceWaiters.splice(0);
waiters.forEach(resolve=>resolve(false));
}

if(syncInFlight){
await syncInFlight;
}

const hadPreviousTarget=Boolean(
config.owner &&
config.repo &&
config.file
);

owner:clean(cfgOwner.value),
repo:clean(cfg.value),
file:clean(cfgFile.value)||'press_data.json',

!nextConfig.token
){

hadPreviousTarget &&
previousTarget!==syncTargetId();

workCopyWriteChain,
metaWriteChain,
syncBaseWriteChain
]);

syncRequested=false;
syncShowResult=false;

meta={
dirty:false,

};

workCopyCache=null;
syncBaseCache=null;
syncBaseSha=null;
state=norm({});
localMutationVersion=0;

await Promise.all([
idbDelete(META_KEY),
idbDelete(WORKCOPY_KEY),

]);
}

await idbSet(
CONFIG_KEY,
{
owner:config.owner,

}
);

if(rememberToken.checked){
persistedToken=config.token;

await loadAdminState();
}

if(!value)return;

if(
state.institutions.some(
item=>key(item)===key(value)
)
){
show('出版选项已经存在','error');
return;
}

let line=Number(
folded(manageInstitutionLineInput.value)
);

if(!Number.isInteger(line)){
line=state.institutions.length+1;
}

line=Math.max(
1,
Math.min(
line,
state.institutions.length+1
)
);

state.institutions.splice(
line-1,
0,
value
);

manageInstitutionInput.value='';

render();
schedule();
}

function moveManagedInstitution(value,rawLine){
const history=[...state.institutions];

const from=history.findIndex(
item=>key(item)===key(value)
);

if(from<0)return;

let line=Number(folded(rawLine));

if(
!Number.isInteger(line) ||
line<1 ||
line>history.length
){
renderManageInstitutionOptions();
return;
}

const [item]=history.splice(from,1);

history.splice(
line-1,
0,
item
);

state.institutions=history;

render();
schedule();
}

function renameManagedInstitution(value){
const index=state.institutions.findIndex(
item=>key(item)===key(value)
);

if(index<0)return;

const next=prompt(
'修改出版选项：',
state.institutions[index]
);

if(next===null)return;

const cleaned=clean(next);
if(!cleaned)return;

const oldKey=key(value);

state.institutions[index]=cleaned;

for(const entry of state.entries){
if(key(entry.institution)===oldKey){
entry.institution=cleaned;
}
}

render();
schedule();
}

function deleteManagedInstitution(value){
if(!confirm(`确定从出版菜单删除“${value}”吗？`)){
return;
}

state.institutions=
state.institutions.filter(
item=>key(item)!==key(value)
);

render();
schedule();
}

function exportHtml(){
const source=
'<!DOCTYPE html>\n'+
document.documentElement.outerHTML;

const blob=new Blob(
[source],
{type:'text/html;charset=utf-8'}
);

const url=URL.createObjectURL(blob);
const link=document.createElement('a');

link.href=url;
link.download=
`press${Math.floor(Date.now()/1000)}.html`;

document.body.appendChild(link);
link.click();
link.remove();

setTimeout(()=>{
URL.revokeObjectURL(url);
},1000);
}

function clearPassiveSyncRetry(resetIndex=true){
if(passiveSyncRetryTimer!==null){
clearTimeout(passiveSyncRetryTimer);
passiveSyncRetryTimer=null;
}

if(resetIndex){
passiveSyncRetryIndex=0;
}
}

function schedulePassiveSyncRetry(resetIndex=false){
if(!admin()||!adminReady || lastSyncErrorCode==='payload_too_large')return;

if(resetIndex){
passiveSyncRetryIndex=0;
}

if(passiveSyncRetryTimer!==null)return;

const delayMs=
PASSIVE_SYNC_RETRY_DELAYS[
Math.min(
passiveSyncRetryIndex,
PASSIVE_SYNC_RETRY_DELAYS.length-1
)
];

passiveSyncRetryIndex=Math.min(
passiveSyncRetryIndex+1,
PASSIVE_SYNC_RETRY_DELAYS.length-1
);

passiveSyncRetryTimer=setTimeout(()=>{
passiveSyncRetryTimer=null;
passiveSync();
},delayMs);
}

async function passiveSync(){
if(!admin()||!adminReady)return false;

if(
document.hidden ||
!editModal.classList.contains('hidden') ||
!configModal.classList.contains('hidden') ||
!manageModal.classList.contains('hidden')
){
return false;
}

if(syncRunning||Boolean(syncInFlight)){
if(meta.dirty){
schedulePassiveSyncRetry();
}
return false;
}

const now=Date.now();

if(now-lastPassiveSyncAt<1000){
if(meta.dirty){
schedulePassiveSyncRetry();
}
return false;
}

lastPassiveSyncAt=now;

const ok=await sync(
false,
false
);

if(ok){
clearPassiveSyncRetry();
}else if(meta.dirty){
schedulePassiveSyncRetry();
}

return ok;
}

function wakePassiveSync(){
if(!admin()||!adminReady || lastSyncErrorCode==='payload_too_large')return;

clearPassiveSyncRetry();

passiveSyncRetryTimer=setTimeout(()=>{
passiveSyncRetryTimer=null;
passiveSync();
},700);
}
