e-fixed-top{padding:1.2rem 1.2rem .8rem}.manage-table-scroll{padding:.55rem 1.2rem .8rem}.manage-add-row{grid-template-columns:minmax(0,1fr) 78px}.manage-add-row .btn{grid-column:1/-1}.manage-line-head{grid-template-columns:minmax(0,1fr) 72px 30px 30px}.manage-option-row{grid-template-columns:minmax(0,1fr) 72px 30px 30px}.manage-option-label{font-size:.88rem}}

/* 添加时标签 / 书架严格单选；编辑时书架仍严格单选。
   编辑标签例外：允许保留原标签并继续增加或删除多个标签。 */
#tagCombo:has(> .combo-selected:not(:empty)) > .combo-row,
#categoryCombo:has(> .combo-selected:not(:empty)) > .combo-row,
#editCategoryCombo:has(> .combo-selected:not(:empty)) > .combo-row{
    display:none!important;
}

#categoryCombo:has(> .combo-selected:not(:empty)),
#editCategoryCombo:has(> .combo-selected:not(:empty)){
    display:block!important;
}

<style id="mobile-config-hard-fix">

  #configModal{
    top:var(--press-vv-top,0px)!important;
    right:0!important;
    bottom:auto!important;
    left:0!important;
    width:100%!important;
    height:min(var(--press-vv-height,100dvh),100dvh)!important;
    padding:0!important;
    align-items:stretch!important;
    justify-content:stretch!important;
    overflow:hidden!important;
  }
  #configForm{
    position:absolute!important;
    inset:0!important;
    width:100%!important;
    height:100%!important;
    max-width:none!important;
    max-height:none!important;
    min-width:0!important;
    min-height:0!important;
    margin:0!important;
    border-radius:0!important;
    display:grid!important;
    grid-template-columns:minmax(0,1fr)!important;
    grid-template-rows:minmax(0,1fr) auto!important;
    overflow:hidden!important;
  }
  #configForm .dialog-scroll{
    grid-row:1!important;
    width:100%!important;
    min-width:0!important;
    min-height:0!important;
    overflow-y:scroll!important;
    overflow-x:hidden!important;
    -webkit-overflow-scrolling:touch!important;
    overscroll-behavior-y:contain!important;
    touch-action:pan-y!important;
    scrollbar-gutter:stable!important;
    scrollbar-width:auto;
    scrollbar-color:#94a3b8 #f1f5f9;
    padding:max(1.2rem,env(safe-area-inset-top)) 1.2rem 1.2rem!important;
  }
  #configForm .dialog-scroll::-webkit-scrollbar{width:8px}
  #configForm .dialog-scroll::-webkit-scrollbar-track{background:#f1f5f9}
  #configForm .dialog-scroll::-webkit-scrollbar-thumb{background:#94a3b8;border-radius:999px;border:2px solid #f1f5f9}
  #configForm .dialog-actions{
    grid-row:2!important;
    position:static!important;
    z-index:10!important;
    width:100%!important;
    min-width:0!important;
    flex:0 0 auto!important;
    padding:.85rem 1.2rem max(.85rem,env(safe-area-inset-bottom))!important;
    border-top:1px solid #dbe3ed!important;
    background:#fff!important;
    box-shadow:0 -8px 20px rgba(15,23,42,.10)!important;
  }
  #configForm .dialog-actions .btn{
    min-width:0!important;
    min-height:44px!important;
  }
}
</style>

<style id="edit-actions-layout-fix">

<style id="edit-selected-pill-size-fix">
/* 编辑弹窗：标签可多选，书架仍单选；已选项保持单行紧凑显示。
   编辑标签在左侧横向排列多个已选标签，右侧继续保留搜索输入框与倒三角。 */
#editTagCombo,
#editCategoryCombo{
    height:54px;
    min-height:54px;
    min-width:0;
}

#editTagCombo:has(> .combo-selected:not(:empty)),
#editCategoryCombo:has(> .combo-selected:not(:empty)){
    display:grid;
    grid-template-columns:minmax(0,42%) minmax(0,1fr);
    align-items:center;
    gap:5px;
    width:100%;
    min-width:0;
}

#editTagCombo > .combo-selected:not(:empty),
#editCategoryCombo > .combo-selected:not(:empty){
    grid-column:1;
    grid-row:1;
    display:flex;
    flex-wrap:nowrap;
    align-items:center;
    gap:3px;
    min-width:0;
    max-width:100%;
    height:24px;
    margin:0;
    overflow-x:auto;
    overflow-y:hidden;
    scrollbar-width:none;
}

#editTagCombo > .combo-selected:not(:empty)::-webkit-scrollbar,
#editCategoryCombo > .combo-selected:not(:empty)::-webkit-scrollbar{display:none}

#editTagCombo > .combo-selected:not(:empty) + .combo-row,
#editCategoryCombo > .combo-selected:not(:empty) + .combo-row{
    grid-column:2;
    grid-row:1;
    display:grid;
    grid-template-columns:minmax(0,1fr) 44px;
    gap:5px;
    width:100%;
    min-width:0;
}

#editTagCombo > .combo-selected:not(:empty) + .combo-row input,
#editCategoryCombo > .combo-selected:not(:empty) + .combo-row input{
    min-width:0;
    width:100%;
    min-height:38px;
}

#editTagCombo > .combo-selected:not(:empty) + .combo-row .combo-toggle,
#editCategoryCombo > .combo-selected:not(:empty) + .combo-row .combo-toggle{
    width:44px;
    min-width:44px;
    min-height:38px;
    grid-column:2;
    grid-row:1;
}

#editModal #editTagSelected .selected-pill,
#editModal #editCategorySelected .selected-pill{

function validCode(v){return /^(1\d{5}|2\d{5})$/.test(clean(v))}
function randomCode(usedSet){
    const used=usedSet||new Set(state.entries.map(x=>x.code));
    if(used.size>=200000)throw new Error('可用编码已用尽');
    if(crypto?.getRandomValues){
        const buf=new Uint32Array(1);
        for(let i=0;i<2000;i++){
            crypto.getRandomValues(buf);
            const code=String(100000+(buf[0]%200000));
            if(!used.has(code))return code
        }
    }
    const start=100000+Math.floor(Math.random()*200000);
    for(let i=0;i<200000;i++){
        const n=100000+((start-100000+i)%200000);
        const code=String(n);

    }

}

    const released=(state.releasedCodes||[]).find(code=>validCode(code)&&!used.has(code));
    return released||randomCode(used)
}

// 指定标签的自动编码区间。新增条目未手动填写编码时，以及编辑时清空编码或删除/替换原有标签触发系统自动重编码时使用。
// 每个标签可以对应一个或多个区间；始终按区间与编码数值从小到大寻找第一个未使用编码。
// 手动填写编码不受这些自动编码区间限制。
const AUTO_CODE_RULES=[
    {tag:'11图书',ranges:[[110001,119999],[150001,169999],[190001,199999]]},
    {tag:'13图书',ranges:[[130001,139999],[170001,179999]]},
    {tag:'14图书',ranges:[[140001,149999],[180001,189999]]},
    {tag:'21读书',ranges:[[210001,219999],[250001,269999],[290001,299999]]},
    {tag:'23读书',ranges:[[230001,239999],[270001,279999]]},
    {tag:'24读书',ranges:[[240001,249999],[280001,289999]]}
];
function autoCodeRuleForTags(tags){
    const selectedKeys=new Set(normalizeMulti(tags).map(key));

}
function nextCodeInRange(rule,usedSet){
    const used=usedSet||new Set(state.entries.map(x=>clean(x.code)).filter(Boolean));
    const ranges=[...(rule.ranges||[])].sort((a,b)=>a[0]-b[0]);
    for(const range of ranges){
        const start=Number(range[0]),end=Number(range[1]);
        for(let n=start;n<=end;n++){
            const code=String(n);
            if(!used.has(code))return code
        }
    }
    const rangeText=ranges.map(([start,end])=>`[${start},${end}]`).join('、');

}
function normEntry(x,usedCodes){
    if(!x||typeof x!=='object')return null;
    const bookName=cleanTitle(x.bookName);if(!bookName)return null;
    const bookNo=clean(x.bookNo),institution=clean(x.institution);
    const category=normalizeMulti(x.category),tag=normalizeMulti(x.tag);
    let code=clean(x.code);

    // 手工填写的编码允许原样保存，不受自动编码格式限制。
    // 只有编码为空，或导入/旧数据中出现重复编码时，才自动生成一个唯一编码。
    if(!code||usedCodes.has(code))code=randomCode(usedCodes);

    usedCodes.add(code);

function norm(v){
    const s=Array.isArray(v)?{entries:v}:(v&&typeof v==='object'?v:{});
    const usedCodes=new Set();
    const entries=(Array.isArray(s.entries)?s.entries:[]).map(x=>normEntry(x,usedCodes)).filter(Boolean);
    // releasedCodes 只保存当前未被任何条目占用的合法编码，并保留释放先后顺序。
    const releasedCodes=uniq(Array.isArray(s.releasedCodes)?s.releasedCodes:[])
        .filter(code=>validCode(code)&&!usedCodes.has(code));

    // 出版、书架使用历史数组自身的顺序，供人工调整。
    // 旧数据没有对应历史字段时，仅首次按现有条目出现顺序建立历史。
    const institutions=uniq(
        Array.isArray(s.institutions)?s.institutions:entries.map(x=>x.institution).filter(Boolean)
    );
    const categories=uniq(
        Array.isArray(s.categories)?s.categories:entries.flatMap(x=>x.category)
    );

    // 标签不能人工排序，始终按首字母/首数字的自然顺序排列。
    const tags=sortAuto(
        Array.isArray(s.tags)?s.tags:entries.flatMap(x=>x.tag)
    );

    // 总表：先按“出版”下拉菜单顺序；出版相同再按书号排序。
    // 已从出版历史中删除、但仍被旧条目使用的出版放在已配置出版之后。
    const institutionOrder=new Map(institutions.map((v,i)=>[key(v),i]));
    entries.sort((a,b)=>{
        const ai=institutionOrder.has(key(a.institution))?institutionOrder.get(key(a.institution)):Number.MAX_SAFE_INTEGER;
        const bi=institutionOrder.has(key(b.institution))?institutionOrder.get(key(b.institution)):Number.MAX_SAFE_INTEGER;
        if(ai!==bi)return ai-bi;
        if(ai===Number.MAX_SAFE_INTEGER){
            const byInstitution=collator.compare(a.institution,b.institution);
            if(byInstitution!==0)return byInstitution
        }
        if(a.bookNo&&!b.bookNo)return-1;
        if(!a.bookNo&&b.bookNo)return 1;
        const byNo=collator.compare(a.bookNo,b.bookNo);
        if(byNo!==0)return byNo;
        const byName=collator.compare(a.bookName,b.bookName);
        if(byName!==0)return byName;
        return a.code.localeCompare(b.code)
    });
    return{schemaVersion:3,entries,institutions,categories,tags,releasedCodes}
}

function setupManualDrag(optionsEl,type){
    let drag=null,autoScrollFrame=0;
    function clearMarks(){
        optionsEl.querySelectorAll('.drag-before,.drag-after').forEach(el=>el.classList.remove('drag-before','drag-after'))
    }
    function scrollContainer(){
        // 下拉菜单在自身面板内滚动；“出版管理”则滚动整个弹窗内容区。
        return optionsEl.closest('.combo-panel')||optionsEl.closest('.dialog-scroll')
    }
    function updateDropTarget(clientX,clientY){
        if(!drag)return;
        clearMarks();
        const hit=document.elementFromPoint(clientX,clientY);
        const target=hit?.closest?.('.combo-pill[data-drag-value]');
        if(!target||!optionsEl.contains(target)||target===drag.row){
            drag.targetValue='';
            return
        }
        const rect=target.getBoundingClientRect();
        drag.after=clientY>=rect.top+rect.height/2;
        drag.targetValue=target.dataset.dragValue;
        target.classList.add(drag.after?'drag-after':'drag-before')
    }
    function autoScrollStep(){
        autoScrollFrame=0;
        if(!drag)return;
        const scroller=scrollContainer();
        if(scroller){
            const rect=scroller.getBoundingClientRect();
            const edge=Math.min(82,Math.max(46,rect.height*.18));
            let speed=0;
            if(drag.clientY<rect.top+edge){
                const strength=Math.min(1,Math.max(0,(rect.top+edge-drag.clientY)/edge));
                speed=-(4+24*strength)
            }else if(drag.clientY>rect.bottom-edge){
                const strength=Math.min(1,Math.max(0,(drag.clientY-(rect.bottom-edge))/edge));
                speed=4+24*strength
            }
            if(speed){
                const before=scroller.scrollTop;
                scroller.scrollTop+=speed;
                if(scroller.scrollTop!==before)updateDropTarget(drag.clientX,drag.clientY)
            }
        }
        autoScrollFrame=requestAnimationFrame(autoScrollStep)
    }
    function cleanup(){
        if(autoScrollFrame){cancelAnimationFrame(autoScrollFrame);autoScrollFrame=0}
        clearMarks();
        if(drag?.row)drag.row.classList.remove('dragging');
        document.body.classList.remove('reordering');
        drag=null
    }
    optionsEl.addEventListener('pointerdown',e=>{
        const handle=e.target.closest('.combo-drag[data-drag-value]');
        if(!handle||!optionsEl.contains(handle))return;
        const row=handle.closest('.combo-pill[data-drag-value]');
        if(!row)return;
        e.preventDefault();
        e.stopPropagation();
        drag={pointerId:e.pointerId,sourceValue:handle.dataset.dragValue,row,targetValue:'',after:false,handle,clientX:e.clientX,clientY:e.clientY};
        row.classList.add('dragging');
        document.body.classList.add('reordering');
        try{handle.setPointerCapture(e.pointerId)}catch(err){}
        autoScrollFrame=requestAnimationFrame(autoScrollStep)
    });
    optionsEl.addEventListener('pointermove',e=>{
        if(!drag||e.pointerId!==drag.pointerId)return;
        e.preventDefault();
        drag.clientX=e.clientX;
        drag.clientY=e.clientY;
        updateDropTarget(e.clientX,e.clientY)
    });
    function finish(e){
        if(!drag||e.pointerId!==drag.pointerId)return;
        e.preventDefault();
        const sourceValue=drag.sourceValue,targetValue=drag.targetValue,after=drag.after;
        try{drag.handle.releasePointerCapture(e.pointerId)}catch(err){}
        cleanup();
        if(targetValue)reorderHistoryOption(type,sourceValue,targetValue,after)
    }
    optionsEl.addEventListener('pointerup',finish);
    optionsEl.addEventListener('pointercancel',e=>{if(drag&&e.pointerId===drag.pointerId)cleanup()})
}

function commitTypedValue(type,which,notify=false){
    const meta=multiMeta(type,which),value=clean(meta.input.value);
    if(!value)return false;

    const current=which==='edit'?editSelections[type]:addSelections[type];

    // 除“编辑标签”外，已有选择时都不允许再写入第二个选项。
    if(current.length&&!multiAllowsMultiple(type,which)){
        meta.input.value='';

        renderMultiField(type,which);
        show(`请先删除当前${meta.label}，再输入新的${meta.label}`,'error');
        return false
    }

    const history=sortHistory(type,state[meta.historyKey]);
    const matched=history.find(v=>key(v)===key(value));
    if(which==='edit'&&!matched){
        // 编辑弹窗只能选择添加板块已经维护好的下拉菜单选项，不能在这里新增选项。
        meta.input.value='';

    const selectedValue=matched||value;
    if(which==='add')addHistoryOption(type,selectedValue,notify);

        editSelections[type]=multiAllowsMultiple(type,which)?uniq([...current,selectedValue]):[selectedValue]

function saveEdit(){
    const x=state.entries.find(e=>e.id===editingId);if(!x)return;
    const bookName=cleanTitle(editBookName.value);
    if(!bookName){show('书名不能为空','error');editBookName.focus();return}
    commitInstitution('edit');
    commitTypedValue('category','edit');
    commitTypedValue('tag','edit');
    x.bookName=bookName;
    x.bookNo=clean(editBookNo.value);
    x.institution=clean(editInstitution.value);
    const oldTag=[...(x.tag||[])];
    x.category=[...editSelections.category];
    x.tag=[...editSelections.tag];

    const oldCode=clean(x.code);
    const requestedCode=clean(editCode.value);
    const codeChanged=requestedCode!==oldCode;
    const newTagKeys=new Set(x.tag.map(key));
    // 只有原有标签被删除/替换时才需要系统重编；仅新增标签不改变编码。
    const originalTagRemoved=oldTag.some(v=>!newTagKeys.has(key(v)));
    const usedCodes=new Set(state.entries.filter(e=>e.id!==x.id).map(e=>clean(e.code)).filter(Boolean));

    // 点击编码右侧 ×（或把编码清空）表示放弃人工指定，交由系统自动重新分配。
    // 这属于系统自动改码，不占用、也不受“仅 1 次手动修改编码”限制。
    // 删除/替换原有标签同样触发系统自动重新分配。
    if((codeChanged&&!requestedCode)||originalTagRemoved){
        const usedForReassign=new Set(usedCodes);
        // 暂时把旧编码视为占用，确保系统确实分配一个不同的新编码。
        if(oldCode)usedForReassign.add(oldCode);
        const rule=autoCodeRuleForTags(x.tag);
        let newCode;
        try{
            newCode=rule?nextCodeInRange(rule,usedForReassign):nextCode(usedForReassign);
        }catch(e){
            show(e.message,'error');
            return
        }
        x.code=newCode;
        if(oldCode&&validCode(oldCode)){
            state.releasedCodes=uniq([...(state.releasedCodes||[]),oldCode]);
        }
        state.releasedCodes=(state.releasedCodes||[]).filter(v=>clean(v)!==x.code);
    }else if(codeChanged&&(Number(x.codeEditCount)||0)>=1){
        // 只有“直接输入另一个非空编码”才属于人工改码，并受一次机会限制。
        show('每个条目的编码只有1次手动修改机会；如需系统自动重编，请点击编码右侧 ×','error');
        editCode.value=oldCode;
        return
    }else if(requestedCode){
        if(usedCodes.has(requestedCode)){
            show(`编码“${requestedCode}”已存在，请修改代码后再提交`,'error');
            editCode.focus();
            editCode.select();
            return
        }
        if(requestedCode!==oldCode){
            x.codeEditCount=1;
            if(oldCode&&validCode(oldCode)){
                state.releasedCodes=uniq([...(state.releasedCodes||[]),oldCode]);
            }
        }
        x.code=requestedCode
    }
    if(oldCode!==x.code){
        state.releasedCodes=(state.releasedCodes||[]).filter(v=>clean(v)!==x.code)
    }
    editModal.classList.add('hidden');editingId='';editInitialSnapshot='';editSelections={category:[],tag:[]};
    render();schedule();show(`已保存，编码 ${x.code}`,'success')
}
function deleteEntry(id){

        if(!localEntry&&!remoteEntry)return{entry:null,conflicts:0};
        if(entryEqual(localEntry,remoteEntry))return{entry:entryShape(localEntry),conflicts:0};
        // UUID 撞车极罕见；若真的发生，仍以当前平台内容为准并记为冲突。
        return{entry:entryShape(localEntry),conflicts:1}
    }
    if(!localEntry&&!remoteEntry)return{entry:null,conflicts:0};
    if(!localEntry&&remoteEntry){
        // 本地删除、远端未改：删除生效；远端已修改：保留远端修改，避免丢内容。
        return entryEqual(remoteEntry,baseEntry)?{entry:null,conflicts:0}:{entry:entryShape(remoteEntry),conflicts:1}
    }
    if(localEntry&&!remoteEntry){
        // 远端删除、本地未改：删除生效；本地已修改：保留本地修改，避免丢内容。
        return entryEqual(localEntry,baseEntry)?{entry:null,conflicts:0}:{entry:entryShape(localEntry),conflicts:1}
    }
    if(entryEqual(localEntry,remoteEntry))return{entry:entryShape(localEntry),conflicts:0};
    if(entryEqual(localEntry,baseEntry))return{entry:entryShape(remoteEntry),conflicts:0};
    if(entryEqual(remoteEntry,baseEntry))return{entry:entryShape(localEntry),conflicts:0};

    const b=entryShape(baseEntry),l=entryShape(localEntry),r=entryShape(remoteEntry);
    const merged={id:l.id||r.id||b.id};
    let conflicts=0;
    for(const field of ['bookName','bookNo','institution','category','tag','code','codeEditCount']){
        const part=mergeScalar(b[field],l[field],r[field]);
        merged[field]=part.value;
        if(part.conflict)conflicts++
    }
    return{entry:merged,conflicts}
}
function listKeys(values){return new Set((values||[]).map(key))}
function mergeHistory(baseValues,localValues,remoteValues,autoSort=false){
    const b=uniq(baseValues||[]),l=uniq(localValues||[]),r=uniq(remoteValues||[]);
    if(jsonEqual(l,r))return autoSort?sortAuto(l):l;
    if(jsonEqual(l,b))return autoSort?sortAuto(r):r;
    if(jsonEqual(r,b))return autoSort?sortAuto(l):l;

    const bs=listKeys(b),ls=listKeys(l),rs=listKeys(r);
    const include=new Set();
    // 共同基线中的旧项：任意一端明确删除，就视为删除；新增项：任意一端新增都保留。
    for(const v of b){const k=key(v);if(ls.has(k)&&rs.has(k))include.add(k)}
    for(const v of l){const k=key(v);if(!bs.has(k))include.add(k)}
    for(const v of r){const k=key(v);if(!bs.has(k))include.add(k)}

    const result=[];
    const seen=new Set();
    // 两边同时调整顺序时，以 GitHub 当前顺序为骨架，再补入仅本机新增的项，避免覆盖远端排序。
    for(const source of [r,l]){
        for(const v of source){
            const k=key(v);
            if(include.has(k)&&!seen.has(k)){seen.add(k);result.push(v)}
        }
    }
    return autoSort?sortAuto(result):result
}
function resolveBaseState(localSnapshot,remoteSnapshot){
    if(meta.baseState&&typeof meta.baseState==='object'){
        try{
            const b=norm(meta.baseState);
            if(!meta.fingerprint||fingerprint(b)===meta.fingerprint)return b
        }catch(e){}
    }
    // 兼容升级前旧版本只记录 fingerprint 的情况。
    if(typeof meta.fingerprint==='string'){
        if(fingerprint(localSnapshot)===meta.fingerprint)return norm(localSnapshot);
        if(fingerprint(remoteSnapshot)===meta.fingerprint)return norm(remoteSnapshot)
    }
    return null
}
function repairMergedCodes(entries,remoteEntries){
    const remoteIds=new Set((remoteEntries||[]).map(x=>clean(x.id)));
    const byId=new Map(entries.map(x=>[clean(x.id),x]));
    const ordered=[];
    for(const x of remoteEntries||[]){const hit=byId.get(clean(x.id));if(hit)ordered.push(hit)}
    for(const x of entries){if(!remoteIds.has(clean(x.id)))ordered.push(x)}

    const used=new Set();
    let reassigned=0;
    for(const x of ordered){
        let code=clean(x.code);
        if(code&&!used.has(code)){used.add(code);continue}
        const rule=autoCodeRuleForTags(x.tag);
        code=rule?nextCodeInRange(rule,used):randomCode(used);
        x.code=code;used.add(code);reassigned++
    }
    return reassigned
}
function mergeStates(baseState,localState,remoteState){
    const local=norm(localState),remote=norm(remoteState),base=baseState?norm(baseState):null;
    const bm=new Map((base?.entries||[]).map(x=>[clean(x.id),x]));
    const lm=new Map(local.entries.map(x=>[clean(x.id),x]));
    const rm=new Map(remote.entries.map(x=>[clean(x.id),x]));
    const ids=[];const seen=new Set();
    // 以远端当前顺序为主，随后补入本机独有条目。
    for(const source of [remote.entries,local.entries,base?.entries||[]]){
        for(const x of source){const id=clean(x.id);if(id&&!seen.has(id)){seen.add(id);ids.push(id)}}
    }
    const entries=[];let conflicts=0;
    for(const id of ids){
        const part=mergeEntry(bm.get(id)||null,lm.get(id)||null,rm.get(id)||null);
        if(part.entry)entries.push(part.entry);
        conflicts+=part.conflicts
    }

    const mergedRaw={
        entries,
        institutions:mergeHistory(base?.institutions||[],local.institutions,remote.institutions,false),
        categories:mergeHistory(base?.categories||[],local.categories,remote.categories,false),
        tags:mergeHistory(base?.tags||[],local.tags,remote.tags,true),
        releasedCodes:uniq([...(local.releasedCodes||[]),...(remote.releasedCodes||[])])
    };
    const reassigned=repairMergedCodes(mergedRaw.entries,remote.entries);
    return{state:norm(mergedRaw),conflicts,reassigned}
}
function retryableSyncError(e){return e&&(e.status===409||e.status===422)}
async function sync(showResult=true){
    if(!admin()){show('请先配置 Token','error');return false}
    if(syncing)return false;
    clearTimeout(autoTimer);autoTimer=null;syncing=true;syncBtn.disabled=true;status('syncing','同步中…');

    // 固定本次操作意图。重试期间即使 GitHub 又变化，也始终拿这份本机改动与最新远端重新合并。
    const localIntent=norm(state);
    let lastError=null;
    try{
        ensureTarget();
        for(let attempt=0;attempt<SYNC_RETRY_LIMIT;attempt++){
            // 强制刷新：每一次写入尝试前都重新读取 GitHub 最新 SHA 与完整数据。
            const remote=await readRemote();
            const remoteState=remote.exists?remote.state:{entries:[],institutions:[],categories:[],tags:[],releasedCodes:[]};
            const baseState=resolveBaseState(localIntent,remoteState);
            const mergedInfo=mergeStates(baseState,localIntent,remoteState);
            const merged=mergedInfo.state;

            if(remote.exists&&fingerprint(merged)===fingerprint(remoteState)){
                state=merged;render();record(state,remote.sha);status('online','公开阅读 · 管理已连接');
                if(showResult)show('已刷新并合并 GitHub 最新数据','success');
                return true
            }

            try{
                const sha=await writeRemote(merged,remote.exists?remote.sha:null);
                state=merged;render();record(state,sha);status('online','公开阅读 · 管理已连接');
                if(mergedInfo.reassigned>0){
                    show(`已自动合并；${mergedInfo.reassigned} 个重复编码已重新分配`,'success')
                }else if(showResult){
                    show(mergedInfo.conflicts>0?'已合并同步；同字段冲突以本机修改为准':'已强制刷新并合并同步','success')
                }
                return true
            }catch(e){
                lastError=e;
                if(retryableSyncError(e)&&attempt<SYNC_RETRY_LIMIT-1){
                    // 说明刚才读取 SHA 后，另一平台又抢先写入；立即重新读取最新版本再合并，不弹冲突框。
                    continue
                }
                throw e
            }
        }
        throw lastError||new Error('多次刷新后仍无法写入 GitHub')
    }catch(e){
        console.error(e);status('offline','管理同步失败');show(`同步失败：${e.message}`,'error');return false
    }finally{
        syncing=false;syncBtn.disabled=false
    }
}
function schedule(){saveLocal();if(!admin())return;clearTimeout(autoTimer);autoTimer=setTimeout(()=>{autoTimer=null;sync(false)},AUTO_DELAY)}

function setupInstitutionCombo(which){
    const meta=institutionMeta(which);
    let keyboardIndex=-1;

    function keyboardOptions(){
        return [...meta.options.querySelectorAll('.combo-pill-select[data-select-value]')]
    }
    function clearKeyboardActive(){
        keyboardIndex=-1;
        keyboardOptions().forEach(option=>{
            option.classList.remove('keyboard-active');
            option.removeAttribute('aria-selected')
        })
    }
    function setKeyboardActive(nextIndex){
        const options=keyboardOptions();
        if(!options.length){keyboardIndex=-1;return false}
        keyboardIndex=((nextIndex%options.length)+options.length)%options.length;
        options.forEach((option,index)=>{
            const active=index===keyboardIndex;
            option.classList.toggle('keyboard-active',active);
            if(active)option.setAttribute('aria-selected','true');
            else option.removeAttribute('aria-selected')
        });
        options[keyboardIndex].scrollIntoView({block:'nearest'});
        return true
    }
    function openForKeyboard(){
        if(meta.panel.classList.contains('hidden')){
            allMultiPanels().forEach(panel=>panel.classList.add('hidden'));
            meta.panel.classList.remove('hidden');
            renderInstitutionOptions(which);
            keyboardIndex=-1
        }
    }
    function selectKeyboardValue(value){
        meta.input.value=value;
        keyboardIndex=-1;
        renderInstitutionOptions(which);
        meta.panel.classList.add('hidden');
        meta.input.focus()
    }

    meta.toggle.addEventListener('click',e=>{
        e.stopPropagation();
        const willOpen=meta.panel.classList.contains('hidden');
        allMultiPanels().forEach(panel=>panel.classList.add('hidden'));
        keyboardIndex=-1;
        if(willOpen){
            meta.panel.classList.remove('hidden');
            renderInstitutionOptions(which)
        }
    });
    meta.input.addEventListener('click',e=>{
        e.stopPropagation();
        allMultiPanels().forEach(panel=>panel.classList.add('hidden'));
        meta.panel.classList.remove('hidden');
        keyboardIndex=-1;
        renderInstitutionOptions(which)
    });
    meta.input.addEventListener('input',()=>{
        // 输入搜索词时自动展开，并立即刷新匹配结果。
        meta.panel.classList.remove('hidden');
        keyboardIndex=-1;
        renderInstitutionOptions(which)
    });
    meta.input.addEventListener('keydown',e=>{
        // 出版菜单支持与标签/书架一致的键盘浏览：
        // ↑ / ↓ 移动高亮，Enter 选中，Escape 收起。
        if(e.key==='ArrowDown'||e.key==='ArrowUp'){
            e.preventDefault();
            e.stopPropagation();
            openForKeyboard();
            const options=keyboardOptions();
            if(!options.length)return;
            if(keyboardIndex<0){
                setKeyboardActive(e.key==='ArrowDown'?0:options.length-1)
            }else{
                setKeyboardActive(keyboardIndex+(e.key==='ArrowDown'?1:-1))
            }
            return
        }
        if(e.key==='Enter'){
            if(!meta.panel.classList.contains('hidden')&&keyboardIndex>=0){
                const option=keyboardOptions()[keyboardIndex];
                if(option){
                    e.preventDefault();
                    e.stopPropagation();
                    selectKeyboardValue(option.dataset.selectValue);
                    return
                }
            }

            const currentValue=clean(meta.input.value);
            const confirmedValue=currentValue&&state.institutions.some(v=>key(v)===key(currentValue));

            // 添加界面：出版已经确认、下拉已收起时，再按 Enter 直接触发主“添加”。
            if(which==='add'&&meta.panel.classList.contains('hidden')&&confirmedValue){
                e.preventDefault();
                e.stopPropagation();
                keyboardIndex=-1;
                addEntry();
                return
            }

            e.preventDefault();
            e.stopPropagation();
            keyboardIndex=-1;
            commitInstitution(which,true);
            meta.panel.classList.add('hidden');
            meta.input.focus()
        }
        if(e.key==='Escape'&&!meta.panel.classList.contains('hidden')){
            e.preventDefault();
            e.stopPropagation();
            clearKeyboardActive();
            meta.panel.classList.add('hidden')
        }
    });
    meta.options.addEventListener('click',e=>{
        e.stopPropagation();
        const select=e.target.closest('.combo-pill-select[data-select-value]');
        if(select){
            clearKeyboardActive();
            meta.input.value=select.dataset.selectValue;
            renderInstitutionOptions(which);
            meta.panel.classList.add('hidden');
            meta.input.focus()
        }
    });
    meta.combo.addEventListener('click',e=>e.stopPropagation())
}

function fastSmoothScrollToTop(){
    const start=Math.max(0,window.scrollY||document.documentElement.scrollTop||0);
    if(start<=0)return;
    const duration=10,startAt=performance.now();
    const easeOut=t=>1-Math.pow(1-t,3);
    function step(now){
        const progress=Math.min(1,(now-startAt)/duration);
        window.scrollTo(0,Math.round(start*(1-easeOut(progress))));
        if(progress<1)requestAnimationFrame(step);
        else window.scrollTo(0,0)
    }
    requestAnimationFrame(step)
}
backToTopBtn.addEventListener('click',fastSmoothScrollToTop);
