<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Press</title>
<style>
:root{font-family:"Times New Roman","Microsoft YaHei","PingFang SC",serif;color:#0f172a;background:#f5f7fa}
*{box-sizing:border-box}
body{margin:0;padding:28px 14px 70px}
button,input,select,textarea{font:inherit}
button{cursor:pointer}
button:disabled{cursor:not-allowed;opacity:.5}
.hidden{display:none!important}
main{max-width:1100px;margin:auto;background:white;border-radius:25px;padding:28px;box-shadow:0 16px 40px #16253a15}
h1{font-size:36px;margin:0 0 20px;border-bottom:2px solid #e8edf4;padding-bottom:15px;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.status{font:500 13px/1.6 system-ui,sans-serif;padding:5px 14px;border-radius:40px;color:#475569;background:#f1f5f9}
.status:before{content:"";display:inline-block;vertical-align:middle;width:9px;height:9px;border-radius:100%;margin-right:8px;background:#e9a327}
.status.ok:before{background:#22c55e}
.status.bad:before{background:#e24b4b}
.toolbar{display:flex;gap:12px;justify-content:space-between;flex-wrap:wrap;align-items:center;padding-bottom:16px;border-bottom:1px solid #e5eaf1}
.toolbar>div{display:flex;gap:8px;flex-wrap:wrap}
.hint{font-size:12px;color:#64748b}
.btn{border:1px solid #cbd5e1;background:#fff;color:#334155;border-radius:30px;padding:9px 16px;font-size:14px;font-weight:600}
.btn:hover{background:#f1f5f9}
.primary{color:#fff;background:#1e293b;border-color:#1e293b}
.primary:hover{background:#111827}
.blue{color:#fff;background:#1e40af;border-color:#1e40af}
.danger{color:#991b1b;background:#fee2e2;border-color:#fecaca}
.panel{border:1px solid #e2e8f0;border-radius:20px;padding:22px;margin:24px 0;background:#f8fafc}
h2{font-size:22px;margin:0 0 16px}
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.field{display:flex;flex-direction:column;gap:6px;min-width:0}
.field.full{grid-column:1/-1}
.field>label,.legend{font:bold 13px/1.3 system-ui,sans-serif;color:#475569}
.field>input,.field>select,.field>textarea{width:100%;min-height:43px;border:1px solid #cbd5e1;border-radius:12px;padding:10px 12px;background:#fff;color:#0f172a;outline:none}
.field>input:focus,.field>textarea:focus{border-color:#1e40af;box-shadow:0 0 0 2px #b6c9fe}
.groups{display:flex;flex-wrap:wrap;align-items:center;gap:6px;padding:6px;border:1px solid #cbd5e1;border-radius:12px;background:white;min-height:43px}
.group{padding:6px 8px;border:1px solid #dae1eb;border-radius:6px;background:#fff;font-size:13px;white-space:nowrap;cursor:pointer;user-select:none}
.group input{vertical-align:middle}
.group:has(input:checked){background:#e8f0ff;border-color:#8cacf2}
.add-btn{width:100%;margin-top:16px;min-height:46px}
.list-head{display:flex;justify-content:space-between;align-items:center;gap:10px}
.count{padding:5px 14px;border-radius:25px;background:#e8edf4;font-size:13px}
.list{border:1px solid #e2e8f0;border-radius:20px;overflow:hidden}
.entry{position:relative;padding:18px 18px 20px;background:#fff;border-top:1px solid #dbe3ed}
.entry:first-child{border-top:0}
.entry:hover{background:#fafcff}
.title{font-size:19px;font-weight:bold;color:#1e40af;overflow-wrap:anywhere}
a{color:#1e40af;text-decoration:none}
a:hover{text-decoration:underline}
.meta{font-size:14px;color:#202a3a;line-height:1.75;margin-top:6px;padding-right:65px;overflow-wrap:anywhere}
.meta .label{display:inline-block;width:43px;color:#667085}
.edit-link{position:absolute;right:18px;bottom:15px;border:0;background:none;color:#334155}
.empty{padding:44px;text-align:center;color:#94a3b8}
.overlay{position:fixed;inset:0;z-index:10;display:flex;align-items:center;justify-content:center;padding:12px;background:#0f172a80}
.dialog{width:min(100%,640px);max-height:calc(100dvh - 24px);background:white;border-radius:20px;display:flex;flex-direction:column;overflow:hidden}
.dialog-body{overflow:auto;padding:24px}
.dialog-body h2{margin:0 0 20px}
.dialog-actions{display:flex;justify-content:flex-end;gap:8px;padding:14px 20px;border-top:1px solid #e2e8f0;background:#fff}
.dialog .field{margin-bottom:14px}
.manage-row{display:flex;align-items:center;gap:6px;margin:8px 0;padding:6px;background:#f8fafc;border-radius:10px}
.manage-row input{flex:1;min-width:0;border:1px solid #cbd5e1;border-radius:8px;padding:8px}
.manage-row button{padding:7px 10px}
#toast{position:fixed;z-index:30;bottom:20px;left:50%;transform:translateX(-50%);border-radius:20px;background:#1e40af;color:#fff;padding:11px 20px;max-width:90vw;font:13px system-ui,sans-serif}
#topBtn{position:fixed;right:10px;bottom:90px;border:0;background:none;color:#1e40af;font-size:27px}
@media(max-width:700px){
 body{padding:10px}
 main{padding:18px;border-radius:18px}
 h1{font-size:29px}
 .panel{padding:16px}
 .form-grid{grid-template-columns:1fr}
 .field.full{grid-column:auto}
 .toolbar{flex-direction:column;align-items:flex-start}
 .dialog-body{padding:16px}
}
</style>
</head>
<body>
<main>
<h1>Press <span class="status" id="status">页面已启动</span></h1>

<div class="toolbar">
  <div>
    <button class="btn blue hidden" id="syncBtn" type="button">同步</button>
    <button class="btn" id="configBtn" type="button">配置</button>
    <button class="btn" id="manageBtn" type="button">排序</button>
    <button class="btn" id="importBtn" type="button">导入</button>
    <button class="btn" id="exportBtn" type="button">导出</button>
    <input id="importInput" class="hidden" type="file" accept=".json,application/json">
  </div>
  <span class="hint" id="syncHint">本地数据可直接添加；连接 GitHub 后可同步</span>
</div>

<section class="panel" id="addSection">
  <h2>添加</h2>
  <form id="addForm" autocomplete="off">
    <div class="form-grid">
      <div class="field full">
        <label for="bookName">书名</label>
        <input id="bookName" required>
      </div>
      <div class="field">
        <label for="bookNo">书号</label>
        <input id="bookNo">
      </div>
      <div class="field">
        <label for="publisher">出版</label>
        <input id="publisher" list="publisherList">
        <datalist id="publisherList"></datalist>
      </div>
      <div class="field">
        <span class="legend">编组（可多选）</span>
        <div class="groups" id="addGroups"></div>
      </div>
      <div class="field">
        <label for="shelf">书架（多个以逗号分隔）</label>
        <input id="shelf" list="shelfList">
        <datalist id="shelfList"></datalist>
      </div>
    </div>
    <button class="btn primary add-btn" type="submit">添加</button>
  </form>
</section>

<section>
  <div class="list-head">
    <h2>总表</h2>
    <span class="count" id="count">0/0</span>
  </div>
  <div class="list" id="list">
    <div class="empty">暂无条目</div>
  </div>
</section>
</main>

<div class="overlay hidden" id="editModal">
 <div class="dialog">
  <div class="dialog-body">
   <h2>编辑条目</h2>
   <div class="field">
    <label for="editName">书名</label>
    <input id="editName">
   </div>
   <div class="form-grid">
    <div class="field">
     <label for="editNo">书号</label>
     <input id="editNo">
    </div>
    <div class="field">
     <label for="editPublisher">出版</label>
     <input id="editPublisher" list="publisherList">
    </div>
    <div class="field">
     <span class="legend">编组</span>
     <div class="groups" id="editGroups"></div>
    </div>
    <div class="field">
     <label for="editShelf">书架</label>
     <input id="editShelf" list="shelfList">
    </div>
    <div class="field">
     <label for="editCode">编码（留空可重新自动分配）</label>
     <input id="editCode" maxlength="6" inputmode="numeric">
    </div>
   </div>
  </div>
  <div class="dialog-actions">
   <button class="btn danger" id="deleteBtn">删除</button>
   <button class="btn" id="editCancel">取消</button>
   <button class="btn primary" id="editSave">保存</button>
  </div>
 </div>
</div>

<div class="overlay hidden" id="configModal">
 <form class="dialog" id="configForm">
  <div class="dialog-body">
   <h2>GitHub 管理配置</h2>
   <div class="field">
    <label for="owner">仓库所有者</label>
    <input id="owner" placeholder="用户名或组织名" autocomplete="username">
   </div>
   <div class="field">
    <label for="repo">仓库名称</label>
    <input id="repo">
   </div>
   <div class="field">
    <label for="dataFile">数据文件路径</label>
    <input id="dataFile" value="press_data.json">
   </div>
   <div class="field">
    <label for="token">GitHub Personal Access Token</label>
    <input id="token" type="password" autocomplete="off">
   </div>
   <label style="font-size:14px">
    <input type="checkbox" id="remember" checked> 在本设备保存 Token
   </label>
   <p class="hint" style="margin-top:12px;line-height:1.7">
    公开访问无需 Token；管理同步需要仓库 Contents 读写权限。Token 不会写入导出的数据文件。请勿将带有 Token 的浏览器存储分享给他人。
   </p>
  </div>
  <div class="dialog-actions">
   <button type="button" class="btn" id="configCancel">取消</button>
   <button class="btn primary" type="submit">保存并连接</button>
  </div>
 </form>
</div>

<div class="overlay hidden" id="manageModal">
 <div class="dialog">
  <div class="dialog-body">
   <h2>出版排序管理</h2>
   <div class="form-grid">
    <div class="field">
     <label for="newInstitution">新增出版选项</label>
     <input id="newInstitution">
    </div>
    <button class="btn primary" id="newInstitutionBtn" style="align-self:end">添加</button>
   </div>
   <div id="institutionRows" style="margin-top:16px"></div>
  </div>
  <div class="dialog-actions">
   <button class="btn primary" id="manageClose">完成</button>
  </div>
 </div>
</div>

<button id="topBtn" type="button" title="回到顶部">▲</button>
<div id="toast" class="hidden" role="alert"></div>

<script>
(()=>{
'use strict';

// 1. 启动与数据层：先提供可操作界面，所有网络读取都有超时和失败分支。
const $=id=>document.getElementById(id);
const PUBLIC_FILE='press_data.json',STORE='press_reliable_v1';
const GROUPS=['11','12','13','14','21','22','23'];
const COLLATOR=new Intl.Collator('zh-CN-u-co-pinyin',{numeric:true,sensitivity:'base'});

const RULES={
 zh:{
  groups:{
   '11':[[110001,119999],[160001,166999]],
   '12':[[120001,127999]],
   '13':[[130001,139999],[180001,186999]],
   '14':[[140001,146999]],
   '21':[[210001,217999],[260001,267999]],
   '22':[[220001,227999]],
   '23':[[230001,239999],[270001,277999]]
  },
  exceptions:{
   '11/13':[[167001,167999]],
   '11/22':[[168001,168999]],
   '11/23':[[169001,169999]],
   '13/21':[[187001,187999]],
   '13/22':[[188001,188999]],
   '13/23':[[189001,189999]],
   '14/22':[[147001,147999]],
   '21/22':[[268001,269999]],
   '21/23':[[278001,279999]]
  }
 },
 en:{
  groups:{
   '11':[[150001,158999]],
   '12':[[128001,129999]],
   '13':[[170001,178999]],
   '14':[[148001,148999]],
   '21':[[250001,257999]],
   '22':[[228001,229999]],
   '23':[[280001,289999]]
  },
  exceptions:{
   '11/13':[[159001,159999]],
   '13/21':[[179001,179999]],
   '14/22':[[149001,149999]],
   '21/22':[[258001,259999]]
  }
 }
};

const empty=()=>({
 schemaVersion:9,
 entries:[],
 institutions:[],
 categories:[],
 tags:GROUPS.map(x=>x+'组')
});

const clean=x=>String(x??'').normalize('NFC').trim();

const uniq=xs=>[
 ...new Map(
  (xs||[])
   .map(x=>clean(x))
   .filter(Boolean)
   .map(x=>[x.toLocaleLowerCase('zh-CN'),x])
 ).values()
];

const multi=x=>uniq(Array.isArray(x)?x:[x]);
const parseList=x=>uniq(String(x||'').split(/[,，、;；\n]+/));

const canonGroup=x=>{
 const s=clean(x).normalize('NFKC');
 return GROUPS.includes(s)?s+'组':s;
};

const fixedGroups=x=>uniq(multi(x).map(canonGroup))
 .sort((a,b)=>Number(a.slice(0,2))-Number(b.slice(0,2))||COLLATOR.compare(a,b));

const ident=()=>typeof crypto!=='undefined'&&typeof crypto.randomUUID==='function'
 ?crypto.randomUUID()
 :'press_'+Date.now()+'_'+Math.random().toString(36).slice(2);

function normalize(raw){
 const obj=Array.isArray(raw)
  ?{entries:raw}
  :(raw&&typeof raw==='object'?raw:{});

 const entries=(Array.isArray(obj.entries)?obj.entries:[])
  .filter(x=>x&&clean(x.bookName))
  .map(x=>({
   id:clean(x.id)||ident(),
   bookName:clean(x.bookName),
   bookNo:clean(x.bookNo),
   institution:clean(x.institution),
   category:multi(x.category),
   tag:fixedGroups(x.tag),
   tagChecked:!!x.tagChecked,
   code:clean(x.code),
   codeAutoManaged:!!x.codeAutoManaged,
   codeAutoPending:!!x.codeAutoPending,
   codeManualEdited:!!x.codeManualEdited,
   codeManualPinned:!!x.codeManualPinned
  }));

 const institutions=uniq(
  Array.isArray(obj.institutions)?obj.institutions:entries.map(x=>x.institution)
 );

 const categories=uniq(
  Array.isArray(obj.categories)?obj.categories:entries.flatMap(x=>x.category)
 );

 const order=new Map(institutions.map((x,i)=>[x,i]));

 entries.sort((a,b)=>
  (order.get(a.institution)??1e9)-(order.get(b.institution)??1e9)
  ||compareNo(a.bookNo,b.bookNo)
  ||COLLATOR.compare(a.bookName,b.bookName)
 );

 return {
  schemaVersion:9,
  entries,
  institutions,
  categories,
  tags:GROUPS.map(x=>x+'组')
 };
}

function compareNo(a,b){
 if(a&&!b)return -1;
 if(b&&!a)return 1;

 const m=x=>clean(x).match(/^(\d+)-(\d+)-(\d+)$/);
 const x=m(a),y=m(b);

 if(x&&y){
  for(let i=1;i<=3;i++){
   if(+x[i]!==+y[i])return +x[i]-+y[i];
  }
 }

 if(!!x!==!!y)return x?-1:1;

 return COLLATOR.compare(a,b);
}

const storage={
 get(k){
  try{return localStorage.getItem(k)}
  catch{return null}
 },
 set(k,v){
  try{
   localStorage.setItem(k,v);
   return true;
  }catch{return false}
 }
};

const readJSON=(k,fallback)=>{
 try{return JSON.parse(storage.get(k))??fallback}
 catch{return fallback}
};

let config=readJSON(STORE+':config',{
 owner:'',
 repo:'',
 file:PUBLIC_FILE,
 token:''
});

config={
 owner:clean(config.owner),
 repo:clean(config.repo),
 file:clean(config.file)||PUBLIC_FILE,
 token:clean(config.token)
};

let target=()=>[config.owner,config.repo,config.file].join('/');
let saved=readJSON(STORE+':work',null);
let baseline=readJSON(STORE+':base',null);

let state=normalize(saved&&saved.target===target()?saved.data:empty());
let base=normalize(baseline&&baseline.target===target()?baseline.data:empty());
let sha=baseline&&baseline.target===target()?baseline.sha:null;
let dirty=!!(saved&&saved.target===target()&&saved.dirty);
let version=0,syncing=null,retryTimer=null,toastTimer=null,editingId=null;

function saveWork(){
 const ok=storage.set(
  STORE+':work',
  JSON.stringify({target:target(),dirty,data:state})
 );
 if(!ok)hint('本地存储不可用，请及时导出备份');
 return ok;
}

function saveBase(){
 storage.set(
  STORE+':base',
  JSON.stringify({target:target(),sha,data:base})
 );
}

function hint(s){
 $('syncHint').textContent=s;
}

function status(s,kind=''){
 const e=$('status');
 e.textContent=s;
 e.className='status '+kind;
}

function toast(msg){
 const el=$('toast');
 el.textContent=msg;
 el.classList.remove('hidden');
 clearTimeout(toastTimer);
 toastTimer=setTimeout(()=>el.classList.add('hidden'),4200);
}

function esc(x){
 return clean(x).replace(/[&<>"']/g,c=>({
  '&':'&amp;',
  '<':'&lt;',
  '>':'&gt;',
  '"':'&quot;',
  "'":'&#39;'
 }[c]));
}

function linkify(x){
 let s=clean(x),out='',last=0;
 const re=/\[([^\]]+)\]\((https?:\/\/[^\s)]+)\)/g;
 let m;

 while((m=re.exec(s))){
  out+=esc(s.slice(last,m.index));
  out+='<a href="'+esc(m[2])+'" target="_blank" rel="noopener noreferrer">'+esc(m[1])+'</a>';
  last=m.index+m[0].length;
 }

 return out+esc(s.slice(last));
}

function groupsUI(id,values=[]){
 $(id).innerHTML=GROUPS.map(g=>
  '<label class="group"><input type="checkbox" value="'+g+'组" '+
  (values.includes(g+'组')?'checked':'')+'> '+g+'组</label>'
 ).join('');
}

function readGroups(id){
 return GROUPS.filter(g=>
  [...$(id).querySelectorAll('input:checked')].some(x=>x.value===g+'组')
 ).map(g=>g+'组');
}

function updateHints(){
 $('publisherList').innerHTML=state.institutions
  .map(x=>'<option value="'+esc(x)+'"></option>').join('');

 $('shelfList').innerHTML=state.categories
  .map(x=>'<option value="'+esc(x)+'"></option>').join('');

 $('syncBtn').classList.toggle('hidden',!connected());

 hint(
  connected()
   ?(dirty?'有未同步修改 · 点击同步':'管理已配置 · 可同步 GitHub')
   :'本地模式 · 可添加和导出；配置 GitHub 后可同步'
 );
}

function render(){
 state=normalize(state);
 updateHints();

 $('count').textContent=state.entries.length+'/'+state.entries.length;

 $('list').innerHTML=state.entries.length
  ?state.entries.map(e=>{
   const rows=[];

   if(e.institution){
    rows.push(
     '<div><span class="label">出版：</span>'+linkify(e.institution)+'</div>'
    );
   }

   if(e.bookNo){
    rows.push(
     '<div><span class="label">书号：</span>'+esc(e.bookNo)+'</div>'
    );
   }

   rows.push(
    '<div><span class="label">编组：</span>'+esc(e.tag.join('/'))+'</div>'
   );

   if(e.category.length){
    rows.push(
     '<div><span class="label">书架：</span>'+esc(e.category.join('、'))+'</div>'
    );
   }

   return '<article class="entry">'+
    '<div class="title">'+linkify(e.bookName)+'</div>'+
    '<div class="meta">'+rows.join('')+'</div>'+
    '<button class="edit-link" data-edit="'+esc(e.id)+'">'+
    esc(e.code||'编辑')+'</button></article>';
  }).join('')
  :'<div class="empty">暂无条目；可使用上方表单添加。</div>';
}

function changed(derive=true){
 if(derive){
  state.institutions=uniq([
   ...state.institutions,
   ...state.entries.map(x=>x.institution)
  ]);

  state.categories=uniq([
   ...state.categories,
   ...state.entries.flatMap(x=>x.category)
  ]);
 }

 dirty=true;
 version++;
 state=normalize(state);
 saveWork();
 render();

 if(connected())scheduleSync();
}

function connected(){
 return !!(config.owner&&config.repo&&config.file&&config.token);
}

// 2. 编码：获得最新远程清单后分配，防止离线占用正式编码。
function codeRanges(e){
 const groups=e.tag
  .map(x=>clean(x).replace(/组$/,''))
  .filter(x=>GROUPS.includes(x));

 if(!groups.length||groups.length!==e.tag.length)return [];

 const chinese=/[\u3400-\u9fff]/.test(
  e.bookName.replace(/\[[^\]]+\]\([^)]+\)/g,'')
 );

 const rules=chinese?RULES.zh:RULES.en;
 const combo=groups.join('/');
 const ranges=rules.exceptions[combo]||groups.flatMap(g=>rules.groups[g]||[]);

 return ranges.slice().sort((a,b)=>a[0]-b[0]);
}

function assignCodes(data){
 const used=new Set(
  data.entries.filter(e=>/^\d{6}$/.test(e.code)).map(e=>+e.code)
 );

 for(const e of data.entries){
  if(e.code||!e.tag.length||!(e.codeAutoPending||e.codeAutoManaged))continue;

  for(const [first,last] of codeRanges(e)){
   let n=first;

   while(n<=last&&used.has(n))n++;

   if(n<=last){
    e.code=String(n);
    e.codeAutoManaged=true;
    e.codeAutoPending=false;
    used.add(n);
    break;
   }
  }
 }

 return data;
}

// 3. 请求层：超时、HTTP 状态、中文 Base64、GitHub 409/422 冲突重试。
async function getWithTimeout(url,options={},ms=9000){
 const controller=new AbortController();
 const t=setTimeout(()=>controller.abort(),ms);

 try{
  const response=await fetch(url,{
   ...options,
   signal:controller.signal
  });

  const text=await response.text();

  return {
   ok:response.ok,
   status:response.status,
   text
  };
 }catch(err){
  if(err.name==='AbortError'){
   throw new Error('请求超时（'+ms/1000+' 秒）');
  }
  throw err;
 }finally{
  clearTimeout(t);
 }
}

function encodeB64(text){
 const buf=new TextEncoder().encode(text);
 let s='';

 for(let i=0;i<buf.length;i+=8192){
  s+=String.fromCharCode(...buf.subarray(i,i+8192));
 }

 return btoa(s);
}

function decodeB64(s){
 const binary=atob(String(s||'').replace(/\s/g,''));
 const arr=Uint8Array.from(binary,c=>c.charCodeAt(0));
 return new TextDecoder().decode(arr);
}

function apiUrl(){
 return 'https://api.github.com/repos/'+
  encodeURIComponent(config.owner)+'/'+
  encodeURIComponent(config.repo)+'/contents/'+
  config.file.split('/').filter(Boolean).map(encodeURIComponent).join('/');
}

async function github(method,body){
 const response=await getWithTimeout(
  apiUrl(),
  {
   method,
   headers:{
    'Authorization':'Bearer '+config.token,
    'Accept':'application/vnd.github+json',
    'Content-Type':'application/json',
    'X-GitHub-Api-Version':'2022-11-28'
   },
   ...(body?{body:JSON.stringify(body)}:{})
  },
  10000
 );

 let json={};

 try{
  json=JSON.parse(response.text);
 }catch{}

 if(!response.ok){
  const err=new Error(json.message||'GitHub HTTP '+response.status);
  err.status=response.status;
  throw err;
 }

 return json;
}

async function remoteRead(){
 try{
  const r=await github('GET');

  if(typeof r.content!=='string'){
   throw Error('远程文件不是常规 JSON 文件');
  }

  return {
   data:normalize(JSON.parse(decodeB64(r.content))),
   sha:r.sha
  };
 }catch(e){
  if(e.status===404){
   return {data:empty(),sha:null};
  }
  throw e;
 }
}

function eq(a,b){
 return JSON.stringify(a)===JSON.stringify(b);
}

function mergeThreeWay(local,remote,original){
 const merged=empty();
 const B=new Map(original.entries.map(x=>[x.id,x]));
 const L=new Map(local.entries.map(x=>[x.id,x]));
 const R=new Map(remote.entries.map(x=>[x.id,x]));

 let conflicts=0;

 for(const id of new Set([...B.keys(),...L.keys(),...R.keys()])){
  const b=B.get(id),l=L.get(id),r=R.get(id);

  if(!b){
   if(l||r)merged.entries.push({...r,...l});
   continue;
  }

  if(!l&&!r)continue;

  if(!l){
   if(!eq(r,b)){
    merged.entries.push(r);
    conflicts++;
   }
   continue;
  }

  if(!r){
   if(!eq(l,b)){
    merged.entries.push(l);
    conflicts++;
   }
   continue;
  }

  const result={id};

  for(const f of [
   'bookName','bookNo','institution','category','tag',
   'tagChecked','code','codeAutoManaged','codeAutoPending',
   'codeManualEdited','codeManualPinned'
  ]){
   if(eq(l[f],b[f])){
    result[f]=r[f];
   }else if(eq(r[f],b[f])||eq(l[f],r[f])){
    result[f]=l[f];
   }else{
    result[f]=l[f];
    conflicts++;
   }
  }

  merged.entries.push(result);
 }

 for(const f of ['institutions','categories']){
  const a=local[f],r=remote[f],b=original[f];
  merged[f]=eq(a,b)?r:eq(r,b)?a:uniq([...a,...r]);
 }

 return {
  data:normalize(merged),
  conflicts
 };
}

let nextSyncTimer=null;

function scheduleSync(){
 clearTimeout(nextSyncTimer);
 nextSyncTimer=setTimeout(()=>sync(),900);
}

async function sync(){
 if(!connected()){
  status('本地模式 · 尚未配置 GitHub');
  return false;
 }

 if(syncing)return syncing;

 syncing=(async()=>{
  status('正在同步…');

  for(let attempt=0;attempt<3;attempt++){
   try{
    const checkpoint=version;
    const remote=await remoteRead();

    // 仅在存在本地修改时进行三方合并。
    const merged=dirty
     ?mergeThreeWay(state,remote.data,base)
     :{data:remote.data,conflicts:0};

    const snapshot=assignCodes(merged.data);

    if(!dirty){
     state=snapshot;
     base=normalize(remote.data);
     sha=remote.sha;

     saveBase();
     saveWork();
     render();

     status('已连接 GitHub','ok');
     return true;
    }

    const content=JSON.stringify(snapshot,null,2);

    if(new TextEncoder().encode(content).length>750*1024){
     throw Error('数据超过 750KB 限制，请导出备份并整理');
    }

    const body={
     message:'Update '+config.file+' from Press',
     content:encodeB64(content)
    };

    if(remote.sha)body.sha=remote.sha;

    const response=await github('PUT',body);

    if(checkpoint!==version){
     // 提交过程中发生新的本地编辑，不清除未同步标记。
     base=normalize(snapshot);
     sha=response.content?.sha||null;
     saveBase();
     continue;
    }

    state=normalize(snapshot);
    base=normalize(snapshot);
    sha=response.content?.sha||null;

    dirty=false;

    saveBase();
    saveWork();
    render();

    status('已同步 GitHub','ok');
    hint('同步完成 · '+new Date().toLocaleString());

    if(merged.conflicts){
     toast('已合并修改；'+merged.conflicts+' 项冲突优先保留本机值');
    }

    return true;

   }catch(err){
    if((err.status===409||err.status===422)&&attempt<2){
     continue;
    }

    console.error('同步失败',err);

    status('同步失败 · 本地数据已保留','bad');
    hint('同步失败：'+err.message+'；可点击同步重试');

    return false;
   }
  }

  status('同步冲突 · 本地数据已保留','bad');
  return false;

 })();

 try{
  return await syncing;
 }finally{
  syncing=null;
 }
}

async function loadPublic(){
 if(location.protocol==='file:'){
  status('本地文件预览 · 已就绪','ok');
  return;
 }

 status('正在读取公开数据…');

 try{
  const response=await getWithTimeout(
   new URL(PUBLIC_FILE,location.href).href+'?v='+Date.now(),
   {cache:'no-store'},
   8000
  );

  if(!response.ok){
   throw Error('HTTP '+response.status);
  }

  const publicState=normalize(JSON.parse(response.text));

  if(!dirty&&!connected()){
   state=publicState;
   saveWork();
   render();
  }

  status(
   connected()?'公开数据已读取 · 管理可用':'公开数据已读取',
   'ok'
  );

 }catch(err){
  console.warn('读取公开数据失败',err);

  status('公开数据读取失败 · 本地仍可使用','bad');
  hint('请检查 press_data.json 文件或通过“配置”连接 GitHub');
 }
}

async function legacyMigration(){
 // 兼容旧版 IndexedDB。超时不会阻塞添加和总表。
 if(config.token||!('indexedDB' in window))return;

 let timer;

 try{
  const db=await Promise.race([
   new Promise((resolve,reject)=>{
    const req=indexedDB.open('press_public_v1:idb_v1',1);

    req.onsuccess=()=>resolve(req.result);
    req.onerror=()=>reject(req.error);

    req.onupgradeneeded=()=>{
     const d=req.result;
     if(!d.objectStoreNames.contains('kv')){
      d.createObjectStore('kv');
     }
    };
   }),
   new Promise((_,reject)=>{
    timer=setTimeout(()=>reject(Error('timeout')),1500);
   })
  ]);

  clearTimeout(timer);

  if(!db.objectStoreNames.contains('kv')){
   db.close();
   return;
  }

  const keys=[
   'config',
   'token_persisted',
   'workcopy',
   'sync_base_v3_5s',
   'meta'
  ];

  const data=await new Promise(resolve=>{
   let out={};
   const tx=db.transaction('kv','readonly');

   for(const k of keys){
    const req=tx.objectStore('kv').get(k);
    req.onsuccess=()=>out[k]=req.result;
   }

   tx.oncomplete=()=>resolve(out);
   tx.onerror=()=>resolve(out);
  });

  db.close();

  if(!config.owner&&data.config?.owner){
   config.owner=clean(data.config.owner);
   config.repo=clean(data.config.repo);
   config.file=clean(data.config.file)||PUBLIC_FILE;
  }

  if(data.token_persisted){
   config.token=clean(data.token_persisted);
  }

  if(!saved&&data.workcopy?.state){
   state=normalize(data.workcopy.state);
   dirty=!!data.meta?.dirty;
   saveWork();
   render();
  }

  if(!baseline&&data.sync_base_v3_5s?.state){
   base=normalize(data.sync_base_v3_5s.state);
   sha=data.sync_base_v3_5s.sha;
   saveBase();
  }

  storage.set(STORE+':config',JSON.stringify(config));
  updateHints();

  if(connected())await sync();

 }catch(e){
  clearTimeout(timer);
  console.info('旧版配置未迁移：',e.message);
 }
}

// 4. 添加、编辑、出版排序、导入导出。
$('addForm').addEventListener('submit',e=>{
 e.preventDefault();

 const title=clean($('bookName').value);

 if(!title){
  toast('请填写书名');
  return;
 }

 const tags=readGroups('addGroups');

 state.entries.push({
  id:ident(),
  bookName:title,
  bookNo:clean($('bookNo').value),
  institution:clean($('publisher').value),
  category:parseList($('shelf').value),
  tag:tags,
  code:'',
  codeAutoPending:tags.length>0,
  codeAutoManaged:false,
  codeManualEdited:false,
  codeManualPinned:false,
  tagChecked:false
 });

 e.target.reset();
 groupsUI('addGroups');
 changed();

 $('bookName').focus();

 toast(connected()?'已添加，正在同步':'已保存在本机');
});

$('list').addEventListener('click',e=>{
 const b=e.target.closest('[data-edit]');
 if(!b)return;
 openEdit(b.dataset.edit);
});

function openEdit(id){
 const v=state.entries.find(x=>x.id===id);
 if(!v)return;

 editingId=id;

 $('editName').value=v.bookName;
 $('editNo').value=v.bookNo;
 $('editPublisher').value=v.institution;
 $('editShelf').value=v.category.join('、');
 $('editCode').value=v.code;

 groupsUI('editGroups',v.tag);

 $('editModal').classList.remove('hidden');
}

$('editCancel').onclick=()=>{
 $('editModal').classList.add('hidden');
 editingId=null;
};

$('editSave').onclick=()=>{
 const e=state.entries.find(x=>x.id===editingId);
 if(!e)return;

 const name=clean($('editName').value);
 const code=clean($('editCode').value);
 const tags=readGroups('editGroups');

 if(!name){
  toast('书名不能为空');
  return;
 }

 if(code&&!/^\d{6}$/.test(code)){
  toast('编码必须是 6 位数字，或留空');
  return;
 }

 if(code&&state.entries.some(x=>x.id!==e.id&&x.code===code)){
  toast('该编码已经被使用');
  return;
 }

 const codeChanged=code!==e.code;
 const groupChanged=JSON.stringify(tags)!==JSON.stringify(e.tag);

 e.bookName=name;
 e.bookNo=clean($('editNo').value);
 e.institution=clean($('editPublisher').value);
 e.category=parseList($('editShelf').value);
 e.tag=tags;

 if(codeChanged){
  e.code=code;
  e.codeManualEdited=!!code;
  e.codeManualPinned=!!code;
  e.codeAutoManaged=false;
  e.codeAutoPending=!code&&tags.length>0;
 }else if(groupChanged&&e.codeAutoManaged){
  e.code='';
  e.codeAutoManaged=false;
  e.codeAutoPending=tags.length>0;
 }

 changed();

 $('editModal').classList.add('hidden');
 editingId=null;

 toast('已保存');
};

$('deleteBtn').onclick=()=>{
 if(!editingId||!confirm('确定删除这个条目吗？'))return;

 state.entries=state.entries.filter(x=>x.id!==editingId);
 editingId=null;

 $('editModal').classList.add('hidden');

 changed();
 toast('已删除');
};

function manageRender(){
 $('institutionRows').innerHTML=state.institutions.length
  ?state.institutions.map((x,i)=>
   '<div class="manage-row">'+
   '<input data-index="'+i+'" value="'+esc(x)+'" aria-label="出版名称">'+
   '<button class="btn" data-up="'+i+'" title="上移">↑</button>'+
   '<button class="btn" data-down="'+i+'" title="下移">↓</button>'+
   '<button class="btn danger" data-remove="'+i+'" title="移除选项">×</button>'+
   '</div>'
  ).join('')
  :'<p class="hint">暂无出版选项。</p>';
}

$('manageBtn').onclick=()=>{
 manageRender();
 $('manageModal').classList.remove('hidden');
};

$('manageClose').onclick=()=>{
 $('manageModal').classList.add('hidden');
};

$('newInstitutionBtn').onclick=()=>{
 const s=clean($('newInstitution').value);
 if(!s)return;

 if(state.institutions.includes(s)){
  return toast('出版选项已存在');
 }

 state.institutions.push(s);
 $('newInstitution').value='';

 changed();
 manageRender();
};

$('institutionRows').addEventListener('click',e=>{
 const b=e.target.closest('button');
 if(!b)return;

 if(b.dataset.up!==undefined){
  const i=+b.dataset.up;
  if(i>0){
   [state.institutions[i-1],state.institutions[i]]=
   [state.institutions[i],state.institutions[i-1]];
  }
 }

 if(b.dataset.down!==undefined){
  const i=+b.dataset.down;
  if(i<state.institutions.length-1){
   [state.institutions[i+1],state.institutions[i]]=
   [state.institutions[i],state.institutions[i+1]];
  }
 }

 if(b.dataset.remove!==undefined){
  state.institutions.splice(+b.dataset.remove,1);
 }

 changed(false);
 manageRender();
});

$('institutionRows').addEventListener('change',e=>{
 const input=e.target.closest('[data-index]');
 if(!input)return;

 const i=+input.dataset.index;
 const old=state.institutions[i];
 const next=clean(input.value);

 if(!next||state.institutions.some((x,j)=>j!==i&&x===next)){
  toast('名称为空或重复');
  manageRender();
  return;
 }

 state.institutions[i]=next;

 state.entries.forEach(x=>{
  if(x.institution===old)x.institution=next;
 });

 changed();
 manageRender();
});

$('exportBtn').onclick=()=>{
 const blob=new Blob(
  [JSON.stringify(state,null,2)],
  {type:'application/json;charset=utf-8'}
 );

 const url=URL.createObjectURL(blob);
 const a=document.createElement('a');

 a.href=url;
 a.download='press_data_'+new Date().toISOString().slice(0,10)+'.json';
 a.click();

 setTimeout(()=>URL.revokeObjectURL(url),2000);
 toast('已导出 JSON 数据备份');
};

$('importBtn').onclick=()=>{
 $('importInput').click();
};

$('importInput').addEventListener('change',async e=>{
 const f=e.target.files?.[0];
 if(!f)return;

 try{
  const obj=JSON.parse(await f.text());

  if(!Array.isArray(obj)&&!Array.isArray(obj.entries)){
   throw Error('不是有效的书目数据');
  }

  const incoming=normalize(obj);

  if(!confirm(
   '将导入 '+incoming.entries.length+
   ' 条，并替换当前总表；建议先导出备份。确定吗？'
  )){
   return;
  }

  state=incoming;
  changed();

  toast('导入完成');
 }catch(err){
  toast('导入失败：'+err.message);
 }finally{
  e.target.value='';
 }
});

$('syncBtn').onclick=()=>sync();

$('configBtn').onclick=()=>{
 $('owner').value=config.owner;
 $('repo').value=config.repo;
 $('dataFile').value=config.file;
 $('token').value=config.token;

 $('remember').checked=
  !!storage.get(STORE+':config')&&!!config.token;

 $('configModal').classList.remove('hidden');
};

$('configCancel').onclick=()=>{
 $('configModal').classList.add('hidden');
};

$('configForm').addEventListener('submit',e=>{
 e.preventDefault();

 if(syncing){
  toast('当前正在同步，请完成同步后再切换仓库');
  return;
 }

 const newConfig={
  owner:clean($('owner').value),
  repo:clean($('repo').value),
  file:clean($('dataFile').value)||PUBLIC_FILE,
  token:clean($('token').value)
 };

 if(
  (newConfig.owner&&!newConfig.repo)||
  (!newConfig.owner&&newConfig.repo)
 ){
  toast('仓库所有者和仓库名称须同时填写');
  return;
 }

 if(newConfig.file.includes('..')||newConfig.file.startsWith('/')){
  toast('数据文件路径无效');
  return;
 }

 if(
  [newConfig.owner,newConfig.repo,newConfig.file].join('/')!==target()
  &&dirty
  &&!confirm(
   '更换仓库会切换数据空间。当前有未同步数据，请先导出备份。仍然继续吗？'
  )
 ){
  return;
 }

 const old=target();
 config=newConfig;

 storage.set(
  STORE+':config',
  JSON.stringify({
   ...config,
   token:$('remember').checked?config.token:''
  })
 );

 if(target()!==old){
  // 切换仓库时保留未同步的本地修改，避免静默丢失。
  if(!dirty)state=empty();

  base=empty();
  sha=null;
  dirty=dirty||state.entries.length>0;

  saveWork();
  saveBase();
  render();
 }

 $('configModal').classList.add('hidden');
 updateHints();

 if(connected()){
  sync();
 }else{
  status('本地模式 · 配置已保存','ok');
  toast('已保存配置');
 }
});

$('topBtn').onclick=()=>{
 scrollTo({top:0,behavior:'smooth'});
};

for(const id of ['editModal','configModal','manageModal']){
 $(id).addEventListener('click',e=>{
  if(e.target===$(id)){
   $(id).classList.add('hidden');
  }
 });
}

document.addEventListener('keydown',e=>{
 if(e.key==='Escape'){
  for(const id of ['editModal','configModal','manageModal']){
   $(id).classList.add('hidden');
  }

});

window.addEventListener('online',()=>{
 if(connected()&&dirty)sync();
});

window.addEventListener('focus',()=>{
 if(connected()&&dirty&&!syncing)sync();
});
