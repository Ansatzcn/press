<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,viewport-fit=cover,interactive-widget=resizes-content">
<title>Press</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{
min-height:100vh;
padding:2rem 1rem 4rem;
background:#f5f7fa;
color:#0f172a;
font-family:"Times New Roman","Microsoft YaHei","PingFang SC",serif
}
button,input,select{font:inherit}
button{cursor:pointer}
.hidden{display:none!important}
.container{
width:min(100%,1080px);
margin:auto;
padding:2rem 1.8rem;
background:#fff;
border-radius:30px;
box-shadow:0 20px 42px -14px rgba(15,23,42,.18)
}
.page-title{
display:flex;
flex-wrap:wrap;
align-items:center;
gap:12px;
margin-bottom:1.45rem;
padding-bottom:.8rem;
border-bottom:2px solid #e8edf4;
font-size:2.2rem
}
.cloud-status{
display:inline-flex;
align-items:center;
gap:8px;
padding:.35rem .9rem;
border-radius:999px;
background:#f1f5f9;
color:#475569;
font-size:.82rem;
font-weight:500
}
.status-dot{
width:9px;
height:9px;
border-radius:50%;
background:#94a3b8
}
.status-dot.online{background:#22c55e}
.status-dot.offline{background:#ef4444}
.status-dot.syncing{background:#f59e0b}
.toolbar{
display:flex;
flex-wrap:wrap;
justify-content:space-between;
gap:12px;
margin-bottom:1.7rem;
padding-bottom:1rem;
border-bottom:1px solid #e8edf4
}
.toolbar-group{
display:flex;
flex-wrap:wrap;
gap:9px
}
.btn{
min-height:36px;
padding:.45rem 1.1rem;
border:1px solid #cbd5e1;
border-radius:999px;
background:#fff;
color:#334155;
font-size:.86rem;
font-weight:650
}
.btn:hover{background:#f1f5f9}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btn-primary{
border-color:#1e293b;
background:#1e293b;
color:#fff
}
.btn-primary:hover{background:#0f172a}
.btn-danger{
border-color:#fecaca;
background:#fee2e2;
color:#991b1b
}
.btn-danger:hover{background:#fecaca}
.btn-sync{
border-color:#1E40AF;
background:#1E40AF;
color:#fff
}
.last-sync{
color:#94a3b8;
font-size:.8rem
}
.add-section{
margin-bottom:2rem;
padding:1.5rem;
border:1px solid #e2e8f0;
border-radius:23px;
background:#f8fafc
}
.add-section h2,
.list-header h2{
font-size:1.3rem
}
.add-section h2{
margin-bottom:1rem
}
.form-grid{
display:grid;
grid-template-columns:1fr 1fr;
gap:1rem
}
.bookno-tag-row{
grid-column:1/-1;
display:grid;
grid-template-columns:repeat(2,minmax(0,1fr));
gap:1rem
}
.form-group{
display:flex;
flex-direction:column;
gap:5px
}
.form-group.full{
grid-column:1/-1
}
.form-group label{
color:#475569;
font-size:.78rem;
font-weight:700;
letter-spacing:.04em
}
.form-group input,
.form-group select{
width:100%;
min-height:44px;
padding:.72rem 1rem;
border:1px solid #cbd5e1;
border-radius:15px;
background:#fff;
color:#0f172a;
outline:none
}
.form-group input:focus,
.form-group select:focus{
outline:2px solid #93b4ff;
outline-offset:1px;
border-color:transparent
}
.form-group input[readonly]{
background:#f1f5f9;
color:#64748b
}
.clearable-field,
.edit-title-field{
display:grid;
grid-template-columns:minmax(0,1fr) 36px;
gap:6px;
align-items:center
}
.clear-field-btn{
height:44px;
width:36px;
border:1px solid #cbd5e1;
border-radius:12px;
background:#fff;
color:#64748b;
font-weight:800
}
.clear-field-btn:hover{
background:#f1f5f9;
color:#0f172a
}
.add-button{
grid-column:1/-1;
min-height:46px;
border:0;
border-radius:999px;
background:#1e293b;
color:#fff;
font-weight:700
}
.add-button:hover{
background:#0f172a
}
.combo{
position:relative;
border:1px solid #cbd5e1;
border-radius:15px;
background:#fff;
padding:.45rem;
min-height:44px
}
.combo-row{
display:grid;
grid-template-columns:minmax(0,1fr) 44px;
gap:7px
}
.combo-row input{
border:0!important;
border-radius:10px!important;
min-height:38px;
padding:.55rem .7rem
}
.combo-row input:focus{
outline:2px solid #93b4ff!important;
outline-offset:0
}
.combo-toggle{
min-height:38px;
border:1px solid #cbd5e1;
border-radius:12px;
background:#fff;
color:#475569;
font-weight:700
}
.combo-toggle:hover{
background:#f1f5f9
}
.combo-panel{
position:absolute;
left:0;
right:0;
top:calc(44px + 7px);
z-index:650;
max-height:250px;
overflow-y:auto;
padding:.6rem;
border:1px solid #cbd5e1;
border-radius:15px;
background:#fff;
box-shadow:0 15px 30px rgba(15,23,42,.14)
}
.combo-selected{
display:flex;
flex-wrap:wrap;
gap:6px;
margin-bottom:6px
}
.combo-selected:empty{
display:none
}
.combo-option-list{
display:flex;
flex-direction:column;
gap:6px
}
.combo-pill,
.selected-pill{
display:inline-flex;
align-items:center;
max-width:100%;
min-height:34px;
border:1px solid #cbd5e1;
border-radius:999px;
background:#f8fafc;
overflow:hidden
}
.combo-pill{
display:flex;
width:100%;
border-radius:11px
}
.combo-pill.selected{
border-color:#93b4ff;
background:#eaf1ff
}
.combo-pill-select{
flex:1;
min-width:0;
padding:.5rem .7rem;
border:0;
background:transparent;
color:#0f172a;
text-align:left;
white-space:normal;
overflow-wrap:anywhere
}
.combo-pill-select:hover{
background:rgba(226,232,240,.7)
}
.combo-pill-select.keyboard-active{
background:#dbeafe;
color:#1E3A8A;
font-weight:800;
box-shadow:inset 0 0 0 2px #93c5fd
}
.combo-pill-edit,
.combo-pill-delete,
.selected-pill-remove{
flex:0 0 28px;
width:28px;
height:30px;
border:0;
border-radius:50%;
background:transparent;
font-size:.95rem;
font-weight:800;
line-height:1
}
.combo-pill-edit{
color:#15803d
}
.combo-pill-edit:hover{
background:#dcfce7;
color:#166534
}
.combo-pill-delete,
.selected-pill-remove{
margin-right:2px;
color:#991b1b
}
.combo-pill-delete:hover,
.selected-pill-remove:hover{
background:#fee2e2
}
.selected-pill-label{
min-width:0;
padding:.4rem .28rem .4rem .72rem;
color:#334155;
white-space:normal;
overflow-wrap:anywhere
}
.combo-empty{
width:100%;
padding:.75rem;
color:#94a3b8;
text-align:center;
font-size:.82rem
}
.list-header{
display:flex;
align-items:center;
justify-content:space-between;
gap:12px;
margin-bottom:.8rem
}
.count-badge{
min-width:38px;
padding:.22rem .8rem;
border-radius:999px;
background:#e8edf4;
text-align:center;
font-size:.8rem;
font-weight:650
}
.press-list{
border:1px solid #e2e8f0;
border-radius:20px;
overflow:hidden;
background:#fff
}
.press-item{
position:relative;
padding:1rem 1.15rem;
background:#fff
}
.press-item+.press-item{
border-top:2px solid #dbe3ed
}
.press-item:hover{
background:#fafcff
}
.press-head{
display:flex;
align-items:flex-start;
justify-content:space-between;
gap:1rem
}
.press-content{
flex:1;
min-width:0
}
.book-title{
font-size:1.05rem;
font-weight:700;
line-height:1.5;
overflow-wrap:anywhere;
color:#1E40AF
}
.book-title a,
.institution a{
color:#1E40AF;
text-decoration:none
}
.book-title a:hover,
.institution a:hover{
color:#1E3A8A;
text-decoration:underline
}
#institutionOptions a,
#institutionOptions a:visited,
#editInstitutionOptions a,
#editInstitutionOptions a:visited,
#manageInstitutionOptions a,
#manageInstitutionOptions a:visited{
color:#1E40AF!important;
text-decoration:none
}
#institutionOptions a:hover,
#editInstitutionOptions a:hover,
#manageInstitutionOptions a:hover{
color:#1E3A8A!important;
text-decoration:underline
}
.meta{
display:grid;
grid-template-columns:1fr;
gap:.28rem;
margin-top:.45rem;
color:#475569;
font-size:.9rem;
line-height:1.55
}
.meta-row{
display:grid;
grid-template-columns:3.25em minmax(0,1fr);
align-items:start;
column-gap:0;
overflow-wrap:anywhere;
text-align:left
}
.meta-label{
display:block;
width:3.25em;
color:#94a3b8;
white-space:nowrap
}
.meta-value{
display:block;
min-width:0;
margin:0;
padding:0;
overflow-wrap:anywhere
}
.bookshelf-row{
display:grid;
grid-template-columns:3.25em minmax(0,1fr);
align-items:start;
column-gap:0;
text-align:left
}
.bookshelf-text{
display:block;
min-width:0;
margin:0;
padding:0;
overflow-wrap:anywhere
}
.tag-row{
display:grid;
grid-template-columns:3.25em minmax(0,1fr);
align-items:start;
column-gap:0
}
.tag-value{
display:inline-flex;
align-items:center;
flex-wrap:wrap;
min-width:0;
gap:0
}
.entry-tag-checkbox{
flex:0 0 auto;
margin-left:1px;
cursor:pointer
}
.entry-tag-checkbox:disabled{
cursor:not-allowed
}
.edit-btn{
flex:0 0 auto;
position:absolute;
right:1.15rem;
bottom:1rem;
padding:0;
border:0;
background:transparent;
color:#64748b;
font-size:.9rem;
font-family:"Times New Roman","Microsoft YaHei","PingFang SC",serif;
line-height:1.55
}
.edit-btn:hover{
color:#475569
}
.empty-state{
padding:2.6rem 1rem;
background:#fafcff;
color:#94a3b8;
text-align:center
}
.overlay{
position:fixed;
inset:0;
z-index:1000;
display:flex;
align-items:center;
justify-content:center;
padding:12px;
background:rgba(15,23,42,.45);
backdrop-filter:blur(5px)
}
.dialog{
width:min(100%,620px);
max-height:calc(100dvh - 24px);
display:flex;
flex-direction:column;
overflow:hidden;
background:#fff;
border-radius:26px;
box-shadow:0 30px 70px rgba(15,23,42,.28)
}
.dialog-scroll{
flex:1 1 auto;
min-height:0;
overflow-y:auto;
padding:1.7rem 1.7rem 1rem
}
.dialog h3{
margin-bottom:.9rem;
font-size:1.3rem
}
.dialog .form-group{
margin-bottom:.95rem
}
.edit-two-column-row{
display:grid;
grid-template-columns:repeat(2,minmax(0,1fr));
gap:1rem
}
.dialog-actions{
flex:0 0 auto;
display:flex;
gap:9px;
padding:.95rem 1.7rem;
border-top:1px solid #e8edf4;
background:#fff
}
#editModal #editCancel{
margin-left:auto
}
.manage-dialog{
height:min(760px,calc(100dvh - 24px))
}
.manage-fixed-top{
flex:0 0 auto;
padding:1.7rem 1.7rem .9rem;
border-bottom:1px solid #e8edf4
}
.manage-table-scroll{
flex:1 1 auto;
min-height:0;
overflow-y:auto;
padding:.55rem 1.7rem 1rem
}
.manage-add-row{
display:grid;
grid-template-columns:minmax(0,1fr) 92px auto;
gap:8px
}
.manage-option-row{
display:grid;
grid-template-columns:minmax(0,1fr) 86px 30px 30px;
gap:7px;
align-items:center;
min-height:46px;
margin-top:7px;
padding:.35rem .4rem;
border:1px solid #cbd5e1;
border-radius:12px
}
.manage-line-input{
width:100%;
height:34px;
border:1px solid #cbd5e1;
border-radius:9px;
text-align:center
}
#manageModal .dialog-actions{
justify-content:flex-end
}
.toast{
position:fixed;
left:50%;
bottom:28px;
z-index:1500;
max-width:min(90vw,640px);
padding:.78rem 1.5rem;
transform:translateX(-50%);
border-radius:999px;
background:#1E40AF;
color:#fff;
font-size:.88rem;
font-weight:600
}
.toast.success{background:#16a34a}
.toast.error{background:#dc2626}
#returnTopControl{
position:fixed;
right:16px;
top:70%;
z-index:2147483647;
width:25px;
height:25px;
border:0;
border-radius:50%;
background:#1E40AF
}
#tagToggle,
#institutionToggle,
#categoryToggle,
#editTagToggle,
#editInstitutionToggle,
#editCategoryToggle{
display:none!important
}
#addSection .combo,
#editModal .combo{
height:44px;
min-height:44px;
padding:0;
border:1px solid #cbd5e1;
border-radius:15px
}
#addSection .combo-row,
#editModal .combo-row{
display:grid;
grid-template-columns:minmax(0,1fr);
height:42px
}
#addSection .combo-row input,
#editModal .combo-row input{
width:100%;
height:42px;
min-height:42px;
padding:.55rem .9rem!important;
border:0!important;
background:transparent!important
}
#tagOptions .combo-option-list,
#editTagOptions .combo-option-list,
#categoryOptions .combo-option-list,
#editCategoryOptions .combo-option-list{
display:flex;
flex-direction:row;
flex-wrap:wrap;
gap:8px
}
#tagOptions .combo-pill,
#editTagOptions .combo-pill,
#categoryOptions .combo-pill,
#editCategoryOptions .combo-pill{
display:inline-flex;
flex:0 0 auto;
width:auto;
min-height:32px;
border-radius:5px;
background:#fff
}
#tagOptions .combo-pill-select,
#editTagOptions .combo-pill-select,
#categoryOptions .combo-pill-select,
#editCategoryOptions .combo-pill-select{
width:auto;
padding:.42rem .72rem;
font-size:.82rem;
text-align:center;
white-space:nowrap
}
#tagInput,
#categoryInput,
#editTag,
#editCategory{
cursor:text!important;
background:#fff!important;
color:#0f172a!important
}
#tagCombo:has(> .combo-selected:not(:empty)),
#editTagCombo:has(> .combo-selected:not(:empty)){
display:grid!important;
grid-template-columns:minmax(0,46%) minmax(0,1fr)!important;
align-items:center!important;
gap:5px!important
}
#tagCombo > .combo-selected:not(:empty),
#editTagCombo > .combo-selected:not(:empty){
grid-column:1;
grid-row:1;
display:flex;
flex-wrap:nowrap;
align-items:center;
height:42px;
padding:0 .35rem;
overflow-x:auto;
overflow-y:hidden
}
#tagCombo > .combo-selected:not(:empty) + .combo-row,
#editTagCombo > .combo-selected:not(:empty) + .combo-row{
grid-column:2;
grid-row:1;
display:grid!important
}
#tagCombo > .combo-selected:not(:empty) + .combo-row input,
#editTagCombo > .combo-selected:not(:empty) + .combo-row input{
display:block!important
}
#categoryCombo:has(> .combo-selected:not(:empty)),
#editCategoryCombo:has(> .combo-selected:not(:empty)){
display:block!important
}
#categoryCombo > .combo-selected:not(:empty),
#editCategoryCombo > .combo-selected:not(:empty){
display:flex!important;
align-items:center;
width:100%;
height:42px;
padding:0 .45rem;
margin:0
}
#categoryCombo > .combo-selected:not(:empty) + .combo-row,
#editCategoryCombo > .combo-selected:not(:empty) + .combo-row{
display:none!important
}
@media(max-width:700px){
body{padding:.8rem}
.container{
padding:1.25rem;
border-radius:22px
}
.page-title{
font-size:1.8rem
}
.toolbar{
flex-direction:column
}
.form-grid{
grid-template-columns:1fr
}
.bookno-tag-row{
grid-template-columns:1fr
}
.edit-two-column-row{
grid-template-columns:1fr
}
.dialog{
width:100%;
max-height:calc(100dvh - 16px);
border-radius:20px
}
.dialog-scroll{
padding:1.2rem
}
#tagCombo:has(> .combo-selected:not(:empty)),
#editTagCombo:has(> .combo-selected:not(:empty)){
grid-template-columns:minmax(0,50%) minmax(0,1fr)!important
}
}
</style>
</head>
<body>
<div id="pageTopAnchor" aria-hidden="true"></div>
<main class="container">
<h1 class="page-title">
Press
<span class="cloud-status">
<span class="status-dot" id="statusDot"></span>
<span id="statusText">正在读取公开数据…</span>
</span>
</h1>
<section class="toolbar">
<div class="toolbar-group">
<button class="btn btn-sync hidden" id="syncBtn" type="button">同步</button>
<button class="btn" id="configBtn" type="button">配置</button>
<button class="btn" id="manageBtn" type="button">排序</button>
<button class="btn" id="importBtn" type="button">导入</button>
<button class="btn" id="exportBtn" type="button">导出</button>
<input class="hidden" id="importInput" type="file" accept=".html,text/html">
</div>
<span class="last-sync" id="lastSyncTime">公开阅读无需 Token</span>
</section>
<section class="add-section hidden" id="addSection">
<h2>添加</h2>
<div class="form-grid">
<div class="form-group full">
<label for="bookNameInput">书名</label>
<input
type="text"
id="bookNameInput"
autocomplete="off"
autofocus
>
</div>
<div class="bookno-tag-row">
<div class="form-group">
<label for="bookNoInput">书号</label>
<input
type="text"
id="bookNoInput"
autocomplete="off"
>
</div>
<div class="form-group">
<label for="tagInput">编组</label>
<div class="combo" id="tagCombo">
<div
class="combo-selected"
id="tagSelected"
></div>
<div class="combo-row">
<input
type="text"
id="tagInput"
autocomplete="off"
>
<button
class="combo-toggle"
id="tagToggle"
type="button"
aria-label="展开编组选项"
></button>
</div>
<div
class="combo-panel hidden"
id="tagPanel"
>
<div id="tagOptions"></div>
</div>
</div>
</div>
</div>
<div class="form-group full">
<label for="institutionInput">
出版
</label>
<div
class="combo"
id="institutionCombo"
>
<div class="combo-row">
<input
type="text"
id="institutionInput"
autocomplete="off"
>
<button
class="combo-toggle"
id="institutionToggle"
type="button"
aria-label="展开出版历史"
></button>
</div>
<div
class="combo-panel hidden"
id="institutionPanel"
>
<div id="institutionOptions"></div>
</div>
</div>
</div>
<div class="form-group full">
<label for="categoryInput">
书架
</label>
<div
class="combo"
id="categoryCombo"
>
<div
class="combo-selected"
id="categorySelected"
></div>
<div class="combo-row">
<input
type="text"
id="categoryInput"
autocomplete="off"
>
<button
class="combo-toggle"
id="categoryToggle"
type="button"
aria-label="展开书架历史"
></button>
</div>
<div
class="combo-panel hidden"
id="categoryPanel"
>
<div id="categoryOptions"></div>
</div>
</div>
</div>
<button
class="add-button"
id="addBtn"
type="button"
>
添加
</button>
</div>
</section>
<section>
<div class="list-header">
<h2>总表</h2>
<span
class="count-badge"
id="countDisplay"
>
0/0/0
</span>
</div>
<div
class="press-list"
id="pressList"
>
<div class="empty-state">
加载中…
</div>
</div>
</section>
</main>
<section
class="overlay hidden"
id="editModal"
>
<div class="dialog">
<div class="dialog-scroll">
<h3>编辑</h3>
<div class="form-group">
<label for="editBookName">
书名
</label>
<div class="edit-title-field">
<input
autocomplete="off"
id="editBookName"
type="text"
>
<button
class="clear-field-btn"
id="clearEditBookName"
type="button"
aria-label="清空书名"
>
×
</button>
</div>
</div>
<div class="form-group">
<label for="editInstitution">
出版
</label>
<div
class="combo"
id="editInstitutionCombo"
>
<div class="combo-row">
<input
autocomplete="off"
id="editInstitution"
type="text"
>
<button
aria-label="展开出版历史"
class="combo-toggle"
id="editInstitutionToggle"
type="button"
></button>
</div>
<div
class="combo-panel hidden"
id="editInstitutionPanel"
>
<div id="editInstitutionOptions"></div>
</div>
</div>
</div>
<div class="form-group">
<label for="editBookNo">
书号
</label>
<div class="clearable-field">
<input
autocomplete="off"
id="editBookNo"
type="text"
>
<button
class="clear-field-btn"

function norm(value){

orderMap.has(
key(

key(

)

function pathEncode(path){
return String(path)
.split('/')
.filter(Boolean)
.map(
encodeURIComponent
)
.join('/');
}
function toB64(value){
const bytes=
new TextEncoder()
.encode(value);
let binary='';
for(
let i=0;
i<bytes.length;
i+=0x8000
){
binary+=
String.fromCharCode(
...bytes.subarray(
i,
i+0x8000
)
);
}
return btoa(
binary
);
}
function fromB64(value){
const binary=
atob(
String(
value||''
)
.replace(
/\s/g,
''
)
);
const bytes=
new Uint8Array(
binary.length
);
for(
let i=0;
i<binary.length;
i++
){
bytes[i]=
binary.charCodeAt(i);
}
return new TextDecoder()
.decode(
bytes
);
}
async function githubApi(
method,
endpoint,
body=null
){
const response=
await fetch(
`https://api.github.com/repos/${encodeURIComponent(config.owner)}/${encodeURIComponent(config.repo)}/${endpoint}`,
{
method,
headers:{
Authorization:
`Bearer ${config.token}`,
Accept:
'application/vnd.github+json',
'X-GitHub-Api-Version':
'2026-03-10',
...(
body!==null
? {
'Content-Type':
'application/json'
}
: {}
)
},
cache:
'no-store',
...(
body!==null
? {
body:
JSON.stringify(
body
)
}
: {}
)
}
);
const text=
await response.text();
let data=
null;
if(text){
try{
data=
JSON.parse(
text
);
}catch{
data={
message:
text
};
}
}
if(!response.ok){
const error=
new Error(
data?.message ||
`HTTP ${response.status}`
);
error.status=
response.status;
throw error;
}
return data;
}
async function readRemote(){
try{
const data=
await githubApi(
'GET',
`contents/${pathEncode(config.file)}`
);
const parsed=
JSON.parse(
fromB64(
data.content
)
);
return {
exists:true,
sha:
data.sha,
state:
norm(
parsed
)
};
}catch(error){
if(
error.status===404
){
return {
exists:false,
sha:null,
state:
norm({})
};
}
throw error;
}
}
async function writeRemote(
snapshot,
sha
){
const raw=
JSON.stringify(
norm(snapshot),
null,
2
);
if(
new TextEncoder()
.encode(raw)
.length >
MAX_BYTES
){
throw new Error(
'数据超过 750 KB'
);
}
const body={
message:
`更新 Press 数据 - ${new Date().toLocaleString()}`,
content:
toB64(
raw
)
};
if(sha){
body.sha=
sha;
}
const result=
await githubApi(
'PUT',
`contents/${pathEncode(config.file)}`,
body
);
return (
result?.content?.sha ||
null
);
}
async function sync(

){

}
status(
'syncing',
'同步中…'
);
try{
const remote=
await readRemote();
const snapshot=
norm(state);
const sha=
await writeRemote(
snapshot,
remote.sha
);
state=
snapshot;
meta.dirty=
false;
meta.sha=
sha;
saveLocal(
state
);
await idbSet(
META_KEY,
meta
);
status(
'online',
'公开阅读 · 管理已连接'
);
lastSyncTime.textContent=
`已同步 ${new Date().toLocaleString()}`;
if(showResult){

'已同步 GitHub',
'success'
);
}
return true;
}catch(error){
console.error(
error
);
saveLocal(
state
);
meta.dirty=
true;
idbSet(
META_KEY,
meta
)
.catch(
console.error
);
status(
'offline',
'同步失败 · 本地数据已保留'
);
show(
`同步失败：${error.message}`,
'error'
);

}

async function loadPublic(){
status(
'syncing',
'正在读取公开数据…'
);
const url=
publicUrl();
const canFetchPublic=
Boolean(url) &&
/^https?:/i.test(url);
if(!canFetchPublic){
state=
publicCacheValue
? norm(publicCacheValue)
: norm({});
render();
status(
'online',
publicCacheValue
? '本地预览 · 使用缓存'
: '本地预览 · 未读取公开数据文件'
);
lastSyncTime.textContent=
publicCacheValue
? `缓存数据 · ${state.entries.length} 条`
: '本地预览模式';
return;
}
try{
const response=
await fetch(
url,
{
cache:
'no-store'
}
);
if(!response.ok){
throw new Error(
`HTTP ${response.status}`
);
}
state=
norm(
await response.json()
);
publicCacheValue=
state;
await idbSet(
PUBLIC_CACHE_KEY,
{
savedAt:
new Date()
.toISOString(),
state
}
);
render();
status(
'online',
'公开阅读'
);
lastSyncTime.textContent=
`公开数据 · ${state.entries.length} 条`;
}catch(error){
console.error(
error
);
if(
publicCacheValue
){
state=
norm(
publicCacheValue
);
}
render();
status(
'offline',
publicCacheValue
? '公开数据读取失败 · 使用缓存'
: '公开数据读取失败'
);
lastSyncTime.textContent=
publicCacheValue
? `缓存数据 · ${state.entries.length} 条`
: '请确认 press_data.json 与本页同目录';
}
}

function addManagedInstitution(){
const value=
clean(
manageInstitutionInput.value

state.institutions

item=>
key(item)===
key(value)

'error'
);

}
let line=
Number(
folded(
manageInstitutionLineInput
.value
)
);
if(
!Number.isInteger(
line
)
){
line=
state
.institutions
.length+
1;
}
line=
Math.max(
1,
Math.min(
line,
state

1

value

function moveManagedInstitution(
value,
rawLine
){
const history=[
...state.institutions
];
const from=
history.findIndex(
item=>
key(item)===
key(value)
);
if(from<0){
return;
}
let line=
Number(
folded(
rawLine
)
);
if(
!Number.isInteger(
line
) ||
line<1 ||
line>
history.length
){
renderManageInstitutionOptions();
return;
}
const [item]=
history.splice(
from,
1
);
history.splice(
line-1,
0,
item
);
state.institutions=
history;
render();
schedule();
}
function renameManagedInstitution(
value

const index=
state.institutions
.findIndex(
item=>
key(item)===
key(value)
);

return;

'修改出版选项：',
state.institutions[
index
]
);
if(next===null){
return;
}
const cleaned=
clean(
next
);
if(!cleaned){
return;
}
const oldKey=
key(value);
state.institutions[
index
]=
cleaned;
for(
const entry
of state.entries

if(
key(
entry.institution
)===
oldKey

cleaned;
}
}

schedule();
